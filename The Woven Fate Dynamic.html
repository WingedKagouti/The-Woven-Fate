/* ---- Browser-side API target handling ----
   Calls are made directly from the browser (no backend proxy), so the user
   points the app at whatever endpoint they want \u2014 the real Anthropic API
   with their own key, a self-hosted proxy, or anything else that speaks the
   same /v1/messages shape \u2014 and supplies a matching key, or none at all if
   the target doesn't require one. Multiple named targets can be saved side
   by side and switched between; everything is persisted only in this
   browser's localStorage and is never hardcoded in source. */
const API_TARGETS_STORAGE_KEY = "woven_fate_api_targets";
const ACTIVE_TARGET_STORAGE_KEY = "woven_fate_active_target_id";
const LEGACY_API_KEY_STORAGE_KEY = "woven_fate_api_key"; // pre-multi-target, migrated on load

function getStoredApiTargets(){
  try{
    const raw = window.localStorage.getItem(API_TARGETS_STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function setStoredApiTargets(targets){
  try{ window.localStorage.setItem(API_TARGETS_STORAGE_KEY, JSON.stringify(targets)); }catch(e){}
}
function getStoredActiveTargetId(){
  try{ return window.localStorage.getItem(ACTIVE_TARGET_STORAGE_KEY) || ""; }
  catch(e){ return ""; }
}
function setStoredActiveTargetId(id){
  try{
    if(id) window.localStorage.setItem(ACTIVE_TARGET_STORAGE_KEY, id);
    else window.localStorage.removeItem(ACTIVE_TARGET_STORAGE_KEY);
  }catch(e){}
}
/* One-time migration: an earlier version of this file stored a single bare
   API key against the hardcoded Anthropic endpoint. If that's all we find,
   turn it into the first saved target so nobody loses their key. */
function migrateLegacyApiKeyIfNeeded(){
  try{
    const existing = getStoredApiTargets();
    if(existing.length) return existing;
    const legacyKey = window.localStorage.getItem(LEGACY_API_KEY_STORAGE_KEY);
    if(!legacyKey) return existing;
    const migrated = [{id:newId(), name:"Anthropic (default)", url:API_CONFIG.defaultUrl, key:legacyKey}];
    setStoredApiTargets(migrated);
    setStoredActiveTargetId(migrated[0].id);
    window.localStorage.removeItem(LEGACY_API_KEY_STORAGE_KEY);
    return migrated;
  }catch(e){ return getStoredApiTargets(); }
}

/* ============================== PROVIDER REGISTRY ============================== */
/* Different services speak completely different request/response shapes
   (Anthropic's Messages API, OpenAI's Chat Completions, Google's Gemini
   generateContent, ...). Each entry below knows how to build a request and
   how to pull plain text (or an error) back out of that service's specific
   response shape, so the rest of the app can keep calling one function and
   just getting a string back, regardless of which service answered.

   NOTE on defaults: the "defaultModel" values and guessed endpoint paths
   are best-effort, current as of this writing, and shown only as
   placeholders/fallbacks \u2014 model names in particular go stale quickly.
   Anyone can always type an exact model name, or paste a full endpoint URL
   (including its path) into the Service URL field, to override the guess. */

function openAiCompatibleBuildRequest({apiKey,model,messages,system,maxTokens}){
  const headers = {"Content-Type":"application/json"};
  if(apiKey) headers["Authorization"] = `Bearer ${apiKey}`;
  const chatMessages = [
    ...(system ? [{role:"system", content:system}] : []),
    ...messages.map(m=>({role:m.role, content:m.content})),
  ];
  return {headers, body:{model, max_tokens:maxTokens, messages:chatMessages}};
}
function openAiCompatibleParseText(data){
  const choice = data.choices && data.choices[0];
  const content = choice && choice.message && choice.message.content;
  return typeof content==="string" ? content : null;
}
function openAiCompatibleParseError(data){
  if(!data || !data.error) return null;
  const err = data.error;
  const message = typeof err==="string" ? err : (err.message||JSON.stringify(err));
  const type = (typeof err==="object" && (err.type||err.code)) || "unknown";
  return {type:String(type), message};
}

const PROVIDER_LIST = Object.values(PROVIDERS);

function isLocalOrIpHost(hostname){
  if(!hostname) return true;
  if(hostname==="localhost") return true;
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(hostname)) return true; // IPv4
  if(hostname==="::1" || hostname.startsWith("[")) return true; // IPv6
  return false;
}
/* Returns a provider id guessed from the URL's hostname, or null if it's a
   localhost/IP address (ambiguous \u2014 caller must ask the user) or simply
   doesn't match any known service (falls back to the generic OpenAI-
   compatible option, still requiring confirmation via the dropdown). */
function detectProviderId(url){
  const host = safeHostname(url);
  if(isLocalOrIpHost(host)) return null;
  for(const p of PROVIDER_LIST){
    if(p.hostnames.some(h => host===h || host.endsWith("."+h))) return p.id;
  }
  return null;
}
function resolveEndpointUrl(baseUrl, providerDef, model){
  let u;
  try{ u = new URL(baseUrl); }catch(e){ return baseUrl; }
  const hasPath = u.pathname && u.pathname!=="/";
  if(hasPath) return baseUrl; // already a full endpoint \u2014 respected exactly as typed
  return providerDef.buildUrl(u.origin.replace(/\/$/,""), model);
}

/* ============================== STORAGE SHIM =============================
   The original artifact ran in an environment providing a global
   `window.storage` key/value API. This standalone HTML file has no such
   backend, so it is reimplemented here on top of localStorage with the
   exact same async shape ({key,value} / null), so all the app logic above
   it is untouched. Everything is namespaced under "woven_fate::" so it
   won't collide with anything else on the page's origin. */
(function(){
  const NS = "woven_fate::";
  function lsKey(k){ return NS + (k?1:0) + "::" + k; } // shared/private share the same origin here
  window.storage = {
    async get(key, shared){

    async delete(key, shared){

function buildSystem(mood,setting,engine,playerInfo,isJudge){
  isJudge = isJudge||false;
  const sl = SETTING_SYSTEM[setting] || setting;
  const md = MOOD_SYSTEM[mood] || "balanced";
  const ed = ENGINE_SYSTEM[engine] || ENGINE_SYSTEM.story_driven;
  const pBits=[];
  if(playerInfo && playerInfo.gender && playerInfo.gender!=="undefined") pBits.push(`gender: ${playerInfo.gender}`);
  if(playerInfo && playerInfo.desc) pBits.push(`description: ${playerInfo.desc}`);
  const pLine = pBits.length ? `\n\nThe player character (always addressed as "you") has the following fixed traits \u2014 keep these consistent in every scene: ${pBits.join("; ")}.` : "";
  const memLine = (playerInfo && playerInfo.memoryContext) ? `\n\nStory so far (for continuity \u2014 do not restate verbatim, just stay consistent with it):\n${playerInfo.memoryContext}` : "";
  const itemsLine = (playerInfo && playerInfo.itemsContext) ? `\n\nThe player currently carries:\n${playerInfo.itemsContext}` : "";
  const loreLine = (playerInfo && playerInfo.loreContext) ? `\n\nWorld lore (established canon \u2014 stay consistent with it, use it naturally when relevant, never quote it or mention a lorebook):\n${playerInfo.loreContext}` : "";
  const condLine = (playerInfo && playerInfo.conditionsContext) ? `\n\n${playerInfo.conditionsContext}` : "";
  if(isJudge) return `You are a game master running a ${sl} setting with this plot engine: ${ed}. Analyse player actions. Respond ONLY with raw JSON \u2014 no markdown, no explanation.${pLine}${memLine}${itemsLine}${condLine}${loreLine}`;
  return `You are the game master of a ${sl} setting RPG. Plot engine: ${ed}. Tone: ${md}. Write immersive prose in second person ("You\u2026"). No game-mechanics language. Never break the fourth wall.${pLine}${memLine}${itemsLine}${condLine}${loreLine}\n\nCRITICAL RULE: Never write any dialogue, speech, decisions, or actions performed BY the player character. Other characters may speak and act freely, and you may describe things happening TO or AROUND the player, but the player alone decides what they say or do next. Always end your response at a moment that leaves the next action open to the player \u2014 do not narrate or imply what they say, choose, or do.\n\nFormatting:\n- Wrap character/creature names in **double asterisks**\n- Wrap location/place names in *single asterisks*\n- Always use straight double quotes " " for any spoken dialogue, never single quotes\n- Never wrap dialogue in asterisks or combine it with italics \u2014 dialogue should be plain text inside its quotes\n- Do not wrap anything else`;
}

function memoryContextString(memory,books){
  const bits=[];
  const latestBook = books && books.length ? books[books.length-1] : null;
  if(latestBook) bits.push(`Story so far (Book "${latestBook.title}"): ${latestBook.summary}`);
  const acts=memory.acts.slice(-CONTEXT_ACTS_LIMIT);
  if(acts.length) bits.push(`Since the last chapter: ${acts.map(a=>a.text).join(" ")}`);
  let events=memory.events.slice(-CONTEXT_EVENTS_LIMIT);
  if(events.length<2 && latestBook && latestBook.events && latestBook.events.length){
    const bridge=latestBook.events.slice(-2);
    events=[...bridge,...events];
  }
  if(events.length) bits.push(`Recent events: ${events.map(e=>e.text).join(" \u00b7 ")}`);
  return bits.join("\n");
}

function itemsContextString(player){
  const bits=[];
  if(player.tools) bits.push(`Tools of the trade (${player.tools.occupation}): ${player.tools.kit}`);
  if(player.keyItems.length) bits.push(`Key items carried: ${player.keyItems.map(i=>i.name+(i.desc?` (${i.desc})`:"")).join(", ")}`);
  if(player.items.length) bits.push(`General items carried: ${player.items.map(i=>i.name+(i.desc?` (${i.desc})`:"")).join(", ")}`);
  return bits.join("\n");
}

function conditionsContextString(player){
  const c = player.conditions || {superficial:[],moderate:[],severe:[],positive:[]};
  const bits=[];
  const neg=[...c.moderate.map(x=>`${x.label} (moderate)`),...c.severe.map(x=>`${x.label} (severe)`)];

  if(c.positive.length) bits.push(`Active positive conditions (may work in the player's favor \u2014 factor into any challenge modifier): ${c.positive.map(x=>x.label).join(", ")}`);
  return bits.length ? `The player's active conditions:\n${bits.join("\n")}` : "";
}

async function callClaude(messages,system,maxTokens){
  const target = activeTarget();
  if(!target){
    openSettingsModal();
    throw new Error("No API target selected \u2014 add or choose one via the settings icon in the header.");
  }
  const providerDef = PROVIDERS[target.provider] || PROVIDERS.anthropic;
  const model = (target.model && target.model.trim()) || providerDef.defaultModel;
  const endpoint = resolveEndpointUrl(target.url, providerDef, model);
  const {headers, body} = providerDef.buildRequest({
    apiKey: target.key, model, messages, system, maxTokens: maxTokens||API_CONFIG.maxTokens,
  });

  const _t0=Date.now();
  let res;
  try{
    res = await fetch(endpoint, {method:"POST", headers, body:JSON.stringify(body)});
  }catch(networkErr){
    throw new Error(`Network error \u2014 could not reach "${target.name}" (${networkErr.message})`);
  }
  let data;
  try{ data = await res.json(); }
  catch(e){ throw new Error(`Bad response from "${target.name}" (HTTP ${res.status})`); }

  const errInfo = providerDef.parseError(data);
  if(errInfo){
    const ty = errInfo.type, m = errInfo.message;
    if(providerDef.id==="anthropic" && (ty==="rate_limit_error"||ty==="overloaded_error"||ty==="exceeded_limit")){
      const resetDate = extractResetTimestamp(errInfo.raw) || extractResetTimestamp(m);
      const resetStr = resetDate ? formatResetTime(resetDate) : null;
      throw new Error(resetStr ? `Rate limited / overloaded \u2014 limit resets around ${resetStr}` : `Rate limited / overloaded \u2014 try again shortly (${m})`);
    }
    if(/rate.?limit/i.test(ty) || res.status===429) throw new Error(`Rate limited / overloaded on "${target.name}" \u2014 try again shortly (${m})`);
    if(ty==="invalid_request_error") throw new Error(`Invalid request to "${target.name}" (${m})`);
    if(ty==="authentication_error"||ty==="permission_error"||res.status===401||res.status===403){
      openSettingsModal();
      throw new Error(`Auth/permission error on "${target.name}" \u2014 check its API key (${m})`);
    }
    throw new Error(`API error from "${target.name}" [${ty}]: ${m}`);
  }
  if(!res.ok){
    throw new Error(`"${target.name}" returned HTTP ${res.status} with an unrecognized response shape`);
  }
  const text = providerDef.parseText(data);
  if(typeof text!=="string" || !text) throw new Error(`Empty or unrecognized response from "${target.name}" (check the Service Type is set correctly)`);
  S.dbgAcc.calls++; S.dbgAcc.ms+=Date.now()-_t0;
  return text;
}
/* LLMs sometimes wrap JSON in markdown code fences, or occasionally return
   malformed JSON outright. Strip fences defensively, then fall back to a
   safe default (and log) rather than letting a parse error crash a turn. */
function safeHostname(url){

function safeParseJSON(input, fallback){
  if(fallback===undefined) fallback=null;
  try{
    const cleanInput = String(input).replace(/```json|```/g,"").trim();
    return JSON.parse(cleanInput);
  }catch(err){
    console.error("safeParseJSON: JSON parsing failed, returning fallback state", err, input);
    return fallback;
  }
}
const parseJSON = safeParseJSON; // kept as an alias so existing call sites are unaffected
function extractResetTimestamp(errVal){
  let obj=errVal;
  if(typeof obj==="string"){
    try{ obj=JSON.parse(obj); }
    catch(e){
      const match=obj.match(/\{[\s\S]*\}/);
      if(match){ try{ obj=JSON.parse(match[0]); }catch(e2){ return null; } }
      else return null;
    }
  }
  if(!obj || typeof obj!=="object") return null;
  const candidates=[
    obj.resetsAt,
    obj.windows && obj.windows["5h"] && obj.windows["5h"].resets_at,
    obj.resolved && obj.resolved.limit && obj.resolved.limit.resets_at,
    obj.resets_at,
  ];
  for(const c of candidates){
    if(c===undefined||c===null) continue;
    const d = typeof c==="number" ? new Date(c*1000) : new Date(c);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}
function formatResetTime(date){
  try{ return date.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }
  catch(e){ return null; }
}
function looksLikeDecline(text){
  if(!text) return false;
  const t=text.trim().toLowerCase();
  const patterns=[
    /^i can'?t (help|continue|write|assist|do that|create)/,
    /^i won'?t /,
    /^i'?m (not (able|going) to|unable to)/,
    /^i (must|have to) decline/,
    /^sorry,? i can'?t/,
    /i don'?t feel comfortable/,
    /against (my|anthropic'?s) (guidelines|policies)/,
    /i'?m not comfortable (writing|continuing|depicting)/,
  ];
  return patterns.some(p=>p.test(t));
}

function escapeHtml(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* Mirrors renderText() from the original tsx: turns **bold** / *italic* /
   "quoted" text into styled spans. Returns an HTML string (already escaped). */
function renderTextHtml(text){
  if(!text) return "";
  return text.split(/\n\n+/).map((para,pi)=>{
    const regex=/\*\*(.+?)\*\*|\*(.+?)\*|"([^"]+)"|\u201c([^\u201d]+)\u201d|(?:^|[\s(*])'((?:[^']|'(?=[a-zA-Z]))*?)'(?=[\s,.!?;:]|$)/g;
    let last=0,match; const parts=[];
    while((match=regex.exec(para))!==null){
      if(match.index>last) parts.push(escapeHtml(para.slice(last,match.index)));
      if(match[1]) parts.push(`<strong style="color:var(--nb);font-weight:600">${escapeHtml(match[1])}</strong>`);
      else if(match[2]) parts.push(`<em style="color:var(--ni);font-style:italic">${escapeHtml(match[2])}</em>`);
      else if(match[5]!==undefined){
        const lead = match[0].startsWith("'") ? "" : match[0][0];
        if(lead) parts.push(escapeHtml(lead));
        parts.push(`<span style="color:var(--dlg);font-weight:600">'${escapeHtml(match[5])}'</span>`);
      } else {
        const spoken = match[3]!==undefined ? match[3] : match[4];
        const isStraight = match[3]!==undefined;
        const openQ = isStraight ? '"' : "\u201c";
        const closeQ = isStraight ? '"' : "\u201d";
        parts.push(`<span style="color:var(--dlg);font-weight:600">${openQ}${escapeHtml(spoken)}${closeQ}</span>`);
      }
      last=match.index+match[0].length;
    }
    if(last<para.length) parts.push(escapeHtml(para.slice(last)));
    return `<p style="margin:${pi===0?"0":"10px 0 0"}">${parts.join("")}</p>`;
  }).join("");
}

const BAD_KEYS=new Set(["__proto__","constructor","prototype"]);
const LORE_FILE_MAX_CHARS=2000000;
/* Strips C0/C1 controls (keeps \n and \t), zero-width/BOM and bidi-override characters; normalises line breaks. */
const CTRL_RE=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B\u2060-\u2064\u202A-\u202E\u2066-\u2069\uFEFF\uFFF9-\uFFFB]/g;
function cleanText(s,max){
  s=String(s).replace(/\r\n?|[\u2028\u2029]/g,"\n").replace(CTRL_RE,"");
  return max&&s.length>max?s.slice(0,max):s;
}
/* Recursively rebuilds parsed JSON: drops prototype-pollution keys (checked after cleaning), cleans strings, caps depth/size. */
function sanitizeDeep(v,depth,c){
  depth=depth||0; c=c||{n:0};
  if(++c.n>200000) throw new Error("File has too many values.");
  if(depth>16) throw new Error("File is nested too deeply.");
  if(typeof v==="string") return cleanText(v,100000);
  if(typeof v==="number") return Number.isFinite(v)?v:0;
  if(v===null||typeof v==="boolean") return v;
  if(Array.isArray(v)){
    if(v.length>20000) throw new Error("File has an array that is too long.");
    return v.map(x=>sanitizeDeep(x,depth+1,c));
  }
  if(typeof v==="object"){
    const o={};
    for(const k of Object.keys(v)){
      const ck=cleanText(k,200);
      if(BAD_KEYS.has(ck)||BAD_KEYS.has(k)) continue;
      o[ck]=sanitizeDeep(v[k],depth+1,c);
    }
    return o;
  }
  return undefined;
}
function safeParseJSON(text,maxChars){
  if(typeof text!=="string") throw new Error("File is not text.");
  if(text.length>maxChars) throw new Error("File is too large.");
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  return sanitizeDeep(JSON.parse(text,(k,v)=>BAD_KEYS.has(k)?undefined:v));
}
function checkFileObject(file,maxBytes){
  if(!/\.json$/i.test(file.name||"") && !/json/i.test(file.type||"")) throw new Error("Please choose a .json file.");
  if(file.size>maxBytes) throw new Error("File is too large.");
}

function validateSave(d){

  if(d.msgs.length>5000||d.msgs.some(m=>!m||typeof m!=="object"||!isStr(m.type))) bad();
  if(d.history!==undefined&&(!isArr(d.history)||d.history.length>200||d.history.some(m=>!m||(m.role!=="user"&&m.role!=="assistant")||!isStr(m.content)))) bad();
  for(const k of ["characters","items","keyItems","completedQuests","names","books"]) if(d[k]!==undefined&&!isArr(d[k])) bad();
  for(const k of ["mood","setting","engine","gender","desc"]) if(d[k]!==undefined&&d[k]!==null&&!isStr(d[k])) bad();
  if(d.lorebook) d.lorebook=normalizeLorebook(d.lorebook); else delete d.lorebook;
  if(d.dynLore){
    const dl=d.dynLore; if(typeof dl!=="object"||isArr(dl)) bad();
    d.dynLore={story:isStr(dl.story)?dl.story.slice(0,1500):"",budget:Math.min(100000,Math.max(500,Math.floor(Number(dl.budget))||4000)),
      turn:Math.max(0,Math.floor(Number(dl.turn))||0),pending:[],
      entries:(isArr(dl.entries)?dl.entries:[]).slice(0,150).filter(e=>e&&isStr(e.name)&&isStr(e.content)&&isArr(e.keys)).map(e=>({
        name:e.name.slice(0,100),keys:e.keys.filter(isStr).map(k=>k.slice(0,64)).slice(0,12),content:e.content.slice(0,600),
        priority:Math.min(10,Math.max(1,Math.round(Number(e.priority))||5)),turn:Math.floor(Number(e.turn))||0}))};
  }
  return d;
}

/* ============================== LOREBOOK ============================== */
const LORE_DEFAULT_BUDGET=8000, LORE_SCAN_MESSAGES=4;
function normalizeLorebook(d){
  if(!d || typeof d!=="object" || !Array.isArray(d.entries)) throw new Error("No \"entries\" array found.");
  if(d.entries.length>1000) throw new Error("Too many entries (max 1000).");
  const entries=d.entries.map(e=>({
    name:cleanText((e&&e.name)||"Untitled",100).trim()||"Untitled",
    keys:(Array.isArray(e&&e.keys)?e.keys:[]).slice(0,50)
      .map(k=>cleanText(k,64).trim().replace(/\*+/g,"*"))
      .filter(k=>/[\p{L}\p{N}]/u.test(k) && (k.match(/\*/g)||[]).length<=2),  // needs a real character; max 2 wildcards (ReDoS guard)
    content:cleanText((e&&e.content)||"",10000).trim(),
    priority:Math.min(10,Math.max(1,Math.round(Number(e&&e.priority))||5)),
  })).filter(e=>e.content && e.keys.length);
  if(!entries.length) throw new Error("No usable entries (each needs keys and content).");
  const cap=n=>Math.min(100000,n);
  const b=Number(d.character_budget), fb=cap(b>0?Math.floor(b):LORE_DEFAULT_BUDGET);
  /* file_budget keeps the file's own value so a manual override (character_budget) can be reset. */
  const ob=Number(d.file_budget);
  return {name:cleanText(d.name||"Lorebook",100),description:cleanText(d.description||"",500),
    character_budget:fb,file_budget:ob>0?cap(Math.floor(ob)):fb,entries};
}
/* Normalise curly quotes, then match a key as a whole word/phrase; "*" matches any word characters. */
function loreNorm(t){ return String(t).slice(-20000).toLowerCase().replace(/[\u2018\u2019]/g,"'"); }
const LORE_RE_CACHE=new Map();
function loreKeyRegex(key){
  let re=LORE_RE_CACHE.get(key); if(re) return re;
  if(LORE_RE_CACHE.size>5000) LORE_RE_CACHE.clear();
  re=loreKeyRegexBuild(key); LORE_RE_CACHE.set(key,re); return re;
}
function loreKeyRegexBuild(key){
  const parts=loreNorm(key).split("*").map(x=>x.replace(/[.+?^${}()|[\]\\]/g,"\\$&"));
  return new RegExp("(^|[^\\p{L}\\p{N}])"+parts.join("[\\p{L}\\p{N}_]*")+"(?![\\p{L}\\p{N}])","u");
}
function entryMatches(entry,text){ return entry.keys.some(k=>{ try{ return loreKeyRegex(k).test(text); }catch(e){ return false; } }); }
/* Matched entries are tried priority 1 -> 10 (random order within a priority). An entry that
   doesn't fit the remaining budget is skipped and the rest are still tried. */
/* Select entries from a lorebook-shaped object ({entries}) into a character budget (content length only). */
function loreSelect(lb,scan,budget){
  const text=loreNorm(scan);
  const matched=lb.entries.filter(e=>entryMatches(e,text));
  const out=[], added=[]; let remaining=budget;
  for(let pr=1;pr<=10 && remaining>0;pr++){
    for(const e of shuffle(matched.filter(x=>x.priority===pr))){
      if(e.content.length<=remaining){ out.push(`[${e.name}] ${e.content}`); added.push(e); remaining-=e.content.length; }
    }
  }
  return {ctx:out.join("\n\n"),stats:{has:true,triggered:matched.length,added:added.map(e=>e.name),
    skipped:matched.filter(e=>!added.includes(e)).map(e=>e.name),used:budget-remaining,budget}};
}
function loreScanText(extra){ return `${S.history.slice(-LORE_SCAN_MESSAGES).map(m=>m.content).join("\n")}\n${extra||""}`; }
function buildLoreContext(extraText){
  const lb=S.lorebook; if(!lb){ S.lastLoreStats={has:false}; return ""; }
  const r=loreSelect(lb,loreScanText(extraText),lb.character_budget); S.lastLoreStats=r.stats; return r.ctx;
}

/* ============================== DYNAMIC LORE ============================== */
const DYN_MAX_ENTRIES=150, DYN_MAX_ENTRY=600, DYN_MAX_STORY=1500;
function blankDynLore(){ return {story:"",entries:[],budget:4000,turn:0,pending:[]}; }
function seedDynLoreFromLegacy(d){
  const bk=(d.books||[]).slice(-1).map(b=>b.summary), m=d.memory||{};
  const story=[...bk,...(m.acts||[]).map(a=>a.text),...(m.events||[]).map(e=>e.text)].filter(Boolean).join(" ");
  return {...blankDynLore(),story:story.slice(-DYN_MAX_STORY)};
}
/* The story-so-far entry is always on and is charged to the dynamic budget first; keyed entries fill the rest. */
function buildDynContext(extraText){
  const d=S.dynLore, st=(d.story||"").trim();
  const r=loreSelect(d,loreScanText(extraText),Math.max(0,d.budget-st.length));
  S.lastDynStats={...r.stats,story:st.length,budget:d.budget,used:r.stats.used+st.length};
  return [st?`[Story so far] ${st}`:"",r.ctx].filter(Boolean).join("\n\n");
}
async function updateDynLore(action,text){
  const d=S.dynLore; d.turn++;
  d.pending=[...(d.pending||[]),{action:action||"",text}].slice(-3); // failed updates are retried with the next turn
  const turns=d.pending.map(p=>`${p.action?`Player: ${p.action}\n`:""}Story: ${p.text}`).join("\n\n");
  const rel=loreSelect(d,turns,2500).ctx;
  const stat=S.lorebook?S.lorebook.entries.map(e=>e.name).join(", "):"none";
  const prompt=`You maintain the long-term memory of an interactive story. Update it from the new turn(s) below.\n\nStory so far:\n${d.story||"(empty)"}\n\nExisting entry names: ${d.entries.map(e=>e.name).join(", ")||"none"}\n\nRelevant existing entries:\n${rel||"none"}\n\nStatic world lore already known (do not duplicate): ${stat}\n\nNew turn(s):\n${turns}\n\nReturn ONLY raw JSON: {"story":"full rewritten story-so-far under ${DYN_MAX_STORY} characters (condense older parts), or null if unchanged","entries":[{"name":"...","keys":["aliases, nicknames, titles"],"content":"lasting facts, under ${DYN_MAX_ENTRY} characters","priority":1-10}]}\nRules: entries are for NPCs, places, factions, notable items, open plot threads/promises and relationships. Record lasting facts only, not moment-to-moment action. To update an existing entry reuse its exact name and give its full new content. Skip trivia; return an empty entries array if nothing lasting happened. Priority: 1-3 plot-critical, 4-6 important and recurring, 7-10 background.`;
  let p=null;
  try{ p=parseJSON(await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",1500),null); }catch(e){}
  if(!p || typeof p!=="object") return {created:0,updated:0,failed:true};
  d.pending=[];
  let created=0,updated=0;
  if(typeof p.story==="string" && p.story.trim()) d.story=p.story.trim().slice(0,DYN_MAX_STORY);
  for(const r of (Array.isArray(p.entries)?p.entries:[])){
    const name=String((r&&r.name)||"").trim(), content=String((r&&r.content)||"").trim().slice(0,DYN_MAX_ENTRY);
    if(!name||!content) continue;
    const keys=[...new Set([name,...(Array.isArray(r.keys)?r.keys:[])].map(k=>String(k).trim()).filter(Boolean))].slice(0,12);
    const e={name,keys,content,priority:Math.min(10,Math.max(1,Math.round(Number(r.priority))||5)),turn:d.turn};
    const i=d.entries.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
    if(i>=0){ d.entries[i]=e; updated++; } else { d.entries.push(e); created++; }
  }
  if(d.entries.length>DYN_MAX_ENTRIES){ // drop least important, then least recently touched
    d.entries.sort((a,b)=>b.priority-a.priority||a.turn-b.turn);
    d.entries=d.entries.slice(d.entries.length-DYN_MAX_ENTRIES);
  }
  return {created,updated};
}

function loadLorebookFile(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  try{ checkFileObject(file,LORE_FILE_MAX_CHARS); }

  const reader=new FileReader();
  reader.onload=fev=>{
    try{ S.lorebook=normalizeLorebook(safeParseJSON(fev.target.result,LORE_FILE_MAX_CHARS)); S.lorebookMsg={ok:true,text:`Loaded "${S.lorebook.name}".`}; }
    catch(e){ S.lorebookMsg={ok:false,text:`Couldn't load lorebook: ${e.message}`}; }
    persistSession(); renderLorebookModal(); refreshLorebookSetupRow(); ev.target.value="";
  };
  reader.readAsText(file);
}

async function extractState(narrativeText,pInfo,curQuest,curKey,curItems,curChars,curTools,curConditions){

    const toolsLine = curTools ? `Tools of the Trade kit (fixed baseline gear \u2014 NEVER log these or close variants of them as itemsGained, they are not new pickups): ${curTools.kit}` : "Tools of the Trade kit: none set";
    const knownCharsLine = curChars.map(c=>{
      const namesArr = (c.names||[c.name]).filter(Boolean);
      const primary = namesArr[0]||"Unknown";
      const aliasTag = namesArr.length>1 ? ` [also known as: ${namesArr.slice(1).join(", ")}]` : "";
      const roleTag = c.role ? `role: ${c.role}` : "role: unknown";
      const noteTag = c.note ? `; ${c.note}` : "";
      return `${primary}${aliasTag} (${roleTag}${noteTag})`;
    }).join("; ")||"none";
    const cond = curConditions || DEFAULT_CONDITIONS;
    const condLine = `Current conditions \u2014 superficial: ${cond.superficial.map(c=>c.label).join(", ")||"none"}; moderate: ${cond.moderate.map(c=>c.label).join(", ")||"none"}; severe: ${cond.severe.map(c=>c.label).join(", ")||"none"}; positive: ${cond.positive.map(c=>c.label).join(", ")||"none"}`;
    const prompt=`Recent narration:\n"""${narrativeText}"""\n\nCurrent quest: ${curQuest?`${curQuest.title} \u2014 ${curQuest.desc}`:"none"}\n${toolsLine}\nCurrent key items: ${curKey.map(i=>i.name).join(", ")||"none"}\nCurrent general items: ${curItems.map(i=>i.name).join(", ")||"none"}\nKnown characters (with what's known about them so far): ${knownCharsLine}\n${condLine}\n\nAnalyse ONLY what this narration establishes. Return ONLY raw JSON:\n{\n "questUpdate": {"action":"set"|"update"|"complete"|"none","title":"...","desc":"..."},\n "itemsGained": [{"name":"...","desc":"...","key":boolean}],\n "itemsLost": ["exact name", ...],\n "characterUpdates": [{"name":"...","present":true|false,"status":"ally|hostile|neutral|unknown|romantic|deceased|other or null","note":"short one-line description/relationship, or null","role":"short stable descriptor of their occupation/role/abilities, or null","alsoKnownAs":"an ADDITIONAL name/alias for this character being genuinely revealed or established this turn (e.g. a hero's civilian identity, or vice versa) \u2014 both names remain valid and may both be used going forward; or null","replaces":"exact prior name from the Known characters list above, ONLY if this character was previously tracked under a different name or generic placeholder (e.g. 'Rescued Hostage') and has now been properly identified as the same individual \u2014 else null"}],\n "conditionsGained": [{"tier":"superficial"|"moderate"|"severe"|"positive","label":"short name","desc":"short description"}],\n "conditionsResolved": ["exact label", ...],\n "sceneEnded": true|false\n}\nRules: For questUpdate \u2014 use "set" ONLY when there was no active quest and a brand-new one is being established. Use "update" when the ALREADY-active quest's specifics, title, or immediate objective are being refined/progressed but it is fundamentally the same overarching goal \u2014 do NOT use "set" for this, that incorrectly signals a brand new quest to the player. Use "complete" when the active quest has just been fully resolved. Use "none" if nothing quest-related changed. Don't invent goals from flavor text alone. Only list itemsGained if something tangible was NEWLY acquired this turn \u2014 never for gear that is part of the Tools of the Trade kit above (that kit is always already carried, mentioning it again is not a new pickup). Only list itemsLost if something was clearly consumed, destroyed, given away, lost, or stolen. key=true only for plot-critical, irreplaceable items.\nFor characterUpdates: include a named, significant character (not background extras) whenever they are present in this scene OR clearly just left/exited it. Only reference characters from the Known characters list, or genuinely new characters actually appearing in THIS narration \u2014 never reuse a name from the Known characters list for an unrelated new character just because it happens to be listed as "known". Set "present" to true if they are in the scene right now, false if they just departed. ONLY set "status" and "note" if something about the character's relationship, disposition, or situation actually changed this turn \u2014 otherwise leave them as null so their prior relationship/description is preserved untouched. NEVER use status or note to describe mere absence (e.g. never write "not present" as a status or note) \u2014 absence is communicated only via "present":false. Use "replaces" to merge a newly-identified character with their prior placeholder entry instead of creating a duplicate. Use "role" to record a STABLE descriptor of who/what this character fundamentally is \u2014 their occupation, position, or abilities (e.g. "Academy student", "History teacher", "City Watch detective") \u2014 and ONLY set it the first time this is established, or if it is later revealed to be genuinely different than previously understood; leave it null on every other turn so it is never overwritten by a description of their current action or last appearance. Do not conflate "role" with "note" \u2014 "note" is for relationship/situation/what just happened, "role" is for their enduring identity. If a known character's role is listed as "unknown" above and this narration provides or clearly implies information that would establish it \u2014 even if this isn't their first appearance \u2014 set "role" now to fill that gap. Use "alsoKnownAs" when a character is revealed to have a second, ongoing identity that will continue to be used alongside their current name (e.g. a hero's secret identity) \u2014 both names stay valid and remain displayed together; this is NOT the same as "replaces", which is only for fully retiring a placeholder label (like "Rescued Hostage") that was never really a name in the first place. When referencing an existing character via "name" or "replaces", use exactly ONE of their individual known names \u2014 never a combined form, and never text like "[also known as: ...]" (that bracketed text is display formatting only, never a real name to echo back).\nFor conditions: only add a new condition if this narration clearly shows the player being hurt, weakened, poisoned, cursed, exhausted, or similarly afflicted (negative), or meaningfully buffed/inspired/emboldened (positive) \u2014 never for flavor text alone. Tier guidance for negative conditions: "superficial" = minor and self-resolving with time (bruises, minor scrapes, being winded); "moderate" = notable but treatable with a deliberate action (a real wound, poisoning, being shaken); "severe" = serious, requiring both treatment and time (a broken bone, a deep wound, a serious curse). Positive conditions are understood to last only for the current scene. List a condition in "conditionsResolved" (by its EXACT current label) ONLY when this narration clearly shows the player actively treating, healing, or otherwise resolving it \u2014 not merely time passing. Set "sceneEnded" to true only when a distinct scene/encounter/conversation has just concluded (a chase or fight that moves through several locations still counts as ONE scene; a new conversation, even in the same location as the last, counts as a NEW scene). Do not invent conditions unsupported by the narration.`;
    const raw = await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",500);
    const parsed = parseJSON(raw,{questUpdate:{action:"none"},itemsGained:[],itemsLost:[],characterUpdates:[],conditionsGained:[],conditionsResolved:[],sceneEnded:false});

    if(parsed.questUpdate && (parsed.questUpdate.action==="set" || parsed.questUpdate.action==="update")){
      const p = S.player;
      p.quest = {title:parsed.questUpdate.title, desc:parsed.questUpdate.desc, startedBookId: p.quest ? p.quest.startedBookId : undefined};
    } else if(parsed.questUpdate && parsed.questUpdate.action==="complete"){
      S.player.quest = null;
    }
    if(Array.isArray(parsed.itemsLost) && parsed.itemsLost.length){
      S.player.keyItems = S.player.keyItems.filter(i=>!parsed.itemsLost.includes(i.name));
      S.player.items = S.player.items.filter(i=>!parsed.itemsLost.includes(i.name));
    }
    let rejected = {key:[],general:[]};
    if(Array.isArray(parsed.itemsGained) && parsed.itemsGained.length){
      const lostNames = parsed.itemsLost||[];
      const curKeyAfterLoss = curKey.filter(i=>!lostNames.includes(i.name));
      const curItemsAfterLoss = curItems.filter(i=>!lostNames.includes(i.name));
      let newKey=[...curKeyAfterLoss];
      let newItems=[...curItemsAfterLoss];
      for(const ng of parsed.itemsGained){
        if(!ng.name)continue;
        if(ng.key){
          if(newKey.find(i=>i.name===ng.name))continue;
          if(newKey.length>=MAX_KEY){ rejected.key.push(ng.name); continue; }
          newKey.push({name:ng.name,desc:ng.desc});
        } else {
          if(newItems.find(i=>i.name===ng.name))continue;
          if(newItems.length>=MAX_ITEMS){ rejected.general.push(ng.name); continue; }
          newItems.push({name:ng.name,desc:ng.desc});
        }
      }
      S.player.keyItems = newKey;
      S.player.items = newItems;
    }
    parsed.rejected = rejected;
    if(Array.isArray(parsed.characterUpdates) && parsed.characterUpdates.length){
      let chars=[...S.player.characters];
      for(let cu of parsed.characterUpdates){
        if(!cu.name)continue;
        if(cu.name.includes(" / ")) cu={...cu,name:cu.name.split(" / ")[0].trim()};
        if(cu.alsoKnownAs && cu.alsoKnownAs.includes(" / ")) cu={...cu,alsoKnownAs:null};
        const idx=chars.findIndex(c=>(c.names||[c.name]).includes(cu.name) || (cu.replaces && (c.names||[c.name]).includes(cu.replaces)));
        const prior = idx>=0 ? chars[idx] : null;
        if(idx>=0) chars.splice(idx,1);

        let namesArr;
        if(cu.replaces && prior){
          namesArr=[cu.name];
        } else {
          namesArr = prior ? [...(prior.names||[prior.name]).filter(Boolean)] : [];
          if(!namesArr.includes(cu.name)) namesArr.push(cu.name);
        }
        if(cu.alsoKnownAs && !namesArr.includes(cu.alsoKnownAs)) namesArr.push(cu.alsoKnownAs);

        const entry={
          names:namesArr,
          status:cu.status || (prior && prior.status) || "unknown",
          note:cu.note || (prior && prior.note) || "",
          role:cu.role || (prior && prior.role) || "",
          present: cu.present!==undefined ? !!cu.present : true,
        };
        chars.push(entry);
      }
      if(chars.length>MAX_CHARS){
        const questText = curQuest ? `${curQuest.title} ${curQuest.desc}` : "";
        const isProtected = (namesArr) => namesArr.some(n=>narrativeText.includes(n)||questText.includes(n));
        let i=0;
        while(chars.length>MAX_CHARS && i<chars.length){
          if(!isProtected(chars[i].names||[chars[i].name])){ chars.splice(i,1); }
          else { i++; }
        }
      }
      S.player.characters = chars;
    }

    let condResult = {
      superficial:[...cond.superficial],
      moderate:[...cond.moderate],
      severe:[...cond.severe],
      positive:[...cond.positive],
    };
    if(Array.isArray(parsed.conditionsResolved)){
      for(const label of parsed.conditionsResolved){
        const midx=condResult.moderate.findIndex(c=>c.label===label);
        if(midx>=0){ condResult.moderate.splice(midx,1); continue; }
        const sidx=condResult.severe.findIndex(c=>c.label===label);
        if(sidx>=0 && !condResult.severe[sidx].treatmentStarted){
          condResult.severe[sidx]={...condResult.severe[sidx],treatmentStarted:true,turnsLeft:3};
        }
      }
    }
    if(parsed.sceneEnded){ condResult.positive=[]; }
    let questFailedByConditions=false;
    let rejectedConditions=[];
    if(Array.isArray(parsed.conditionsGained)){
      for(const cg of parsed.conditionsGained){
        if(!cg.label)continue;
        if(cg.tier==="positive"){
          if(condResult.positive.length<MAX_COND) condResult.positive.push({label:cg.label,desc:cg.desc||""});
          continue;
        }
        let currentTier = ["superficial","moderate","severe"].includes(cg.tier) ? cg.tier : "superficial";
        let desc=cg.desc||"";
        let placed=false;
        while(!placed){
          if(currentTier==="superficial"){
            if(condResult.superficial.length<MAX_COND){ condResult.superficial.push({label:cg.label,desc,turnsLeft:3}); placed=true; }
            else { currentTier="moderate"; desc = desc ? `${desc} \u2014 worse than it looks.` : "Worse than it looks."; }
          } else if(currentTier==="moderate"){
            if(condResult.moderate.length<MAX_COND){ condResult.moderate.push({label:cg.label,desc}); placed=true; }
            else { currentTier="severe"; desc = desc ? `${desc} \u2014 worse than it looks.` : "Worse than it looks."; }
          } else {
            if(condResult.severe.length<MAX_COND){ condResult.severe.push({label:cg.label,desc,treatmentStarted:false,turnsLeft:null}); placed=true; }
            else {
              if(curQuest) questFailedByConditions=true;
              rejectedConditions.push(cg.label);
              placed=true;
            }
          }
        }
      }
    }
    condResult.superficial = condResult.superficial.map(c=>({...c,turnsLeft:c.turnsLeft-1})).filter(c=>c.turnsLeft>0);
    condResult.severe = condResult.severe.map(c=> c.treatmentStarted ? {...c,turnsLeft:c.turnsLeft-1} : c).filter(c=> !c.treatmentStarted || c.turnsLeft>0);
    S.player.conditions = condResult;
    parsed.questFailedByConditions=questFailedByConditions;
    parsed.rejectedConditions=rejectedConditions;

    return parsed;
  }catch(e){return null;}
}

async function collapseEventsIfNeeded(events,acts){
  if(events.length<=EVENTS_LIMIT) return {events,acts};
  const toCollapse=events.slice(0,EVENTS_COLLAPSE);
  const rest=events.slice(EVENTS_COLLAPSE);
  try{
    const raw2=await callClaude([{role:"user",content:`Condense the following journal events into a single short paragraph (3-4 sentences) summarizing this stretch of the story as a chapter/act overview:\n\n${toCollapse.map(e=>"- "+e.text).join("\n")}\n\nReturn ONLY raw JSON: {"act":"..."}`}],"Respond ONLY with raw JSON, no markdown.",400);
    const parsed2=parseJSON(raw2,null);
    return {events:rest,acts:[...acts,{text:(parsed2&&parsed2.act)?parsed2.act:toCollapse.map(e=>e.text).join(" ")}]};
  }catch(e){
    return {events:[...toCollapse,...rest],acts};
  }
}

async function tagQuestFromExtraction(text,pInfo,freshState){
  const fs=freshState||{};
  const qCur = fs.quest!==undefined?fs.quest:S.player.quest;
  const kCur = fs.keyItems!==undefined?fs.keyItems:S.player.keyItems;
  const iCur = fs.items!==undefined?fs.items:S.player.items;
  const cCur = fs.characters!==undefined?fs.characters:S.player.characters;
  const tCur = fs.tools!==undefined?fs.tools:S.player.tools;
  const ndCur = fs.conditions!==undefined?fs.conditions:S.player.conditions;
  const qu=await extractState(text,pInfo,qCur,kCur,iCur,cCur,tCur,ndCur);
  const qAction = qu && qu.questUpdate ? qu.questUpdate.action : undefined;
  if(qAction==="set"){
    const startedBookId = S.books.length ? S.books[S.books.length-1].id : null;
    if(S.player.quest) S.player.quest = {...S.player.quest, startedBookId};
  }
  if(qAction==="complete"){
    const completedTitle=(qCur&&qCur.title)||qu.questUpdate.title||"";
    const completedDesc=(qCur&&qCur.desc)||qu.questUpdate.desc||"";
    const startedBookId=(qCur&&qCur.startedBookId)!==undefined?qCur.startedBookId:null;
    S.player.completedQuests=[...(S.player.completedQuests||[]),{title:completedTitle,desc:completedDesc,startedBookId,completedBookId:null,outcome:"completed"}];
    await appendJournalEvents([`Completed the quest "${completedTitle}"${completedDesc?`: ${completedDesc}`:""}`]);
    if(S.memory.acts.length>=BOOK_SUGGEST_ACTS || S.memory.events.length>=BOOK_SUGGEST_EVENTS){
      S.bookSuggestion = true;
    }
  }
  if(qu && qu.questFailedByConditions && qCur){
    const failedTitle=qCur.title||"";
    const failedDesc=qCur.desc||"";
    const startedBookId=qCur.startedBookId!==undefined?qCur.startedBookId:null;
    S.player.quest=null;
    S.player.completedQuests=[...(S.player.completedQuests||[]),{title:failedTitle,desc:failedDesc,startedBookId,completedBookId:null,outcome:"failed"}];
    await appendJournalEvents([`Failed the quest "${failedTitle}"${failedDesc?`: ${failedDesc}`:""} \u2014 worn down by accumulated injury.`]);
  }
  if(qu && (qAction==="set"||qAction==="update"||qAction==="complete"||(qu.questFailedByConditions&&qCur)||(qu.rejected&&qu.rejected.key&&qu.rejected.key.length)||(qu.rejected&&qu.rejected.general&&qu.rejected.general.length)||(qu.rejectedConditions&&qu.rejectedConditions.length))){
    const a=[...S.msgs];
    const last={...a[a.length-1]};
    if(qAction==="set"||qAction==="update"||qAction==="complete"){
      last.questTag={
        action:qAction,
        title: qAction==="complete" ? ((qCur&&qCur.title)||qu.questUpdate.title) : qu.questUpdate.title
      };
    }
    if(qu.questFailedByConditions && qCur){
      last.questTag={action:"fail",title:qCur.title||""};
    }
    if((qu.rejected&&qu.rejected.key&&qu.rejected.key.length)||(qu.rejected&&qu.rejected.general&&qu.rejected.general.length)){
      last.inventoryFullTag={key:(qu.rejected&&qu.rejected.key)||[],general:(qu.rejected&&qu.rejected.general)||[]};
    }
    if(qu.rejectedConditions && qu.rejectedConditions.length){
      last.conditionsFullTag=qu.rejectedConditions;
    }
    a[a.length-1]=last;
    S.msgs=a;
  }
  return qu;
}

async function compactHistory(newHistory){
  /* Fork: no summarising. Facts are captured per turn by updateDynLore, so old turns just fall out of the window. */
  let h=newHistory.slice(-HISTORY_LIMIT);
  if(h.length && h[0].role!=="user") h=h.slice(1);
  S.history=h;
}

async function refreshAutosaveMeta(){
  try{
    const r=await window.storage.get(saveKey(AUTOSAVE_ID));
    if(r && r.value){ const d=JSON.parse(r.value); S.autosaveMeta={name:d.name,mood:d.mood,setting:d.setting,engine:d.engine,savedAt:d.savedAt}; }
    else S.autosaveMeta=null;
  }catch(e){ S.autosaveMeta=null; }
}

function handleToggleAutosave(){

    s.autosaveEnabled = !s.autosaveEnabled;
    window.storage.set("autosave_pref", s.autosaveEnabled?"on":"off").catch(()=>{});
  });
}

async function performAutosave(narratorCountAtCall){
  try{
    const engineLabel = S.engine!=="story_driven" ? ` ${labelFor(ENGINES,S.engine)}` : "";
    const namesSuffix = (S.player.names && S.player.names.length) ? ` \u2014 ${S.player.names.join(" / ")}` : "";
    const name = `Autosave \u2014 ${labelFor(MOODS,S.mood)} ${labelFor(SETTINGS,S.setting)}${engineLabel}${namesSuffix}`;
    const payload={name,msgs:S.msgs.filter(m=>m.type!=="error"),history:S.history,mood:S.mood,setting:S.setting,engine:S.engine,
      gender:S.player.gender,desc:S.player.desc.trim(),quest:S.player.quest,keyItems:S.player.keyItems,items:S.player.items,tools:S.player.tools,
      characters:S.player.characters,completedQuests:S.player.completedQuests,memory:S.memory,books:S.books,names:S.player.names,conditions:S.player.conditions,lorebook:S.lorebook,dynLore:S.dynLore,
      savedAt:Date.now(),isAutosave:true};
    const payloadStr=JSON.stringify(payload);
    if(byteLength(payloadStr)>SAVE_SIZE_LIMIT_BYTES){
      throw new Error("Autosave failed \u2014 this tale is too large to save (near the per-save storage limit). Manual saves will likely fail too \u2014 export your progress and free up space.");
    }
    const res=await window.storage.set(saveKey(AUTOSAVE_ID),payloadStr);
    if(!res) throw new Error("Autosave failed \u2014 storage write did not complete. You may be at your total storage limit; manual saves will likely fail too.");
    S.autosaveMeta={name,mood:S.mood,setting:S.setting,engine:S.engine,savedAt:payload.savedAt};
    S.lastSaveTurnCount=narratorCountAtCall;
    S.saveTracking={...S.saveTracking,result:"autosaved",message:null};
    render();
    setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },2200);
  }catch(err){
    S.saveTracking={...S.saveTracking,result:"error",message:err.message||"Autosave failed."};
    render();
    setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },5000);
  }
}

function maybeAutosave(){
  if(!S.autosaveEnabled || busy() || autosaveInFlight) return;
  const narratorCount = S.msgs.filter(m=>m.type==="narrator").length;
  if(narratorCount - S.lastSaveTurnCount >= AUTOSAVE_INTERVAL){
    autosaveInFlight=true;
    performAutosave(narratorCount).finally(()=>{ autosaveInFlight=false; });
  }
}

function takeDebugSnapshot(text){
  const d={lore:S.lastLoreStats,dyn:S.lastDynStats,calls:S.dbgAcc.calls,ms:S.dbgAcc.ms,chars:(text||"").length};
  S.dbgAcc={calls:0,ms:0};
  return d;
}
async function commitNarrative(text,userContent,extraFields){
  extraFields = {debug:takeDebugSnapshot(text),...(extraFields||{})};
  S.msgs=[...S.msgs,{type:"narrator",text,...extraFields}];
  appendMessage(S.msgs[S.msgs.length-1]); // targeted DOM update: append, don't rebuild the log
  const newHistory = userContent===null ? [...S.history,{role:"assistant",content:text}] : [...S.history,{role:"user",content:userContent},{role:"assistant",content:text}];
  await compactHistory(newHistory);
  const [,dynRes]=await Promise.all([tagQuestFromExtraction(text,playerInfo()),updateDynLore(userContent,text)]);
  const lastMsg=S.msgs[S.msgs.length-1]; if(lastMsg && lastMsg.debug) lastMsg.debug.dynOps=dynRes;
  refreshLastMessageNode(); // tagQuestFromExtraction may have annotated the message just appended
  S.dbgAcc={calls:0,ms:0};
  updateBooksUI();
}

async function runStep(coreFn,retryKind,retryPayload,replaceIdx){
  if(replaceIdx!==undefined){
    S.msgs = S.msgs.filter((_,i)=>i!==replaceIdx);
    removeMessageNode(replaceIdx);
  }
  S.status="narrating";
  render();
  try{
    const nextStatus=await coreFn();
    S.status=nextStatus||"idle";
  }catch(err){
    S.msgs=[...S.msgs,{type:"error",text:err.message||"Error",retry:{kind:retryKind,payload:retryPayload}}];
    S.status="idle";
    appendMessage(S.msgs[S.msgs.length-1]);
  }
  render();
  persistSession();
  scrollBottom();
  maybeAutosave();
  const inputEl=document.getElementById("mainInput");
  if(inputEl) inputEl.focus();
}

async function narratorTurnCore(action){
  const pInfo=playerInfo(typeof action==="string"?action:"");
  const raw=await callClaude([...S.history,{role:"user",content:`Player action: "${action}"\n\nConsider the player's carried items/gear, described skills/background, and active conditions (given in the system context) when evaluating this action. Decide ONE of:\n- "narrative": no real stakes (looking, walking, simple talk) \u2014 just continue the story.\n- "item_resolution": the action plausibly and directly resolves itself by expending ONE specific general item the player carries (e.g. using a bandage to tend a wound) \u2014 no challenge needed. Only use this if a specific carried general item is clearly suited and would reasonably be used up by this exact action. Key items and Tools of the Trade are never expended this way.\n- "challenge": meaningful stakes exist (combat, persuasion, stealth, danger, deception, magic, etc).\n\nFor "challenge", assess whether the player's gear/skills favor success, work against them, both (which cancel out to neutral), or neither \u2014 and also factor in the player's active moderate/severe negative conditions (working against them) and positive conditions (working in their favor), using this same single modifier tier. Never let superficial conditions influence this. Multiple favorable or unfavorable factors never stack beyond a single tier.\n\nRaw JSON only:\n{"resolution":"narrative"|"item_resolution"|"challenge","narrative":"continuation text for narrative/item_resolution, ending open with no player dialogue/actions written, or null for challenge","itemExpended":"exact carried item name for item_resolution, else null","modifier":"favorable"|"unfavorable"|"neutral","reason":"short phrase shown to the player explaining the modifier, or null if neutral"}`}],buildSystem(S.mood,S.setting,S.engine,pInfo,true));
  const parsed=parseJSON(raw,null);
  if(!parsed || typeof parsed!=="object" || !parsed.resolution){
    if(looksLikeDecline(raw)){
      throw new Error("The story engine declined to continue this scene as described. Try rephrasing your action.");
    }
    throw new Error("The story engine's response couldn't be understood (malformed reply)");
  }

  if(parsed.resolution==="item_resolution"){
    if(parsed.itemExpended){
      S.player.items = S.player.items.filter(i=>i.name!==parsed.itemExpended);
    }
    await commitNarrative(parsed.narrative||"...",action);
  } else if(parsed.resolution==="challenge"){
    const modifier = (parsed.modifier==="favorable"||parsed.modifier==="unfavorable") ? parsed.modifier : "neutral";
    const buttons = modifier==="favorable" ? shuffle(["success","fate","fate"])
                   : modifier==="unfavorable" ? shuffle(["failure","fate","fate"])
                   : shuffle(["success","failure","fate"]);
    S.challengeData={buttons,pending:action,revealed:null,modifier,reason:parsed.reason||null};
    S.history=[...S.history,{role:"user",content:action}];
    return "awaiting_choice";
  } else {
    await commitNarrative(parsed.narrative||"...",action);
  }
}

async function outcomeTurnCore(pendingV,outcome,meta){
  const pInfo=playerInfo();
  const narrative=await callClaude([...S.history,{role:"user",content:`Player attempted: "${pendingV}". Outcome: ${outcome} \u2014 ${meta.desc}.\n${outcome==="success"?"Narrate triumph.":outcome==="failure"?"Narrate setback.":outcome==="mitigated_success"?"Success with complication.":"Failure with silver lining."} 2\u20133 paras, second person. Bold names, italicise places. End the scene open \u2014 do not write what the player says or does next.`}],buildSystem(S.mood,S.setting,S.engine,pInfo));
  await commitNarrative(narrative,pendingV,{outcomeMeta:meta});
}

async function continueTurnCore(){

}

/* ── Books ── */
async function generateBookProposal(){
  const newBookId = newId();
  const eventsToArchive = S.memory.events;
  const actsToArchive = S.memory.acts;
  const questsToFile = (S.player.completedQuests||[]).filter(q=>q.completedBookId===null);
  const ongoingQuest = S.player.quest;

  const questSummaryLines = [
    ...questsToFile.map(q=>`- "${q.title}" (${q.outcome==="failed"?"failed":"completed"}): ${q.desc}`),
    ...(ongoingQuest ? [`- "${ongoingQuest.title}" (still ongoing): ${ongoingQuest.desc}`] : [])
  ].join("\n") || "None";

  const histText = S.history.map(h=>`${h.role==="user"?"Player":"Story"}: ${h.content}`).join("\n") || "None";
  const eventsText = eventsToArchive.map(e=>"- "+e.text).join("\n") || "None";
  const actsText = actsToArchive.map(a=>"- "+a.text).join("\n") || "None";

  const prompt=`You are closing out a chapter ("Book") of an ongoing story. Below is everything that has happened since the last Book (or since the story began, if this is the first).\n\nRecent raw scenes:\n${histText}\n\nEvents since last Book:\n${eventsText}\n\nActs since last Book:\n${actsText}\n\nQuests active in this span:\n${questSummaryLines}\n\nPlayer character's current description: "${S.player.desc.trim()||"none given"}"\n\nWrite:\n1. A short evocative chapter title (5-8 words).\n2. A comprehensive but concise "story so far" summary (5-8 sentences) covering everything that happened in this span, preserving named characters, open threads, and specific commitments \u2014 this will REPLACE all the detailed events/acts above as the ongoing memory of this period, so do not omit anything a future scene might need to stay consistent with.\n3. OPTIONAL character evolution: if events in this span plausibly changed something about the player character's outlook, reputation, relationships, or manner (NOT their core identity, name, or gender), propose a short addendum sentence reflecting that growth. If nothing has meaningfully changed, return null.\n\nReturn ONLY raw JSON: {"title":"...","summary":"...","characterEvolution":"... or null"}`;

  const raw=await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",900);
  const parsed=parseJSON(raw,null);
  if(!parsed || !parsed.title || !parsed.summary){
    if(looksLikeDecline(raw)){
      throw new Error("The story engine declined to summarize this chapter as described. Try again, or start the Book from a different point.");
    }
    throw new Error("Could not generate a Book summary \u2014 try again.");
  }
  return {newBookId,eventsToArchive,actsToArchive,questsToFile,ongoingQuest,title:parsed.title,summary:parsed.summary,characterEvolution:parsed.characterEvolution||null};
}

async function handleStartBook(){
  if(busy())return;

  S.bookSuggestion=false;

    S.modalTab="book";
    S.tabsViewed={book:true,personality:!proposal.characterEvolution};
  }catch(err){
    S.msgs=[...S.msgs,{type:"error",text:err.message||"Error",retry:{kind:"book",payload:{}}}];
    S.status="idle";
    appendMessage(S.msgs[S.msgs.length-1]);
  }
  render();
  persistSession();
}

function handleConfirmBook(){
  if(!S.bookModal)return;
  const {newBookId,eventsToArchive,actsToArchive,questsToFile,ongoingQuest,title,summary,charChoice,charText}=S.bookModal;

  const newBookQuests=[];
  const earlierBookNotes={};
  for(const q of questsToFile){
    const failed = q.outcome==="failed";
    if(q.startedBookId && q.startedBookId!==newBookId){
      newBookQuests.push({title:q.title,desc:q.desc,note:failed?"Failed here \u2014 began in an earlier chapter.":"Concluded here \u2014 began in an earlier chapter."});
      earlierBookNotes[q.startedBookId]=earlierBookNotes[q.startedBookId]||[];
      earlierBookNotes[q.startedBookId].push({title:q.title,desc:q.desc,note:failed?"Began here \u2014 failed in a later chapter.":"Began here \u2014 concluded in a later chapter."});
    } else {
      newBookQuests.push({title:q.title,desc:q.desc,note:failed?"Failed here.":"Completed here."});
    }
  }
  if(ongoingQuest){
    newBookQuests.push({title:ongoingQuest.title,desc:ongoingQuest.desc,note:"Ongoing \u2014 continues beyond this chapter."});
  }

  const newBook={id:newBookId,title,summary,quests:newBookQuests,events:eventsToArchive,acts:actsToArchive,closedAt:Date.now()};

  S.books = S.books.map(b=> earlierBookNotes[b.id] ? {...b,quests:[...b.quests,...earlierBookNotes[b.id]]} : b);
  S.books = [...S.books, newBook];

  S.memory = {events:eventsToArchive.slice(-2), acts:[]};

  const filedTitles=new Set(questsToFile.map(q=>q.title));
  S.player.completedQuests = (S.player.completedQuests||[]).map(q=> (filedTitles.has(q.title)&&q.completedBookId===null) ? {...q,completedBookId:newBookId} : q);
  S.player.quest = S.player.quest && !S.player.quest.startedBookId ? {...S.player.quest,startedBookId:newBookId} : S.player.quest;
  S.player.desc = (charChoice==="accept"||charChoice==="edit") && charText.trim() ? `${S.player.desc.trim()} ${charText.trim()}`.trim() : S.player.desc;

  S.bookModal=null;
  S.activeBookTab=S.books.length-1;
  S.msgs=[...S.msgs,{type:"bookmark",text:title}];
  S.status="idle";
  render(); // safety-net refresh (panels, save bar, input state, etc.)
  appendMessage(S.msgs[S.msgs.length-1]); // targeted: just append the bookmark divider
  persistSession();
}

function handleChoice(idx){
  if(!S.challengeData||S.challengeData.revealed)return;
  const btnType=S.challengeData.buttons[idx];
  const outcome=btnType==="fate"?OUTCOMES[Math.floor(Math.random()*4)]:btnType;
  const pendingV=S.challengeData.pending;
  S.challengeData={...S.challengeData,revealed:{idx,outcome,btnType}};
  render();
  setTimeout(async()=>{
    const meta=OUTCOME_META[outcome];
    await runStep(()=>outcomeTurnCore(pendingV,outcome,meta),"choice",{pending:pendingV,outcome,meta});
    S.challengeData=null;
    render();
  },1800);

function handleRegenerate(idx,retry){
  if(busy())return;
  if(retry.kind==="start"){
    S.msgs = S.msgs.filter((_,i)=>i!==idx);
    startGame();
  } else if(retry.kind==="continue"){
    S.msgs = S.msgs.filter((_,i)=>i!==idx);
    removeMessageNode(idx);
    handleContinue();
  } else if(retry.kind==="submit"){
    runStep(()=>narratorTurnCore(retry.payload.action),"submit",retry.payload,idx);
  } else if(retry.kind==="choice"){
    runStep(()=>outcomeTurnCore(retry.payload.pending,retry.payload.outcome,retry.payload.meta),"choice",retry.payload,idx);
  } else if(retry.kind==="book"){
    S.msgs = S.msgs.filter((_,i)=>i!==idx);
    removeMessageNode(idx);
    handleStartBook();
  }
}

/* ── Entry points ── */
async function startGame(){
  const m=S.mood, s=S.setting, e=S.engine, g=S.player.gender, d=S.player.desc;
  gameMounted=false; // force a full remount \u2014 this wipes the previous tale's log
  S.screen="game";
  S.msgs=[];
  S.saveTracking={activeSaveId:null,turnsAtSave:0,result:null,message:null};
  S.history=[];
  S.memory=JSON.parse(JSON.stringify(DEFAULT_MEMORY));
  S.dynLore=blankDynLore();
  S.books=[];
  S.bookSuggestion=false; S.bookModal=null;
  S.suggestions=null; S.suggOpen=false;
  S.lastSaveTurnCount=0;
  S.player.quest=null; S.player.keyItems=[]; S.player.items=[]; S.player.characters=[]; S.player.completedQuests=[]; S.player.names=[]; S.player.conditions=JSON.parse(JSON.stringify(DEFAULT_CONDITIONS));
  S.status="narrating";
  render();
  S.dbgAcc={calls:0,ms:0};
  const results = await Promise.all([deriveTools(g,d,s,e), deriveCharacterNames(d)]);
  const toolsResult=results[0], namesResult=results[1];
  S.player.tools=toolsResult; S.player.names=namesResult;
  const sObj=SETTINGS.find(x=>x.key===s); const sl=sObj?sObj.label:s;
  const eObj=ENGINES.find(x=>x.key===e); const el=eObj?eObj.label:e;
  const ml=(MOODS.find(x=>x.key===m)||{}).label||m;
  const pInfo={gender:g,desc:d.trim(),loreContext:buildLoreContext(d)};
  const pBits=[];
  if(g!=="undefined") pBits.push(`a ${g} character`);
  if(d.trim()) pBits.push(`described as: ${d.trim()}`);
  pBits.push(`occupation: ${toolsResult.occupation} (carries: ${toolsResult.kit})`);
  const pClause = ` The player character is ${pBits.join(", ")}.`;
  const metaLine = `${ml} \u00b7 ${sl} \u00b7 ${el}`;
  S.msgs=[{type:"meta",text:metaLine}];
  const msgListEl=document.getElementById("msgList");
  if(msgListEl) msgListEl.innerHTML = renderMsgListHtml();

  await runStep(async()=>{
    const text=await callClaude([{role:"user",content:`Begin a new story set in a ${sl} world, with a ${el==="Story-Driven"?"plot that emerges naturally from the setting":el+" plot engine"}, and a ${ml} tone.${pClause} Vivid atmospheric opening, immediate tension, end on a moment of choice. 2\u20133 paragraphs, second person. Bold character names, italicise place names.`}],buildSystem(m,s,e,pInfo));
    S.msgs=[...S.msgs,{type:"narrator",text,debug:takeDebugSnapshot(text)}];
    appendMessage(S.msgs[S.msgs.length-1]);
    S.history=[{role:"assistant",content:text}];
    await tagQuestFromExtraction(text,pInfo,{tools:toolsResult,quest:null,keyItems:[],items:[],characters:[],conditions:JSON.parse(JSON.stringify(DEFAULT_CONDITIONS))});
    refreshLastMessageNode();
  },"start",{});
}

/* ── Save management ── */
async function handleSaveCurrent(asNew){
  if(busy())return;
  S.status="saving";
  render();
  const id = (!asNew && S.saveTracking.activeSaveId) ? S.saveTracking.activeSaveId : newId();
  const existing = S.saveList.find(s=>s.id===id);
  let name = existing ? existing.name : undefined;
  if(!name){
    const engineLabel = S.engine!=="story_driven" ? ` ${labelFor(ENGINES,S.engine)}` : "";
    const namesSuffix = (S.player.names && S.player.names.length) ? ` \u2014 ${S.player.names.join(" / ")}` : "";
    name = `${labelFor(MOODS,S.mood)} ${labelFor(SETTINGS,S.setting)}${engineLabel} Tale${namesSuffix}`;
  }
  let resultMsg=null;
  try{
    const payload={name,msgs:S.msgs.filter(m=>m.type!=="error"),history:S.history,mood:S.mood,setting:S.setting,engine:S.engine,
      gender:S.player.gender,desc:S.player.desc.trim(),quest:S.player.quest,keyItems:S.player.keyItems,items:S.player.items,tools:S.player.tools,
      characters:S.player.characters,completedQuests:S.player.completedQuests,memory:S.memory,books:S.books,names:S.player.names,conditions:S.player.conditions,lorebook:S.lorebook,dynLore:S.dynLore,
      savedAt:Date.now()};
    const payloadStr=JSON.stringify(payload);
    if(byteLength(payloadStr)>SAVE_SIZE_LIMIT_BYTES){
      throw new Error("This tale is too large to save (near the per-save storage limit). Export it now to back it up, then free space by deleting other saves.");
    }
    const res=await window.storage.set(saveKey(id),payloadStr);
    if(!res) throw new Error("Storage write did not complete \u2014 you may be at your total storage limit for this game.");
    const ids=await getSaveIndex();
    if(!ids.includes(id)){ids.push(id);await setSaveIndex(ids);}
    S.saveTracking={activeSaveId:id,turnsAtSave:S.msgs.filter(m=>m.type==="narrator").length,result:"saved",message:null};
    S.lastSaveTurnCount=S.msgs.filter(m=>m.type==="narrator").length;
    await refreshSaveList();
  }catch(err){
    resultMsg = err.message || "Unknown error";
    S.saveTracking={...S.saveTracking,result:"error",message:resultMsg};
  }
  S.status="idle";
  render();
  setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },resultMsg?5000:2200);
}

async function handleLoadSave(id){
  if(busy())return;
  S.status="loading_save";
  render();
  try{
    const r=await window.storage.get(saveKey(id));
    if(!r || !r.value){
      S.saveTracking={...S.saveTracking,result:"error",message:null};
      S.status="idle";
      render();
      return;
    }
    const d=parseStoredSave(r.value);
    S.msgs=d.msgs||[]; S.history=d.history||[]; S.mood=d.mood||null;
    S.setting=d.setting||null; S.engine=d.engine||"story_driven";
    S.player={
      gender:d.gender||"undefined",desc:d.desc||"",
      quest:d.quest||null,keyItems:d.keyItems||[],items:d.items||[],tools:d.tools||null,
      characters:(d.characters||[]).map(c=>{
        const base = c.names?c:{...c,names:[c.name].filter(Boolean)};
        const cleaned=[...new Set(base.names.filter(n=>n && !n.includes(" / ")))];
        return {...base,names: cleaned.length?cleaned:base.names};
      }),completedQuests:d.completedQuests||[],names:d.names||[],
      conditions:d.conditions||JSON.parse(JSON.stringify(DEFAULT_CONDITIONS)),
    };
    S.memory=d.memory||JSON.parse(JSON.stringify(DEFAULT_MEMORY));
    S.lorebook=d.lorebook||null;
    S.dynLore=d.dynLore?{...blankDynLore(),...d.dynLore}:seedDynLoreFromLegacy(d);
    S.books=d.books||[];
    S.activeBookTab=Math.max(0,(d.books||[]).length-1);
    S.saveTracking={activeSaveId:id,turnsAtSave:(d.msgs||[]).filter(m=>m.type==="narrator").length,result:"loaded",message:null};
    S.lastSaveTurnCount=(d.msgs||[]).filter(m=>m.type==="narrator").length;
    S.challengeData=null; S.input=""; S.screen="game";
    S.suggestions=null; S.suggOpen=false;
    S.bookSuggestion=false; S.bookModal=null;
    gameMounted=false; // force a full remount so the loaded log/panels are fresh
  }catch(e){
    S.saveTracking={...S.saveTracking,result:"error",message:null};
  }
  S.status="idle";
  render();
  persistSession();
  scrollBottom();
  setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },2200);
  setTimeout(()=>{ const el=document.getElementById("mainInput"); if(el) el.focus(); },100);
}

async function handleDeleteSave(id,ev){
  if(ev) ev.stopPropagation();
  if(busy())return;
  try{
    await window.storage.delete(saveKey(id));
    const ids=await getSaveIndex();
    await setSaveIndex(ids.filter(x=>x!==id));
    if(S.saveTracking.activeSaveId===id) S.saveTracking={...S.saveTracking,activeSaveId:null};
    if(id===AUTOSAVE_ID) S.autosaveMeta=null;
    await refreshSaveList();
  }catch(e){}
}

async function handleRenameSave(id,newNameVal){
  const trimmed=(newNameVal||"").trim();
  if(!trimmed){ S.renamingId=null; render(); return; }
  try{
    const r=await window.storage.get(saveKey(id));
    if(r && r.value){
      const d=JSON.parse(r.value);
      d.name=trimmed;
      const payloadStr=JSON.stringify(d);
      if(byteLength(payloadStr)<=SAVE_SIZE_LIMIT_BYTES){
        await window.storage.set(saveKey(id),payloadStr);
        await refreshSaveList();
      }
    }
  }catch(e){}
  S.renamingId=null;
  render();
}

async function handleExportSave(id,ev){
  if(ev) ev.stopPropagation();
  try{
    const r=await window.storage.get(saveKey(id));
    if(!r || !r.value)return;
    const d=JSON.parse(r.value);
    const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const safeName=(d.name||"tale").replace(/[^a-z0-9_\- ]/gi,"").trim().replace(/\s+/g,"_")||"tale";
    a.href=url; a.download=`${safeName}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){}
}

function handleImportFile(ev){
  if(busy()){ ev.target.value=""; return; }
  const file=ev.target.files && ev.target.files[0];
  if(!file)return;
  try{ checkFileObject(file,SAVE_SIZE_LIMIT_BYTES); }catch(e){ S.importStatus=/large/.test(e.message)?"too_large":"error"; render(); ev.target.value=""; return; }
  S.importStatus=null;
  render();
  const reader=new FileReader();
  reader.onload=async(fev)=>{
    let d;
    try{ d=validateSave(safeParseJSON(fev.target.result,SAVE_SIZE_LIMIT_BYTES)); }
    catch(e){ S.importStatus=/large/.test(e.message)?"too_large":"error"; render(); ev.target.value=""; return; }
    try{
      const id=newId();
      d.savedAt=Date.now();
      const payloadStr=JSON.stringify(d);
      if(byteLength(payloadStr)>SAVE_SIZE_LIMIT_BYTES){ S.importStatus="too_large"; render(); ev.target.value=""; return; }
      const res=await window.storage.set(saveKey(id),payloadStr);
      if(!res) throw new Error("write failed");
      const ids=await getSaveIndex();
      ids.push(id);
      await setSaveIndex(ids);
      await refreshSaveList();
      S.importStatus="ok";
    }catch(e){ S.importStatus="error"; }
    render();
    ev.target.value="";
  };
  reader.readAsText(file);
}

/* ---- API target settings modal ----
   Reachable from every screen via the gear icon in the header. Also opened
   automatically by callClaude() (and by the setup screen's gate) whenever
   a request or a new game needs a target that isn't configured yet \u2014
   functions as the "initial config screen" for a fresh install, without
   permanently blocking the rest of the app. Two modes: a "list" of saved
   targets to pick/edit/delete, and a "form" for adding or editing one. */
function renderSettingsModalHtml(){
  if(!S.settingsOpen) return "";
  const forcedEmpty = S.apiTargets.length===0;
  const mode = forcedEmpty ? "form" : S.settingsMode;

  let body;
  if(mode==="form"){
    const editing = S.editingTargetId ? S.apiTargets.find(t=>t.id===S.editingTargetId) : null;
    const host = safeHostname(S.targetForm.url);
    const isLocal = isLocalOrIpHost(host);
    const providerDef = PROVIDERS[S.targetForm.provider] || null;
    const providerChosen = !!providerDef;
    const modelPlaceholder = providerDef && providerDef.defaultModel ? `e.g. ${providerDef.defaultModel}` : (providerDef ? "required for this service" : "choose a service type first");

function updateSettingsModal(){
  const el=document.getElementById("settingsModalContainer");
  if(el) el.innerHTML = renderSettingsModalHtml();
  refreshSettingsHub();
}
function blankTargetForm(){
  const url = API_CONFIG.defaultUrl;
  return {name:"", url, provider: detectProviderId(url) || "", model:"", key:"", _lastDetectedUrl:url};
}
function openSettingsModal(){
  S.settingsOpen = true;
  S.settingsMode = S.apiTargets.length ? "list" : "form";
  if(S.settingsMode==="form"){ S.editingTargetId=null; S.targetForm=blankTargetForm(); }
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetNameInput")||document.getElementById("targetUrlInput"); if(el) el.focus(); },30);
}
function openNewTargetForm(){
  S.settingsMode="form"; S.editingTargetId=null; S.targetForm=blankTargetForm();
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetNameInput"); if(el) el.focus(); },30);
}
function openEditTargetForm(id){
  const t=S.apiTargets.find(x=>x.id===id);
  if(!t) return;
  S.settingsMode="form"; S.editingTargetId=id;
  S.targetForm={name:t.name, url:t.url, provider:t.provider||"", model:t.model||"", key:t.key, _lastDetectedUrl:t.url};
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetNameInput"); if(el) el.focus(); },30);
}
/* Re-runs hostname-based provider detection when the Service URL field is
   blurred. Only overwrites the Service Type when the URL actually changed
   since the last check (so re-focusing/blurring the same value repeatedly
   can't stomp on a choice the user already made), and never invents a
   confident guess for a localhost/IP address \u2014 that always falls back to
   requiring an explicit manual pick, per how ambiguous local endpoints are. */
function handleTargetUrlBlur(){
  const urlEl=document.getElementById("targetUrlInput");
  if(!urlEl) return;
  const url=urlEl.value;
  if(url===S.targetForm._lastDetectedUrl) return;
  S.targetForm._lastDetectedUrl = url;
  const detected = detectProviderId(url);
  if(detected){ S.targetForm.provider = detected; }
  else if(isLocalOrIpHost(safeHostname(url))){ S.targetForm.provider = ""; }
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetUrlInput"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },0);
}

/* ---- Screen mount tracking ----
   `render()` is the single entry point every handler calls after a state
   change. Setup/Saves are cheap enough to always fully rebuild. The game
   screen is the one with hot, focus-sensitive state (the action textarea,
   scroll position, in-flight narration) so it is mounted once and then only
   ever patched via the targeted update*()/append*() functions below \u2014
   render() falls back to a full-but-safe refreshGameScreen() for any call
   site that hasn't been given a more specific update. */
let gameMounted = false;

function render(){
  applyThemeVars();
  const app=document.getElementById("app");
  if(S.screen==="saves"){ gameMounted=false; app.innerHTML=renderSavesScreen(); }
  else if(S.screen==="setup"){ gameMounted=false; app.innerHTML=renderSetupScreen(); }
  else {
    if(!gameMounted){ mountGameScreen(); gameMounted=true; }
    else { refreshGameScreen(); }
  }
}

/* ── Game screen: save/status bar ── */
function renderSaveBarInner(){
  const b=busy();
  const ssText = S.saveTracking.result==="saved"?"\u2726 Saved":S.saveTracking.result==="loaded"?"\u2726 Loaded":S.saveTracking.result==="autosaved"?"\u2726 Autosaved":S.saveTracking.result==="error"?(S.saveTracking.message?`\u2717 ${S.saveTracking.message}`:"\u2717 Error"):null;
  const ssColor = S.saveTracking.result==="error"?OUTCOME_META.failure.color:OUTCOME_META.success.color;
  const condCount = ((S.player.conditions&&S.player.conditions.superficial&&S.player.conditions.superficial.length)||0)
    +((S.player.conditions&&S.player.conditions.moderate&&S.player.conditions.moderate.length)||0)
    +((S.player.conditions&&S.player.conditions.severe&&S.player.conditions.severe.length)||0)
    +((S.player.conditions&&S.player.conditions.positive&&S.player.conditions.positive.length)||0);

  let statusRight;
  if(S.status==="saving") statusRight="Saving\u2026";
  else if(S.status==="loading_save") statusRight="Loading\u2026";
  else if(S.status==="booking") statusRight="Writing the chapter\u2026";
  else if(S.saveTracking.result) statusRight=ssText;
  else if(S.saveTracking.activeSaveId){
    const turns=S.msgs.filter(m=>m.type==="narrator").length-S.saveTracking.turnsAtSave;
    statusRight = turns>0?`Tracking an existing save, ${turns} turn${turns===1?"":"s"} old`:"Tracking an existing save";
  } else statusRight="Unsaved tale";
  const statusColor = (S.status==="saving"||S.status==="loading_save")?"var(--think)":(S.saveTracking.result?ssColor:"var(--textD)");

  return `
    ${smBtnHtml("Save","saveCurrent",{asnew:"0"},S.msgs.length===0||b)}
    ${smBtnHtml("Save As New","saveCurrent",{asnew:"1"},S.msgs.length===0||b)}
    ${smBtnHtml(S.statusOpen?"Hide Status":`Status${condCount?` (${condCount})`:""}`,"toggleStatus",{},false)}
    ${smBtnHtml(S.panelOpen?"Hide Quest":"Quest & Items","togglePanel",{},false)}
    ${smBtnHtml(S.journalOpen?"Hide Journal":"Journal","toggleJournal",{},false)}
    ${smBtnHtml(S.booksOpen?"Hide Lore":`Lore${S.dynLore.entries.length?` (${S.dynLore.entries.length})`:""}`,"toggleBooks",{},false)}
    <span style="font-size:11px;color:${statusColor};letter-spacing:1px;flex:1;text-align:right">${escapeHtml(statusRight)}</span>
  `;
}
function updateSaveBar(){
  const el=document.getElementById("sbarContainer");
  if(el) el.innerHTML = renderSaveBarInner();
}
