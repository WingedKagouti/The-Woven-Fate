/* ---- Browser-side API target handling ----
   Calls are made directly from the browser (no backend proxy), so the user
   points the app at whatever endpoint they want \u2014 the real Anthropic API
   with their own key, a self-hosted proxy, or anything else that speaks the
   same /v1/messages shape \u2014 and supplies a matching key, or none at all if
   the target doesn't require one. Multiple named targets can be saved side
   by side and switched between; everything is persisted only in this
   browser's localStorage and is never hardcoded in source. */
const API_TARGETS_STORAGE_KEY = "woven_fate_api_targets";
const ACTIVE_TARGET_STORAGE_KEY = "woven_fate_active_target_id";
const LEGACY_API_KEY_STORAGE_KEY = "woven_fate_api_key"; // pre-multi-target, migrated on load

function getStoredApiTargets(){
  try{
    const raw = window.localStorage.getItem(API_TARGETS_STORAGE_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function setStoredApiTargets(targets){
  try{ window.localStorage.setItem(API_TARGETS_STORAGE_KEY, JSON.stringify(targets)); }catch(e){}
}
function getStoredActiveTargetId(){
  try{ return window.localStorage.getItem(ACTIVE_TARGET_STORAGE_KEY) || ""; }
  catch(e){ return ""; }
}
function setStoredActiveTargetId(id){
  try{
    if(id) window.localStorage.setItem(ACTIVE_TARGET_STORAGE_KEY, id);
    else window.localStorage.removeItem(ACTIVE_TARGET_STORAGE_KEY);
  }catch(e){}
}
/* One-time migration: an earlier version of this file stored a single bare
   API key against the hardcoded Anthropic endpoint. If that's all we find,
   turn it into the first saved target so nobody loses their key. */
function migrateLegacyApiKeyIfNeeded(){
  try{
    const existing = getStoredApiTargets();
    if(existing.length) return existing;
    const legacyKey = window.localStorage.getItem(LEGACY_API_KEY_STORAGE_KEY);
    if(!legacyKey) return existing;
    const migrated = [{id:newId(), name:"Anthropic (default)", url:API_CONFIG.defaultUrl, key:legacyKey}];
    setStoredApiTargets(migrated);
    setStoredActiveTargetId(migrated[0].id);
    window.localStorage.removeItem(LEGACY_API_KEY_STORAGE_KEY);
    return migrated;
  }catch(e){ return getStoredApiTargets(); }
}

/* ============================== PROVIDER REGISTRY ============================== */
/* Different services speak completely different request/response shapes
   (Anthropic's Messages API, OpenAI's Chat Completions, Google's Gemini
   generateContent, ...). Each entry below knows how to build a request and
   how to pull plain text (or an error) back out of that service's specific
   response shape, so the rest of the app can keep calling one function and
   just getting a string back, regardless of which service answered.

   NOTE on defaults: the "defaultModel" values and guessed endpoint paths
   are best-effort, current as of this writing, and shown only as
   placeholders/fallbacks \u2014 model names in particular go stale quickly.
   Anyone can always type an exact model name, or paste a full endpoint URL
   (including its path) into the Service URL field, to override the guess. */

function openAiCompatibleBuildRequest({apiKey,model,messages,system,maxTokens}){
  const headers = {"Content-Type":"application/json"};
  if(apiKey) headers["Authorization"] = `Bearer ${apiKey}`;
  const chatMessages = [
    ...(system ? [{role:"system", content:system}] : []),
    ...messages.map(m=>({role:m.role, content:m.content})),
  ];
  return {headers, body:{model, max_tokens:maxTokens, messages:chatMessages}};
}
function openAiCompatibleParseText(data){
  const choice = data.choices && data.choices[0];
  const content = choice && choice.message && choice.message.content;
  return typeof content==="string" ? content : null;
}
function openAiCompatibleParseError(data){
  if(!data || !data.error) return null;
  const err = data.error;
  const message = typeof err==="string" ? err : (err.message||JSON.stringify(err));
  const type = (typeof err==="object" && (err.type||err.code)) || "unknown";
  return {type:String(type), message};
}

const PROVIDERS = {

    id:"anthropic", label:"Anthropic (Claude)",
    hostnames:["api.anthropic.com"],
    defaultModel:"claude-sonnet-4-6",
    buildUrl:(origin)=>`${origin}/v1/messages`,
    buildRequest:({apiKey,model,messages,system,maxTokens})=>{
      const headers = {
        "Content-Type":"application/json",
        "anthropic-version":"2023-06-01",
        // Required by the Anthropic SDK/fetch calls when calling the API
        // directly from a browser environment instead of through a backend.
        "anthropic-dangerously-allow-browser":"true",
      };
      if(apiKey) headers["x-api-key"] = apiKey;
      return {headers, body:{model, max_tokens:maxTokens, system, messages}};
    },
    parseText:(data)=> (data.content && data.content[0]) ? data.content[0].text : null,
    parseError:(data)=> data.error ? {type:data.error.type||"unknown", message:data.error.message||"no details", raw:data.error} : null,
  },
  openai: {
    id:"openai", label:"OpenAI (GPT)",
    hostnames:["api.openai.com"],
    defaultModel:"gpt-4.1",
    buildUrl:(origin)=>`${origin}/v1/chat/completions`,
    buildRequest:openAiCompatibleBuildRequest,
    parseText:openAiCompatibleParseText,
    parseError:openAiCompatibleParseError,

  gemini: {
    id:"gemini", label:"Google Gemini",
    hostnames:["generativelanguage.googleapis.com"],
    defaultModel:"gemini-2.5-flash",
    buildUrl:(origin,model)=>`${origin}/v1beta/models/${model}:generateContent`,
    buildRequest:({apiKey,model,messages,system,maxTokens})=>{
      const headers = {"Content-Type":"application/json"};
      if(apiKey) headers["x-goog-api-key"] = apiKey;
      const contents = messages.map(m=>({role: m.role==="assistant" ? "model" : "user", parts:[{text:m.content}]}));
      const body = {contents, generationConfig:{maxOutputTokens:maxTokens}};
      if(system) body.systemInstruction = {parts:[{text:system}]};
      return {headers, body};
    },
    parseText:(data)=>{
      const cand = data.candidates && data.candidates[0];
      const parts = cand && cand.content && cand.content.parts;
      if(!parts) return null;
      return parts.map(p=>p.text||"").join("");
    },
    parseError:(data)=> data.error ? {type:data.error.status||"unknown", message:data.error.message||"no details", raw:data.error} : null,

function isLocalOrIpHost(hostname){
  if(!hostname) return true;
  if(hostname==="localhost") return true;
  if(/^\d{1,3}(\.\d{1,3}){3}$/.test(hostname)) return true; // IPv4
  if(hostname==="::1" || hostname.startsWith("[")) return true; // IPv6
  return false;
}
/* Returns a provider id guessed from the URL's hostname, or null if it's a
   localhost/IP address (ambiguous \u2014 caller must ask the user) or simply
   doesn't match any known service (falls back to the generic OpenAI-
   compatible option, still requiring confirmation via the dropdown). */
function detectProviderId(url){
  const host = safeHostname(url);
  if(isLocalOrIpHost(host)) return null;
  for(const p of PROVIDER_LIST){
    if(p.hostnames.some(h => host===h || host.endsWith("."+h))) return p.id;
  }
  return null;
}
function resolveEndpointUrl(baseUrl, providerDef, model){
  let u;
  try{ u = new URL(baseUrl); }catch(e){ return baseUrl; }
  const hasPath = u.pathname && u.pathname!=="/";
  if(hasPath) return baseUrl; // already a full endpoint \u2014 respected exactly as typed
  return providerDef.buildUrl(u.origin.replace(/\/$/,""), model);
}

/* ============================== STORAGE SHIM =============================
   The original artifact ran in an environment providing a global
   `window.storage` key/value API. This standalone HTML file has no such
   backend, so it is reimplemented here on top of localStorage with the
   exact same async shape ({key,value} / null), so all the app logic above
   it is untouched. Everything is namespaced under "woven_fate::" so it
   won't collide with anything else on the page's origin. */
(function(){
  const NS = "woven_fate::";
  function lsKey(k){ return NS + (k?1:0) + "::" + k; } // shared/private share the same origin here
  window.storage = {
    async get(key, shared){
      try{
        const raw = window.localStorage.getItem(lsKey(key));
        if(raw===null) throw new Error("not found");
        return {key, value:raw, shared:!!shared};
      }catch(e){ throw e; }
    },
    async set(key, value, shared){
      try{
        window.localStorage.setItem(lsKey(key), value);
        return {key, value, shared:!!shared};
      }catch(e){ return null; }
    },
    async delete(key, shared){
      try{
        window.localStorage.removeItem(lsKey(key));
        return {key, deleted:true, shared:!!shared};
      }catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const out=[];
        const pfx = lsKey(prefix||"");
        for(let i=0;i<window.localStorage.length;i++){
          const k=window.localStorage.key(i);
          if(k && k.indexOf(pfx)===0) out.push(k.slice(NS.length+3));
        }
        return {keys:out, prefix, shared:!!shared};
      }catch(e){ return null; }
    }
  };
})();

function buildSystem(mood,setting,engine,playerInfo,isJudge){
  isJudge = isJudge||false;
  const sl = SETTING_SYSTEM[setting] || setting;

  const ed = ENGINE_SYSTEM[engine] || ENGINE_SYSTEM.story_driven;
  const pBits=[];
  if(playerInfo && playerInfo.gender && playerInfo.gender!=="undefined") pBits.push(`gender: ${playerInfo.gender}`);
  if(playerInfo && playerInfo.desc) pBits.push(`description: ${playerInfo.desc}`);
  const pLine = pBits.length ? `\n\nThe player character (always addressed as "you") has the following fixed traits \u2014 keep these consistent in every scene: ${pBits.join("; ")}.` : "";
  const memLine = (playerInfo && playerInfo.memoryContext) ? `\n\nStory so far (for continuity \u2014 do not restate verbatim, just stay consistent with it):\n${playerInfo.memoryContext}` : "";
  const itemsLine = (playerInfo && playerInfo.itemsContext) ? `\n\nThe player currently carries:\n${playerInfo.itemsContext}` : "";

  const condLine = (playerInfo && playerInfo.rulebookContext) ? `\n\nRulebook — the current state of the story's tracked meters. Treat each note as binding for how the characters behave right now. A note marked PRIORITY overrides what the player's message asks for in this reply: the character acts as the note says even if the player's action says otherwise. Never mention meters, numbers or levels:\n${playerInfo.rulebookContext}` : "";
  if(isJudge) return `You are a game master running a ${sl} setting with this plot engine: ${ed}. Analyse player actions. Respond ONLY with raw JSON \u2014 no markdown, no explanation.${pLine}${memLine}${itemsLine}${condLine}${loreLine}`;
  return `You are the game master of a ${sl} setting RPG. Plot engine: ${ed}. Tone: ${md}. Write immersive prose in second person ("You\u2026"). No game-mechanics language. Never break the fourth wall.${pLine}${memLine}${itemsLine}${condLine}${loreLine}\n\nCRITICAL RULE: Never write any dialogue, speech, decisions, or actions performed BY the player character. Other characters may speak and act freely, and you may describe things happening TO or AROUND the player, but the player alone decides what they say or do next. Always end your response at a moment that leaves the next action open to the player \u2014 do not narrate or imply what they say, choose, or do.\n\nFormatting:\n- Wrap character/creature names in **double asterisks**\n- Wrap location/place names in *single asterisks*\n- Always use straight double quotes " " for any spoken dialogue, never single quotes\n- Never wrap dialogue in asterisks or combine it with italics \u2014 dialogue should be plain text inside its quotes\n- Do not wrap anything else`;
}

function memoryContextString(memory,books){
  const bits=[];

  if(latestBook) bits.push(`Story so far (Book "${latestBook.title}"): ${latestBook.summary}`);
  const acts=memory.acts.slice(-CONTEXT_ACTS_LIMIT);
  if(acts.length) bits.push(`Since the last chapter: ${acts.map(a=>a.text).join(" ")}`);
  let events=memory.events.slice(-CONTEXT_EVENTS_LIMIT);
  if(events.length<2 && latestBook && latestBook.events && latestBook.events.length){

    events=[...bridge,...events];

  return bits.join("\n");
}

async function callClaude(messages,system,maxTokens){
  const target = activeTarget();
  if(!target){
    openSettingsModal();
    throw new Error("No API target selected \u2014 add or choose one via the settings icon in the header.");
  }
  const providerDef = PROVIDERS[target.provider] || PROVIDERS.anthropic;
  const model = (target.model && target.model.trim()) || providerDef.defaultModel;
  const endpoint = resolveEndpointUrl(target.url, providerDef, model);
  const {headers, body} = providerDef.buildRequest({
    apiKey: target.key, model, messages, system, maxTokens: maxTokens||API_CONFIG.maxTokens,
  });

  const _t0=Date.now();
  let res;
  try{
    res = await fetch(endpoint, {method:"POST", headers, body:JSON.stringify(body)});
  }catch(networkErr){
    throw new Error(`Network error \u2014 could not reach "${target.name}" (${networkErr.message})`);
  }
  let data;
  try{ data = await res.json(); }
  catch(e){ throw new Error(`Bad response from "${target.name}" (HTTP ${res.status})`); }

  const errInfo = providerDef.parseError(data);
  if(errInfo){
    const ty = errInfo.type, m = errInfo.message;
    if(providerDef.id==="anthropic" && (ty==="rate_limit_error"||ty==="overloaded_error"||ty==="exceeded_limit")){
      const resetDate = extractResetTimestamp(errInfo.raw) || extractResetTimestamp(m);
      const resetStr = resetDate ? formatResetTime(resetDate) : null;
      throw new Error(resetStr ? `Rate limited / overloaded \u2014 limit resets around ${resetStr}` : `Rate limited / overloaded \u2014 try again shortly (${m})`);
    }
    if(/rate.?limit/i.test(ty) || res.status===429) throw new Error(`Rate limited / overloaded on "${target.name}" \u2014 try again shortly (${m})`);
    if(ty==="invalid_request_error") throw new Error(`Invalid request to "${target.name}" (${m})`);
    if(ty==="authentication_error"||ty==="permission_error"||res.status===401||res.status===403){
      openSettingsModal();
      throw new Error(`Auth/permission error on "${target.name}" \u2014 check its API key (${m})`);
    }
    throw new Error(`API error from "${target.name}" [${ty}]: ${m}`);
  }
  if(!res.ok){
    throw new Error(`"${target.name}" returned HTTP ${res.status} with an unrecognized response shape`);
  }
  const text = providerDef.parseText(data);
  if(typeof text!=="string" || !text) throw new Error(`Empty or unrecognized response from "${target.name}" (check the Service Type is set correctly)`);
  S.dbgAcc.calls++; S.dbgAcc.ms+=Date.now()-_t0;
  return text;
}
/* LLMs sometimes wrap JSON in markdown code fences, or occasionally return
   malformed JSON outright. Strip fences defensively, then fall back to a
   safe default (and log) rather than letting a parse error crash a turn. */
function safeHostname(url){
  try{ return new URL(url).hostname; }catch(e){ return ""; }
}
function safeParseJSON(input, fallback){
  if(fallback===undefined) fallback=null;
  try{
    const cleanInput = String(input).replace(/```json|```/g,"").trim();
    return JSON.parse(cleanInput);
  }catch(err){
    console.error("safeParseJSON: JSON parsing failed, returning fallback state", err, input);
    return fallback;
  }
}
const parseJSON = safeParseJSON; // kept as an alias so existing call sites are unaffected
function extractResetTimestamp(errVal){
  let obj=errVal;
  if(typeof obj==="string"){
    try{ obj=JSON.parse(obj); }
    catch(e){
      const match=obj.match(/\{[\s\S]*\}/);
      if(match){ try{ obj=JSON.parse(match[0]); }catch(e2){ return null; } }
      else return null;
    }
  }
  if(!obj || typeof obj!=="object") return null;
  const candidates=[
    obj.resetsAt,
    obj.windows && obj.windows["5h"] && obj.windows["5h"].resets_at,
    obj.resolved && obj.resolved.limit && obj.resolved.limit.resets_at,
    obj.resets_at,
  ];
  for(const c of candidates){
    if(c===undefined||c===null) continue;
    const d = typeof c==="number" ? new Date(c*1000) : new Date(c);
    if(!isNaN(d.getTime())) return d;
  }
  return null;
}
function formatResetTime(date){
  try{ return date.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }
  catch(e){ return null; }
}
function looksLikeDecline(text){
  if(!text) return false;
  const t=text.trim().toLowerCase();
  const patterns=[
    /^i can'?t (help|continue|write|assist|do that|create)/,
    /^i won'?t /,
    /^i'?m (not (able|going) to|unable to)/,
    /^i (must|have to) decline/,
    /^sorry,? i can'?t/,
    /i don'?t feel comfortable/,
    /against (my|anthropic'?s) (guidelines|policies)/,
    /i'?m not comfortable (writing|continuing|depicting)/,
  ];
  return patterns.some(p=>p.test(t));
}

function escapeHtml(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function attr(s){ return escapeHtml(s); }

/* Mirrors renderText() from the original tsx: turns **bold** / *italic* /
   "quoted" text into styled spans. Returns an HTML string (already escaped). */
function renderTextHtml(text){
  if(!text) return "";
  return text.split(/\n\n+/).map((para,pi)=>{
    const regex=/\*\*(.+?)\*\*|\*(.+?)\*|"([^"]+)"|\u201c([^\u201d]+)\u201d|(?:^|[\s(*])'((?:[^']|'(?=[a-zA-Z]))*?)'(?=[\s,.!?;:]|$)/g;
    let last=0,match; const parts=[];
    while((match=regex.exec(para))!==null){
      if(match.index>last) parts.push(escapeHtml(para.slice(last,match.index)));
      if(match[1]) parts.push(`<strong style="color:var(--nb);font-weight:600">${escapeHtml(match[1])}</strong>`);
      else if(match[2]) parts.push(`<em style="color:var(--ni);font-style:italic">${escapeHtml(match[2])}</em>`);
      else if(match[5]!==undefined){
        const lead = match[0].startsWith("'") ? "" : match[0][0];
        if(lead) parts.push(escapeHtml(lead));
        parts.push(`<span style="color:var(--dlg);font-weight:600">'${escapeHtml(match[5])}'</span>`);
      } else {
        const spoken = match[3]!==undefined ? match[3] : match[4];
        const isStraight = match[3]!==undefined;
        const openQ = isStraight ? '"' : "\u201c";
        const closeQ = isStraight ? '"' : "\u201d";
        parts.push(`<span style="color:var(--dlg);font-weight:600">${openQ}${escapeHtml(spoken)}${closeQ}</span>`);
      }
      last=match.index+match[0].length;
    }
    if(last<para.length) parts.push(escapeHtml(para.slice(last)));
    return `<p style="margin:${pi===0?"0":"10px 0 0"}">${parts.join("")}</p>`;
  }).join("");
}

    const chars = [...s.player.characters];
    const sorted = [...s.mergeSelection].sort((a,b)=>a-b);
    const i1=sorted[0], i2=sorted[1];
    const a=chars[i1], b=chars[i2];
    const aNames = a.names || [a.name].filter(Boolean);
    const bNames = b.names || [b.name].filter(Boolean);
    const namesArr = [...new Set([...aNames,...bNames])];
    const role = (a.role && b.role && a.role!==b.role) ? `${a.role} / ${b.role}` : (a.role||b.role||"");
    const note = b.note || a.note || "";
    const status = b.status || a.status || "unknown";
    const present = !!(a.present || b.present);
    const merged = {names:namesArr, role, note, status, present};
    const newChars = chars.filter((_,idx)=>idx!==i1 && idx!==i2);
    newChars.push(merged);
    s.player.characters = newChars;
    s.mergeSelection = [];
    s.mergeMode = false;
  }, updateJournalUI);
}

/* ============================== INPUT SAFETY ============================== */
const BAD_KEYS=new Set(["__proto__","constructor","prototype"]);
const LORE_FILE_MAX_CHARS=2000000;
/* Strips C0/C1 controls (keeps \n and \t), zero-width/BOM and bidi-override characters; normalises line breaks. */
const CTRL_RE=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B\u2060-\u2064\u202A-\u202E\u2066-\u2069\uFEFF\uFFF9-\uFFFB]/g;
function cleanText(s,max){
  s=String(s).replace(/\r\n?|[\u2028\u2029]/g,"\n").replace(CTRL_RE,"");
  return max&&s.length>max?s.slice(0,max):s;
}
/* Recursively rebuilds parsed JSON: drops prototype-pollution keys (checked after cleaning), cleans strings, caps depth/size. */
function sanitizeDeep(v,depth,c){
  depth=depth||0; c=c||{n:0};
  if(++c.n>200000) throw new Error("File has too many values.");
  if(depth>16) throw new Error("File is nested too deeply.");
  if(typeof v==="string") return cleanText(v,100000);
  if(typeof v==="number") return Number.isFinite(v)?v:0;
  if(v===null||typeof v==="boolean") return v;
  if(Array.isArray(v)){
    if(v.length>20000) throw new Error("File has an array that is too long.");
    return v.map(x=>sanitizeDeep(x,depth+1,c));
  }
  if(typeof v==="object"){
    const o={};
    for(const k of Object.keys(v)){
      const ck=cleanText(k,200);
      if(BAD_KEYS.has(ck)||BAD_KEYS.has(k)) continue;
      o[ck]=sanitizeDeep(v[k],depth+1,c);
    }
    return o;
  }
  return undefined;
}
function safeParseFileJSON(text,maxChars){
  if(typeof text!=="string") throw new Error("File is not text.");
  if(text.length>maxChars) throw new Error("File is too large.");
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  return sanitizeDeep(JSON.parse(text,(k,v)=>BAD_KEYS.has(k)?undefined:v));
}
function checkFileObject(file,maxBytes){
  if(!/\.json$/i.test(file.name||"") && !/json/i.test(file.type||"")) throw new Error("Please choose a .json file.");
  if(file.size>maxBytes) throw new Error("File is too large.");
}
const isArr=Array.isArray, isStr=x=>typeof x==="string";
/* Structural validation for imported / stored saves. Throws if the shape is wrong. */
function validateSave(d){
  const bad=()=>{ throw new Error("Not a valid save file."); };
  if(!d||typeof d!=="object"||isArr(d)||!isStr(d.name)||!d.name||!isArr(d.msgs)) bad();
  if(d.msgs.length>5000||d.msgs.some(m=>!m||typeof m!=="object"||!isStr(m.type))) bad();
  if(d.history!==undefined&&(!isArr(d.history)||d.history.length>200||d.history.some(m=>!m||(m.role!=="user"&&m.role!=="assistant")||!isStr(m.content)))) bad();
  for(const k of ["characters","items","keyItems","completedQuests","names","books"]) if(d[k]!==undefined&&!isArr(d[k])) bad();
  for(const k of ["mood","setting","engine","gender","desc"]) if(d[k]!==undefined&&d[k]!==null&&!isStr(d[k])) bad();
  if(d.lorebook) d.lorebook=normalizeLorebook(d.lorebook); else delete d.lorebook;
  if(d.dynLore){
    const dl=d.dynLore; if(typeof dl!=="object"||isArr(dl)) bad();
    d.dynLore={story:isStr(dl.story)?dl.story.slice(0,1500):"",budget:Math.min(100000,Math.max(500,Math.floor(Number(dl.budget))||4000)),
      turn:Math.max(0,Math.floor(Number(dl.turn))||0),pending:[],
      entries:(isArr(dl.entries)?dl.entries:[]).slice(0,150).filter(e=>e&&isStr(e.name)&&isStr(e.content)&&isArr(e.keys)).map(e=>({
        name:e.name.slice(0,100),keys:e.keys.filter(isStr).map(k=>k.slice(0,64)).slice(0,12),content:e.content.slice(0,600),
        priority:Math.min(10,Math.max(1,Math.round(Number(e.priority))||5)),turn:Math.floor(Number(e.turn))||0}))};
  }
  return d;
}
function parseStoredSave(text){ return validateSave(safeParseFileJSON(text,SAVE_SIZE_LIMIT_BYTES)); }

/* ============================== LOREBOOK ============================== */
const LORE_DEFAULT_BUDGET=8000, LORE_SCAN_MESSAGES=4;
function normalizeLorebook(d){
  if(!d || typeof d!=="object" || !Array.isArray(d.entries)) throw new Error("No \"entries\" array found.");
  if(d.entries.length>1000) throw new Error("Too many entries (max 1000).");
  const entries=d.entries.map(e=>({
    name:cleanText((e&&e.name)||"Untitled",100).trim()||"Untitled",
    keys:(Array.isArray(e&&e.keys)?e.keys:[]).slice(0,50)
      .map(k=>cleanText(k,64).trim().replace(/\*+/g,"*"))
      .filter(k=>/[\p{L}\p{N}]/u.test(k) && (k.match(/\*/g)||[]).length<=2),  // needs a real character; max 2 wildcards (ReDoS guard)
    content:cleanText((e&&e.content)||"",10000).trim(),
    priority:Math.min(10,Math.max(1,Math.round(Number(e&&e.priority))||5)),
  })).filter(e=>e.content && e.keys.length);
  if(!entries.length) throw new Error("No usable entries (each needs keys and content).");
  const cap=n=>Math.min(100000,n);
  const b=Number(d.character_budget), fb=cap(b>0?Math.floor(b):LORE_DEFAULT_BUDGET);
  /* file_budget keeps the file's own value so a manual override (character_budget) can be reset. */
  const ob=Number(d.file_budget);
  return {name:cleanText(d.name||"Lorebook",100),description:cleanText(d.description||"",500),
    character_budget:fb,file_budget:ob>0?cap(Math.floor(ob)):fb,entries};
}
/* Normalise curly quotes, then match a key as a whole word/phrase; "*" matches any word characters. */
function loreNorm(t){ return String(t).slice(-20000).toLowerCase().replace(/[\u2018\u2019]/g,"'"); }
const LORE_RE_CACHE=new Map();
function loreKeyRegex(key){
  let re=LORE_RE_CACHE.get(key); if(re) return re;
  if(LORE_RE_CACHE.size>5000) LORE_RE_CACHE.clear();
  re=loreKeyRegexBuild(key); LORE_RE_CACHE.set(key,re); return re;
}
function loreKeyRegexBuild(key){
  const parts=loreNorm(key).split("*").map(x=>x.replace(/[.+?^${}()|[\]\\]/g,"\\$&"));
  return new RegExp("(^|[^\\p{L}\\p{N}])"+parts.join("[\\p{L}\\p{N}_]*")+"(?![\\p{L}\\p{N}])","u");
}
function entryMatches(entry,text){ return entry.keys.some(k=>{ try{ return loreKeyRegex(k).test(text); }catch(e){ return false; } }); }
/* Matched entries are tried priority 1 -> 10 (random order within a priority). An entry that
   doesn't fit the remaining budget is skipped and the rest are still tried. */
/* Select entries from a lorebook-shaped object ({entries}) into a character budget (content length only). */
function loreSelect(lb,scan,budget){
  const text=loreNorm(scan);
  const matched=lb.entries.filter(e=>entryMatches(e,text));
  const out=[], added=[]; let remaining=budget;
  for(let pr=1;pr<=10 && remaining>0;pr++){
    for(const e of shuffle(matched.filter(x=>x.priority===pr))){
      if(e.content.length<=remaining){ out.push(`[${e.name}] ${e.content}`); added.push(e); remaining-=e.content.length; }
    }
  }
  return {ctx:out.join("\n\n"),stats:{has:true,triggered:matched.length,added:added.map(e=>e.name),
    skipped:matched.filter(e=>!added.includes(e)).map(e=>e.name),used:budget-remaining,budget}};
}
function loreScanText(extra){ return `${S.history.slice(-LORE_SCAN_MESSAGES).map(m=>m.content).join("\n")}\n${extra||""}`; }
function buildLoreContext(extraText){
  const lb=S.lorebook; if(!lb){ S.lastLoreStats={has:false}; return ""; }
  const r=loreSelect(lb,loreScanText(extraText),lb.character_budget); S.lastLoreStats=r.stats; return r.ctx;
}

/* ============================== DYNAMIC LORE ============================== */
const DYN_MAX_ENTRIES=150, DYN_MAX_ENTRY=600, DYN_MAX_STORY=1500;
function blankDynLore(){ return {story:"",entries:[],budget:4000,turn:0,pending:[]}; }
function seedDynLoreFromLegacy(d){
  const bk=(d.books||[]).slice(-1).map(b=>b.summary), m=d.memory||{};
  const story=[...bk,...(m.acts||[]).map(a=>a.text),...(m.events||[]).map(e=>e.text)].filter(Boolean).join(" ");
  return {...blankDynLore(),story:story.slice(-DYN_MAX_STORY)};
}
/* The story-so-far entry is always on and is charged to the dynamic budget first; keyed entries fill the rest. */
function buildDynContext(extraText){
  const d=S.dynLore, st=(d.story||"").trim();
  const r=loreSelect(d,loreScanText(extraText),Math.max(0,d.budget-st.length));
  S.lastDynStats={...r.stats,story:st.length,budget:d.budget,used:r.stats.used+st.length};
  return [st?`[Story so far] ${st}`:"",r.ctx].filter(Boolean).join("\n\n");
}
async function updateDynLore(action,text){
  const d=S.dynLore; d.turn++;
  d.pending=[...(d.pending||[]),{action:action||"",text}].slice(-3); // failed updates are retried with the next turn
  const turns=d.pending.map(p=>`${p.action?`Player: ${p.action}\n`:""}Story: ${p.text}`).join("\n\n");
  const rel=loreSelect(d,turns,2500).ctx;
  const stat=S.lorebook?S.lorebook.entries.map(e=>e.name).join(", "):"none";
  const prompt=`You maintain the long-term memory of an interactive story. Update it from the new turn(s) below.\n\nStory so far:\n${d.story||"(empty)"}\n\nExisting entry names: ${d.entries.map(e=>e.name).join(", ")||"none"}\n\nRelevant existing entries:\n${rel||"none"}\n\nStatic world lore already known (do not duplicate): ${stat}\n\nNew turn(s):\n${turns}\n\nReturn ONLY raw JSON: {"story":"full rewritten story-so-far under ${DYN_MAX_STORY} characters (condense older parts), or null if unchanged","entries":[{"name":"...","keys":["aliases, nicknames, titles"],"content":"lasting facts, under ${DYN_MAX_ENTRY} characters","priority":1-10}]}\nRules: entries are for NPCs, places, factions, notable items, open plot threads/promises and relationships. Record lasting facts only, not moment-to-moment action. To update an existing entry reuse its exact name and give its full new content. Skip trivia; return an empty entries array if nothing lasting happened. Priority: 1-3 plot-critical, 4-6 important and recurring, 7-10 background.`;
  let p=null;
  try{ p=parseJSON(await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",1500),null); }catch(e){}
  if(!p || typeof p!=="object") return {created:0,updated:0,failed:true};
  d.pending=[];
  let created=0,updated=0;
  if(typeof p.story==="string" && p.story.trim()) d.story=p.story.trim().slice(0,DYN_MAX_STORY);
  for(const r of (Array.isArray(p.entries)?p.entries:[])){
    const name=String((r&&r.name)||"").trim(), content=String((r&&r.content)||"").trim().slice(0,DYN_MAX_ENTRY);
    if(!name||!content) continue;
    const keys=[...new Set([name,...(Array.isArray(r.keys)?r.keys:[])].map(k=>String(k).trim()).filter(Boolean))].slice(0,12);
    const e={name,keys,content,priority:Math.min(10,Math.max(1,Math.round(Number(r.priority))||5)),turn:d.turn};
    const i=d.entries.findIndex(x=>x.name.toLowerCase()===name.toLowerCase());
    if(i>=0){ d.entries[i]=e; updated++; } else { d.entries.push(e); created++; }
  }
  if(d.entries.length>DYN_MAX_ENTRIES){ // drop least important, then least recently touched
    d.entries.sort((a,b)=>b.priority-a.priority||a.turn-b.turn);
    d.entries=d.entries.slice(d.entries.length-DYN_MAX_ENTRIES);
  }
  return {created,updated};
}

function loadLorebookFile(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  try{ checkFileObject(file,LORE_FILE_MAX_CHARS); }
  catch(e){ S.lorebookMsg={ok:false,text:`Couldn't load lorebook: ${e.message}`}; renderLorebookModal(); ev.target.value=""; return; }
  const reader=new FileReader();
  reader.onload=fev=>{
    try{ S.lorebook=normalizeLorebook(safeParseFileJSON(fev.target.result,LORE_FILE_MAX_CHARS)); S.lorebookMsg={ok:true,text:`Loaded "${S.lorebook.name}".`}; }
    catch(e){ S.lorebookMsg={ok:false,text:`Couldn't load lorebook: ${e.message}`}; }
    persistSession(); renderLorebookModal(); refreshLorebookSetupRow(); ev.target.value="";
  };
  reader.readAsText(file);
}

}
function rbCanRecord(st,m,it){ const arr=st.jrn[m.id]||[]; if(arr.some(e=>e.i===it.id&&e.turn===st.turn)) return false; return it.repeat===true||!arr.some(e=>e.i===it.id); }

/* ---- The turn pipeline: [dice: before reply] -> keywords -> AI check -> decay & clock (if unchanged) -> [dice: after meters] -> triggers ----
   opts.cont: the player pressed Continue (no message to read; the last reply is what the referee judges). */
async function runRulebookTurn(action,opts){
  if(!S.rulebook||!S.rulebook.rb) return;
  if(S.rbPending) S.rbState=JSON.parse(S.rbPending.before); // a failed/retried turn must not apply twice
  S.rbPending={before:JSON.stringify(S.rbState)};
  const rb=S.rulebook.rb, st=S.rbState, prevDelta=st.delta||{};
  st.turn=(st.turn||0)+1; st.delta={};
  const ms=rb.meters, nums=ms.filter(rbIsNum), t0=Date.now(), cont=!!(opts&&opts.cont), text=cont?"":String(action||"");
  const start={}; for(const m of nums) start[m.id]=st.values[m.id];
  const fired=new Set(); const stats={turn:st.turn,asked:0,fired:[],failed:false,ms:0,cont};
  const lastNarr=[...S.history].reverse().find(x=>x.role==="assistant");
  const prev=lastNarr?String(lastNarr.content).slice(-1800):"";
  const clk=ms.find(m=>m.type==="clock")||null, dice=ms.filter(m=>m.type==="dice"), jms=ms.filter(m=>m.type==="journal"), cms=ms.filter(m=>m.type==="collection");

  // 0. a roll that has run out of replies is no longer current
  for(const m of dice){ const d=st.dice[m.id]; if(d&&Number.isFinite(m.lasts)&&st.turn-d.turn>=m.lasts){ delete st.dice[m.id]; delete st.values[m.id]; } }
  // dice: rolls when their conditions are met (no conditions = every message)
  const aiDice={};
  const diceTurn=(timing,rises)=>{
    for(const m of dice){
      if((m.timing||"before_reply")!==timing) continue;
      const rw=m.rollWhen||{}, res=[];
      if(rw.every_turns) res.push(st.turn%rw.every_turns===0);
      if((rw.keywords||[]).length) res.push(!!text&&rw.keywords.some(w=>{ try{ return rbKeyHit(w,text); }catch(e){ return false; } }));
      if((rw.ai_conditions||[]).length) res.push(!!aiDice[m.id]);
      if(rw.meter_conditions){ const mc=rw.meter_conditions, l=mc.conditions.map(c=>rbCond({m:c.meter_id,op:c.op,v:c.value},st)); res.push(rbGate(st,"dice:"+m.id,mc.match==="any"?l.some(Boolean):l.every(Boolean),mc.fire,mc.every_turns)); }
      if((rw.meter_rises||[]).length) res.push(rw.meter_rises.some(id=>(rises[id]||0)>0));
      const want=!res.length||(rw.match==="all"?res.every(Boolean):res.some(Boolean));
      if(!want) continue;
      if(Number.isFinite(rw.cooldown)&&st.rolled[m.id]!==undefined&&st.turn-st.rolled[m.id]<rw.cooldown) continue;
      const r=1+Math.floor(Math.random()*m.sides);
      st.dice[m.id]={roll:r,turn:st.turn}; st.values[m.id]=r; st.rolled[m.id]=st.turn; stats.fired.push(`${m.label}: rolled ${r}`);
    }
  };
  diceTurn("before_reply",prevDelta);

  // 1. keyword rules (player's last message only) and journal cues
  for(const m of nums) for(const kw of (m.keywords||[])){
    let hit=false; try{ hit=!!text&&kw.words.some(w=>rbKeyHit(w,text)); }catch(e){}
    if(!hit) continue;
    st.values[m.id]=rbFix(m,("set" in kw)?kw.set:st.values[m.id]+kw.delta);
    fired.add(m.id); stats.fired.push(`${m.label}: keyword "${kw.words[0]}"`);
  }
  const jText=m=>m.reads==="user"?text:m.reads==="bot"?prev:text+"\n"+prev;
  for(const m of jms) for(const it of m.items){
    if(!(it.cues||[]).length||!rbCanRecord(st,m,it)) continue;
    let hit=false; try{ hit=it.cues.some(w=>rbKeyHit(w,jText(m))); }catch(e){}
    if(hit) rbRecord(st,m,it,stats);
  }

  // 2. AI check: one batched call with a question per applicable rule
  const qs=[];
  for(const m of nums){
    const ai=m.ai; if(!ai||ai.on===false) continue;
    if(ai.mode==="extract"){ qs.push({k:"x",m}); continue; }
    for(const r of (ai.rules||[])){
      const key=m.id+":"+r.id, last=st.lastFired[key];
      if(typeof r.cooldown==="number" && last!==undefined){ if(r.cooldown<0) continue; if(st.turn-last<=r.cooldown) continue; }
      if(r.if && !rbCondsOk(r.if,st)) continue;
      qs.push({k:"r",m,r,key});
    }
  }
  for(const m of ms.filter(x=>x.type==="select")) qs.push({k:"s",m});
  if(clk&&clk.skips===true){ qs.push({k:"cd",m:clk}); if(clk.mode!=="date") qs.push({k:"cm",m:clk}); }
  for(const m of dice){
    const rw=m.rollWhen||{}; if(!(rw.ai_conditions||[]).length) continue;
    if(Number.isFinite(rw.cooldown)&&st.rolled[m.id]!==undefined&&st.turn-st.rolled[m.id]<rw.cooldown) continue;
    for(const c of rw.ai_conditions) qs.push({k:"da",m,c});
  }
  if(cms.length) qs.push({k:"c"});
  const jPend=jms.filter(m=>m.items.some(it=>rbCanRecord(st,m,it)));
  if(jPend.length) qs.push({k:"j"});
  stats.asked=qs.length;
  let skipDays=0, skipMin=0;
  if(qs.length){
    let ans=null;
    try{
      const qline=(q,i)=>{
        const n=`q${i+1}`;
        switch(q.k){
          case "r": return `${n} [${q.m.label}; judge ${rbReads(q.m)}] ${rbSub(q.r.when)}`;
          case "x": return `${n} [${q.m.label}; NUMBER; judge ${rbReads(q.m)}] ${rbSub(q.m.ai.extractHint||`The amount ${q.m.label} changes by`)}`;
          case "s": return `${n} [${q.m.label}; PICK ONE; judge ${rbReads(q.m)}] Which one is current right now? Currently: "${st.sel[q.m.id]}". ${rbSub(q.m.detectHint||"")} Answer with exactly one id: ${q.m.items.map(it=>`"${it.id}" (${it.label})`).join(", ")}`;
          case "cd": return `${n} [Story clock; NUMBER; judge both the player's message and the previous passage] How many WHOLE DAYS does the story skip forward (a week later = 7, the next day = 1)? 0 if time just flows on or the skip is under a day.`;
          case "cm": return `${n} [Story clock; NUMBER; judge both the player's message and the previous passage] How many MINUTES does the story skip forward beyond normal flow (an hour later = 60; "the next morning" = the minutes until that morning)? 0 if none or if you already counted whole days.`;
          case "da": return `${n} [${q.m.label}; judge both the player's message and the previous passage] ${rbSub(q.c.condition)}`;
          case "c": return `${n} [Inventories; NUMBER per item] How many of each item did the story give or take in the latest exchange (positive = gained, negative = spent or lost; held items: 1 = obtained, -1 = lost)? Answer an object {"<meter id>":{"<item id>":number}} listing ONLY items that changed.\n`+cms.map(m=>`  Meter "${m.id}" (${m.label}; judge ${rbReads(m)}). ${rbSub(m.detectHint||"")} Items: ${m.items.map(it=>`"${it.id}" (${it.label}; ${it.kind==="counted"?"counted, have "+rbCount(st,m,it.id):"held, "+(rbCount(st,m,it.id)?"have it":"don't have it")})`).join(", ")}`).join("\n");
          case "j": return `${n} [Journals] Which of these events clearly happened (each judged on the text named)? Answer an object {"<journal id>":["<event id>",...]} with an empty list when none.\n`+jPend.map(m=>`  Journal "${m.id}" (${m.label}; judge ${rbReads(m)}). ${rbSub(m.detectHint||"")} Events: ${m.items.filter(it=>rbCanRecord(st,m,it)).map(it=>`"${it.id}" (${rbSub(it.hint||it.label)})`).join("; ")}`).join("\n");
        }
        return "";
      };
      const lines=qs.map(qline);
      const prompt=`You are the referee of an interactive story. Decide what happened in the latest exchange.\n\nPrevious story passage:\n"""${prev||"(none yet)"}"""\n\nPlayer's latest message:\n"""${cont?"(none: the player asked the story to continue by itself)":text}"""\n\nQuestions. Each says which text to judge. Answer true only if it clearly happened, not if it is merely implied or hoped for. A NUMBER question asks for a signed amount; answer 0 if nothing happened. A PICK ONE question wants one id as a string.\n${lines.join("\n")}\n\nReturn ONLY raw JSON: {"a":{"q1":true|false|number|"id"|{...},...}} with one entry per question.`;
      const raw=await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",Math.min(1100,100+qs.length*14+((cms.length||jPend.length)?250:0)));
      const p=parseJSON(raw,null); ans=p&&p.a&&typeof p.a==="object"?p.a:null;
    }catch(e){ ans=null; }
    if(!ans) stats.failed=true;
    else {
      const pre=Object.assign({},st.values);
      qs.forEach((q,i)=>{ // non-numeric answers
        const a=ans[`q${i+1}`];
        if(q.k==="s"){ const it=rbResolveItem(q.m,a); if(it&&st.sel[q.m.id]!==it.id){ st.sel[q.m.id]=it.id; stats.fired.push(`${q.m.label}: now "${it.label}"`); } }
        else if(q.k==="cd"){ const n=Math.trunc(Number(a)); if(Number.isFinite(n)&&n>0) skipDays=Math.min(n,3650); }
        else if(q.k==="cm"){ const n=Math.trunc(Number(a)); if(Number.isFinite(n)&&n>0) skipMin=Math.min(n,525600); }
        else if(q.k==="da"){ if(a===true) aiDice[q.m.id]=true; }
        else if(q.k==="c"&&a&&typeof a==="object"&&!Array.isArray(a)){
          for(const m of cms){
            const o=Object.prototype.hasOwnProperty.call(a,m.id)?a[m.id]:null; if(!o||typeof o!=="object") continue;
            for(const it of m.items){
              const x=Object.prototype.hasOwnProperty.call(o,it.id)?Math.trunc(Number(o[it.id])):0; if(!Number.isFinite(x)||x===0) continue;
              const cur=rbCount(st,m,it.id);
              const nv=it.kind==="counted"?Math.max(0,Math.min(it.max||9999,cur+Math.max(-9999,Math.min(9999,x)))):(x>0?1:0);
              if(nv!==cur){ st.coll[m.id][it.id]=nv; stats.fired.push(`${m.label}: ${it.label} ${nv>cur?"+":""}${nv-cur}`); }
            }
          }
        }
        else if(q.k==="j"&&a&&typeof a==="object"&&!Array.isArray(a)){
          for(const m of jPend){
            const l=Object.prototype.hasOwnProperty.call(a,m.id)?a[m.id]:null; if(!Array.isArray(l)) continue;
            for(const it of m.items) if(l.includes(it.id)&&rbCanRecord(st,m,it)) rbRecord(st,m,it,stats);
          }
        }
      });
      for(const m of nums){
        const mine=qs.map((q,i)=>({q,a:ans[`q${i+1}`]})).filter(x=>x.q.m===m&&(x.q.k==="r"||x.q.k==="x"));
        if(!mine.length) continue;
        const ai=m.ai, base=st.values[m.id]; let v=base, any=false;
        const ex=mine.find(x=>x.q.k==="x");
        if(ex){
          const amt=Number(ex.a);
          if(Number.isFinite(amt) && amt!==0 && !(amt<0 && m.type==="number" && !m.spend)){ v=base+amt; any=true; stats.fired.push(`${m.label}: ${amt>0?"+":""}${amt} (extracted)`); }
        } else {
          let fr=mine.filter(x=>x.a===true).map(x=>x.q);
          if(ai.negOverrides){ const dl=fr.map(q=>rbChange(base,q.r,pre)-base); if(dl.some(x=>x<0)&&dl.some(x=>x>0)) fr=fr.filter((q,i)=>dl[i]<=0); }
          for(const q of fr){ v=rbChange(v,q.r,pre); st.lastFired[q.key]=st.turn; stats.fired.push(`${m.label}: ${q.r.id}`); any=true; }
        }
        if(any){
          let net=v-base; if(Number.isFinite(ai.lo)) net=Math.max(net,ai.lo); if(Number.isFinite(ai.hi)) net=Math.min(net,ai.hi);
          st.values[m.id]=rbFix(m,base+net); fired.add(m.id);
        }
      }
    }
  }

  // 3. decay (only for meters nothing changed this turn; counts quiet turns since the last change), per-message steps, story clock
  for(const m of nums){
    if((m.type==="bar"||m.type==="pips") && Number.isFinite(m.decay) && m.decay_every>=1){
      if(fired.has(m.id)) st.idle[m.id]=0;
      else { st.idle[m.id]=(st.idle[m.id]||0)+1; if(st.idle[m.id]>=m.decay_every){ st.values[m.id]=rbFix(m,st.values[m.id]+m.decay); st.idle[m.id]=0; } }
    }
    if(m.type==="number" && Number.isFinite(m.perMsg) && m.perMsg!==0) st.values[m.id]=rbFix(m,st.values[m.id]+m.perMsg);
  }
  if(clk&&st.clock){
    const before=st.clock.t;
    if(clk.mode==="date"){ if(clk.stepEvery>0){ st.clock.ctr=(st.clock.ctr||0)+1; if(st.clock.ctr>=clk.stepEvery){ st.clock.t+=1440; st.clock.ctr=0; } } }
    else st.clock.t+=(Number.isFinite(clk.stepMin)?clk.stepMin:0);
    if(skipDays>0){ st.clock.t+=skipDays*1440; st.clock.ctr=0; stats.fired.push(`${clk.label}: skipped ${skipDays} day${skipDays===1?"":"s"}`); }
    if(skipMin>0){ st.clock.t+=skipMin; stats.fired.push(`${clk.label}: skipped ${skipMin} min`); }
    if(st.clock.t!==before&&!stats.fired.some(x=>x.startsWith(clk.label+":"))) stats.clock=true;
  }

  // 4. dice that roll after the meters have settled
  const risen={}; for(const m of nums){ const d=st.values[m.id]-start[m.id]; if(d) risen[m.id]=d; }
  diceTurn("after_meters",risen);

  // 5. meter triggers (last, never chained: they read a snapshot and only move their own meter)
  const snap=Object.assign({},st.values);
  for(const g of (rb.meter_triggers||[])){
    if(g.on===false) continue;
    const om=ms.find(x=>x.id===g.m); if(!om||!rbIsNum(om)) continue;
    for(const tr of g.triggers){
      const holds=rbCondsOk(tr,st), go=rbGate(st,`t:${g.m}:${tr.id}`,holds,tr.fire||"cross",tr.every_turns);
      if(!go) continue;
      st.values[g.m]=rbFix(om,rbChange(st.values[g.m],tr.do,snap)); stats.fired.push(`${om.label}: trigger ${tr.id}`);
    }
  }

  for(const m of nums){ const d=Math.round((st.values[m.id]-start[m.id])*100)/100; if(d!==0) st.delta[m.id]=d; }
  stats.ms=Date.now()-t0; stats.changes=nums.filter(m=>st.delta[m.id]).map(m=>`${m.label} ${st.delta[m.id]>0?"+":""}${st.delta[m.id]}`);
  S.lastRbStats=stats;
  persistSession(); updateStatusUI();
}

/* ---- What the narrator is told ---- */
function rbJournalNewest(m,st,n){
  const seen=new Set(), out=[], arr=st.jrn[m.id]||[];
  for(let i=arr.length-1;i>=0&&out.length<n;i--){ const it=m.items.find(x=>x.id===arr[i].i); if(it&&!seen.has(it.id)){ seen.add(it.id); out.push(it); } }
  return out;
}
function rulebookContextString(){
  if(!S.rulebook||!S.rbState) return "";
  const st=S.rbState, out=[];
  for(const m of rbMeters()){
    const bits=[]; let tag="", pri=false;
    if(rbIsNum(m)){
      const v=st.values[m.id]; if(typeof v!=="number") continue;
      const lv=rbLevel(m,v); tag=lv.label;
      if(lv.instr){ bits.push(rbSub(lv.instr)); if(lv.override===true) pri=true; }
      if(m.tellModel===true) bits.push(`Exact value — ${m.label}: ${rbValueText(m,v)}.`);
    } else if(m.type==="clock"){
      if(!st.clock) continue; const cv=rbClockView(m,st), dims=rbClockDims(m);
      const labs=[]; if(cv.tod&&cv.dt) labs.push(cv.tod.label); if(cv.dayb&&dims.includes("day")) labs.push(cv.dayb.label); tag=labs.join(", ");
      if(dims.includes("tod")&&cv.tod&&cv.tod.instr){ bits.push(rbSub(cv.tod.instr)); if(cv.tod.override===true) pri=true; }
      if(dims.includes("day")&&cv.dayb&&cv.dayb.instr){ bits.push(rbSub(cv.dayb.instr)); if(cv.dayb.override===true) pri=true; }
      if(m.tellModel===true) bits.push(`It is ${cv.long}; story day ${cv.i.day}.`);
    } else if(m.type==="dice"){
      const d=st.dice[m.id]; if(!d) continue;
      const lv=rbLevel(m,d.roll); tag=lv.label;
      if(lv.instr){ bits.push(rbSub(lv.instr)); if(lv.override===true) pri=true; }
      if(m.tellModel===true) bits.push(`Latest roll: ${d.roll} on a d${m.sides}.`);
    } else if(m.type==="select"){
      const it=m.items.find(i=>i.id===st.sel[m.id]); if(!it) continue; tag=it.label;
      if(it.instruction) bits.push(rbSub(it.instruction));
      if(m.tellModel===true) bits.push(`Current: ${it.label}.`);
    } else if(m.type==="collection"){
      const held=m.items.filter(it=>rbCount(st,m,it.id)>0);
      for(const it of held) if(it.instruction) bits.push(rbSub(it.instruction));
      if(m.tellModel===true) bits.push(`${rbSub("{{user}}")} has: ${held.length?held.map(it=>it.kind==="counted"?`${it.label} ×${rbCount(st,m,it.id)}`:it.label).join(", "):"nothing"}.`);
    } else if(m.type==="journal"){
      if(m.tellModel!==false){ const l=rbJournalNewest(m,st,10); if(l.length) bits.push(`Already happened, newest first: ${l.map(it=>rbSub(it.label)).join("; ")}.`); }
    }
    if(bits.length) out.push(`- ${m.label}${tag?` (${tag})`:""}: ${pri?"PRIORITY \u2014 ":""}${bits.join(" ")}`);
  }
  for(const r of rbActiveRules()) if(r.instr) out.push(`- Situation: ${rbSub(r.instr)}`);
  return out.join("\n");
}

  const body=RB_ICONS[name]||'<circle cx="12" cy="12" r="8"/>';

  }

    let h=""; for(let i=0;i<n;i++) h+=`<span class="rb-pip${i<on?" on":""}">${rbIcon(m.icon&&RB_ICONS[m.icon]?m.icon:"dot",16,i<on)}</span>`;

function rbChipText(m){

    const v=st.values[m.id]; if(typeof v!=="number") return null;
    const lv=rbLevel(m,v), r=rbRange(m);
    if(m.type==="number"){ const d=[0,1,2].includes(m.decimals)?m.decimals:0; return m.display==="level"?(lv.revealed===false?"???":lv.label):`${m.unit||""}${v.toFixed(d)}`; }
    return m.type==="bar"?`${v}/${r.max}`:`${v-r.min}/${r.max-r.min}`;
  }
  if(m.type==="clock"){ if(!st.clock) return null; const cv=rbClockView(m,st), dm=`${cv.i.dom} ${RB_MONTHS[cv.i.month-1].slice(0,3)}`; return m.display==="daycount"?`Day ${cv.i.day}`:(cv.dt?`${dm} ${cv.time}`:dm); }

function loadRulebookFile(ev){
  const file=ev.target.files&&ev.target.files[0]; if(!file) return;
  const done=()=>{ ev.target.value=""; renderRulebookModal(); };
  try{ checkFileObject(file,RB_MAX_FILE_CHARS); }
  catch(e){ S.rbMsg={ok:false,title:"Couldn't load rulebook",lines:[e.message]}; done(); return; }
  const reader=new FileReader();
  reader.onload=fev=>{
    try{
      const res=rbImport(safeParseFileJSON(fev.target.result,RB_MAX_FILE_CHARS));
      if(!res.rb){ S.rbMsg={ok:false,title:"Couldn't load rulebook",lines:res.errors}; }
      else {
        applyRulebook(res.rb,"file",file.name);
        const inactive=rbInactive(res.rb);
        S.rbMsg={ok:true,title:`Loaded "${res.rb.name}".`,lines:[...res.warnings,...(inactive.length?[`Not active yet in this version: ${inactive.join(", ")}.`]:[])]};
      }
    }catch(e){ S.rbMsg={ok:false,title:"Couldn't load rulebook",lines:[e.message]}; }
    done();
  };
  reader.onerror=()=>{ S.rbMsg={ok:false,title:"Couldn't read the file",lines:[]}; done(); };
  reader.readAsText(file);
}

function rbEditApply(fn){
  if(!S.rbState||busy()) return;
  fn(S.rbState);
  if(S.rbPending){ try{ const b=JSON.parse(S.rbPending.before); fn(b); S.rbPending.before=JSON.stringify(b); }catch(e){} } // a retried turn keeps the edit
  persistSession(); updateStatusUI();

function rbSetClock(st,m,o){
  if(!st.clock) return;
  const base=rbClockStart(m), info=rbClockInfo(m,st.clock.t);
  let y=info.year, mo=info.month, d=info.dom, hh=info.hh, mi=info.mi;
  if(o.date){ const p=/^(\d{4})-(\d{2})-(\d{2})$/.exec(o.date); if(!p) return; y=+p[1]; mo=+p[2]; d=+p[3]; }
  if(o.day!==undefined){ const b=new Date(base), dt=new Date(Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate()+o.day-1)); y=dt.getUTCFullYear(); mo=dt.getUTCMonth()+1; d=dt.getUTCDate(); }
  if(o.hh!==undefined){ hh=o.hh; mi=o.mm; }
  if(y<100) return;
  const ms=Date.UTC(y,mo-1,d,hh,mi); if(!Number.isFinite(ms)) return;
  st.clock.t=Math.max(-1e9,Math.min(1e9,Math.round((ms-base)/60000))); st.clock.ctr=0;
}
function rbInline(el,o,commit){
  const inp=document.createElement("input"); inp.className="rb-in"; inp.type=o.type; inp.setAttribute("aria-label","Edit value");
  for(const k of ["min","max","step"]) if(o[k]!==undefined) inp[k]=o[k];
  inp.value=o.value; let done=false;
  const fin=ok=>{
    if(done) return; done=true;
    if(ok&&inp.value!==""&&inp.value!==String(o.value)){
      const v=o.type==="number"?Number(inp.value):inp.value;
      if(o.type==="number"?Number.isFinite(v):/^\d{4}-\d{2}-\d{2}$/.test(v)){ commit(v); return; }
    }
    updateStatusUI();
  };
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); fin(true); } else if(e.key==="Escape"){ e.preventDefault(); fin(false); } });
  inp.addEventListener("change",()=>{ if(o.type==="date") fin(true); });
  inp.addEventListener("blur",()=>fin(true));
  el.replaceWith(inp); inp.focus();
  if(o.type==="date"){ try{ if(inp.showPicker) inp.showPicker(); }catch(e){} } else inp.select();
}
function rbInlineTime(el,m){
  const info=rbClockInfo(m,S.rbState.clock.t), w=document.createElement("span"); w.className="rb-ed"; let done=false;
  w.innerHTML=`<input class="rb-in rb-hm" type="number" min="0" max="23" step="1" value="${info.hh}" aria-label="Hour (0 to 23)"> : <input class="rb-in rb-hm" type="number" min="0" max="59" step="1" value="${info.mi}" aria-label="Minute (0 to 59)">`;
  const [h,mi]=w.querySelectorAll("input");
  const fin=ok=>{
    if(done) return; done=true;
    const hh=Number(h.value), mm=Number(mi.value);
    if(ok&&h.value!==""&&mi.value!==""&&Number.isInteger(hh)&&Number.isInteger(mm)&&hh>=0&&hh<=23&&mm>=0&&mm<=59&&(hh!==info.hh||mm!==info.mi)){ rbEditApply(s=>rbSetClock(s,m,{hh,mm})); return; }
    updateStatusUI();
  };
  w.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); fin(true); } else if(e.key==="Escape"){ e.preventDefault(); fin(false); } });
  w.addEventListener("focusout",()=>setTimeout(()=>{ if(!w.contains(document.activeElement)) fin(true); },0));
  el.replaceWith(w); h.focus(); h.select();
}
function rbEditStart(el){
  if(busy()||!S.rbState) return;
  const m=rbById(el.dataset.rbedit); if(!m||m.userEditable!==true||m.type==="dice") return;
  const st=S.rbState, kind=el.dataset.kind, p2=n=>String(n).padStart(2,"0");
  if(kind==="opt"){ const id=el.dataset.item; if(m.items.some(i=>i.id===id)) rbEditApply(s=>{ s.sel[m.id]=id; }); return; }
  if(kind==="coll"){
    const it=m.items.find(i=>i.id===el.dataset.item); if(!it) return;
    if(it.kind!=="counted"){ rbEditApply(s=>{ s.coll[m.id][it.id]=rbCount(s,m,it.id)>0?0:1; }); return; }
    const mx=it.max||9999;
    rbInline(el,{type:"number",min:0,max:mx,step:1,value:rbCount(st,m,it.id)},v=>rbEditApply(s=>{ s.coll[m.id][it.id]=Math.max(0,Math.min(mx,Math.round(v))); }));
    return;
  }
  if(kind==="num"&&rbIsNum(m)){
    const r=rbRange(m), pips=m.type==="pips", dec=m.type==="number"?([0,1,2].includes(m.decimals)?m.decimals:0):0, cur=st.values[m.id];
    rbInline(el,{type:"number",min:pips?0:r.min,max:pips?r.max-r.min:(Number.isFinite(r.max)?r.max:undefined),step:dec?1/Math.pow(10,dec):1,value:pips?cur-r.min:cur},
      v=>rbEditApply(s=>{ s.values[m.id]=rbFix(m,pips?r.min+v:v); delete s.delta[m.id]; }));
    return;
  }
  if(m.type!=="clock"||!st.clock) return;
  const info=rbClockInfo(m,st.clock.t);
  if(kind==="date") rbInline(el,{type:"date",value:`${String(info.year).padStart(4,"0")}-${p2(info.month)}-${p2(info.dom)}`},v=>rbEditApply(s=>rbSetClock(s,m,{date:v})));
  else if(kind==="day") rbInline(el,{type:"number",min:1,step:1,value:info.day},v=>rbEditApply(s=>rbSetClock(s,m,{day:Math.max(1,Math.min(3650000,Math.round(v)))})));
  else if(kind==="time"&&m.mode!=="date") rbInlineTime(el,m);
}

      <label style="${row};cursor:pointer"><span>Debug stats<br><span style="font-size:10px;color:var(--textD)">Show lorebook and API stats under each response</span></span><input type="checkbox" data-sh="debug" ${S.debug?"checked":""}/></label>
      <button data-sh="close" style="align-self:flex-end;padding:7px 16px;background:transparent;border:1px solid var(--bdrM);border-radius:4px;color:var(--textM);cursor:pointer;font-size:12px">Close</button>

async function deriveTools(genderV,descV,settingV,engineV){
  const sObj = SETTINGS.find(x=>x.key===settingV);
  const sl = sObj ? sObj.label : settingV;
  const eObj = ENGINES.find(x=>x.key===engineV);
  const el = eObj ? eObj.label : engineV;
  try{
    const raw = await callClaude([{role:"user",content:`Player description: "${descV.trim()||"none given"}". Gender: ${genderV}. Story setting: ${sl}. Plot engine: ${el}.\n\nInfer a plausible occupation/role for this character. If the description clearly states or strongly implies one, use that. Otherwise, infer something that fits the setting and plot engine naturally (e.g. a Contemporary Detective story implies a detective/investigator, a Sci-Fi Superhero story implies a hero with sci-fi-appropriate gear) \u2014 do NOT default to a generic "Traveler" with rustic gear if the setting/engine suggest something more specific. Then list 2-4 items/gear they would reasonably always carry for that role, fitting to the setting (e.g. a contemporary detective carries a phone and a badge, not a waterskin). Return ONLY raw JSON: {"occupation":"...","kit":"..."}`}],"Respond ONLY with raw JSON, no markdown.",200);
    const parsed = parseJSON(raw,null);
    if(!parsed || typeof parsed.occupation!=="string" || !parsed.occupation.trim() || typeof parsed.kit!=="string" || !parsed.kit.trim()){
      return {occupation:"Traveler",kit:"a simple pack with basic provisions"};
    }
    return parsed;
  }catch(e){
    return {occupation:"Traveler",kit:"a simple pack with basic provisions"};
  }
}

async function deriveCharacterNames(descV){
  if(!descV || !descV.trim()) return [];
  try{
    const raw = await callClaude([{role:"user",content:`Character description: "${descV.trim()}"\n\nExtract any name(s) explicitly given for this character \u2014 civilian name, hero/code name, alias, callsign, etc. Only include names actually stated in the text; do not invent one. Return ONLY raw JSON: {"names":["Name1","Name2"]} (empty array if no name is given).`}],"Respond ONLY with raw JSON, no markdown.",150);
    const parsed = parseJSON(raw,null);
    if(parsed && Array.isArray(parsed.names)) return parsed.names.filter(n=>typeof n==="string"&&n.trim()).slice(0,3);
  }catch(e){}
  return [];
}

/* ── Extraction: quest, inventory, characters \u2014 runs every turn ── */
async function extractState(narrativeText,pInfo,curQuest,curKey,curItems,curChars,curTools){
  try{
    const toolsLine = curTools ? `Tools of the Trade kit (fixed baseline gear \u2014 NEVER log these or close variants of them as itemsGained, they are not new pickups): ${curTools.kit}` : "Tools of the Trade kit: none set";
    const knownCharsLine = curChars.map(c=>{
      const namesArr = (c.names||[c.name]).filter(Boolean);
      const primary = namesArr[0]||"Unknown";
      const aliasTag = namesArr.length>1 ? ` [also known as: ${namesArr.slice(1).join(", ")}]` : "";
      const roleTag = c.role ? `role: ${c.role}` : "role: unknown";
      const noteTag = c.note ? `; ${c.note}` : "";
      return `${primary}${aliasTag} (${roleTag}${noteTag})`;
    }).join("; ")||"none";
    const prompt=`Recent narration:\n"""${narrativeText}"""\n\nCurrent quest: ${curQuest?`${curQuest.title} \u2014 ${curQuest.desc}`:"none"}\n${toolsLine}\nCurrent key items: ${curKey.map(i=>i.name).join(", ")||"none"}\nCurrent general items: ${curItems.map(i=>i.name).join(", ")||"none"}\nKnown characters (with what's known about them so far): ${knownCharsLine}\n\nAnalyse ONLY what this narration establishes. Return ONLY raw JSON:\n{\n "questUpdate": {"action":"set"|"update"|"complete"|"none","title":"...","desc":"..."},\n "itemsGained": [{"name":"...","desc":"...","key":boolean}],\n "itemsLost": ["exact name", ...],\n "characterUpdates": [{"name":"...","present":true|false,"status":"ally|hostile|neutral|unknown|romantic|deceased|other or null","note":"short one-line description/relationship, or null","role":"short stable descriptor of their occupation/role/abilities, or null","alsoKnownAs":"an ADDITIONAL name/alias for this character being genuinely revealed or established this turn (e.g. a hero's civilian identity, or vice versa) \u2014 both names remain valid and may both be used going forward; or null","replaces":"exact prior name from the Known characters list above, ONLY if this character was previously tracked under a different name or generic placeholder (e.g. 'Rescued Hostage') and has now been properly identified as the same individual \u2014 else null"}]\n}\nRules: For questUpdate \u2014 use "set" ONLY when there was no active quest and a brand-new one is being established. Use "update" when the ALREADY-active quest's specifics, title, or immediate objective are being refined/progressed but it is fundamentally the same overarching goal \u2014 do NOT use "set" for this, that incorrectly signals a brand new quest to the player. Use "complete" when the active quest has just been fully resolved. Use "none" if nothing quest-related changed. Don't invent goals from flavor text alone. Only list itemsGained if something tangible was NEWLY acquired this turn \u2014 never for gear that is part of the Tools of the Trade kit above (that kit is always already carried, mentioning it again is not a new pickup). Only list itemsLost if something was clearly consumed, destroyed, given away, lost, or stolen. key=true only for plot-critical, irreplaceable items.\nFor characterUpdates: include a named, significant character (not background extras) whenever they are present in this scene OR clearly just left/exited it. Only reference characters from the Known characters list, or genuinely new characters actually appearing in THIS narration \u2014 never reuse a name from the Known characters list for an unrelated new character just because it happens to be listed as "known". Set "present" to true if they are in the scene right now, false if they just departed. ONLY set "status" and "note" if something about the character's relationship, disposition, or situation actually changed this turn \u2014 otherwise leave them as null so their prior relationship/description is preserved untouched. NEVER use status or note to describe mere absence (e.g. never write "not present" as a status or note) \u2014 absence is communicated only via "present":false. Use "replaces" to merge a newly-identified character with their prior placeholder entry instead of creating a duplicate. Use "role" to record a STABLE descriptor of who/what this character fundamentally is \u2014 their occupation, position, or abilities (e.g. "Academy student", "History teacher", "City Watch detective") \u2014 and ONLY set it the first time this is established, or if it is later revealed to be genuinely different than previously understood; leave it null on every other turn so it is never overwritten by a description of their current action or last appearance. Do not conflate "role" with "note" \u2014 "note" is for relationship/situation/what just happened, "role" is for their enduring identity. If a known character's role is listed as "unknown" above and this narration provides or clearly implies information that would establish it \u2014 even if this isn't their first appearance \u2014 set "role" now to fill that gap. Use "alsoKnownAs" when a character is revealed to have a second, ongoing identity that will continue to be used alongside their current name (e.g. a hero's secret identity) \u2014 both names stay valid and remain displayed together; this is NOT the same as "replaces", which is only for fully retiring a placeholder label (like "Rescued Hostage") that was never really a name in the first place. When referencing an existing character via "name" or "replaces", use exactly ONE of their individual known names \u2014 never a combined form, and never text like "[also known as: ...]" (that bracketed text is display formatting only, never a real name to echo back).`;
    const raw = await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",500);
    const parsed = parseJSON(raw,{questUpdate:{action:"none"},itemsGained:[],itemsLost:[],characterUpdates:[]});

    if(parsed.questUpdate && (parsed.questUpdate.action==="set" || parsed.questUpdate.action==="update")){
      const p = S.player;
      p.quest = {title:parsed.questUpdate.title, desc:parsed.questUpdate.desc, startedBookId: p.quest ? p.quest.startedBookId : undefined};
    } else if(parsed.questUpdate && parsed.questUpdate.action==="complete"){
      S.player.quest = null;
    }
    if(Array.isArray(parsed.itemsLost) && parsed.itemsLost.length){
      S.player.keyItems = S.player.keyItems.filter(i=>!parsed.itemsLost.includes(i.name));
      S.player.items = S.player.items.filter(i=>!parsed.itemsLost.includes(i.name));
    }
    let rejected = {key:[],general:[]};
    if(Array.isArray(parsed.itemsGained) && parsed.itemsGained.length){
      const lostNames = parsed.itemsLost||[];
      const curKeyAfterLoss = curKey.filter(i=>!lostNames.includes(i.name));
      const curItemsAfterLoss = curItems.filter(i=>!lostNames.includes(i.name));
      let newKey=[...curKeyAfterLoss];
      let newItems=[...curItemsAfterLoss];
      for(const ng of parsed.itemsGained){
        if(!ng.name)continue;
        if(ng.key){
          if(newKey.find(i=>i.name===ng.name))continue;
          if(newKey.length>=MAX_KEY){ rejected.key.push(ng.name); continue; }
          newKey.push({name:ng.name,desc:ng.desc});
        } else {
          if(newItems.find(i=>i.name===ng.name))continue;
          if(newItems.length>=MAX_ITEMS){ rejected.general.push(ng.name); continue; }
          newItems.push({name:ng.name,desc:ng.desc});
        }
      }
      S.player.keyItems = newKey;
      S.player.items = newItems;
    }
    parsed.rejected = rejected;
    if(Array.isArray(parsed.characterUpdates) && parsed.characterUpdates.length){
      let chars=[...S.player.characters];
      for(let cu of parsed.characterUpdates){
        if(!cu.name)continue;
        if(cu.name.includes(" / ")) cu={...cu,name:cu.name.split(" / ")[0].trim()};
        if(cu.alsoKnownAs && cu.alsoKnownAs.includes(" / ")) cu={...cu,alsoKnownAs:null};
        const idx=chars.findIndex(c=>(c.names||[c.name]).includes(cu.name) || (cu.replaces && (c.names||[c.name]).includes(cu.replaces)));
        const prior = idx>=0 ? chars[idx] : null;
        if(idx>=0) chars.splice(idx,1);

        let namesArr;
        if(cu.replaces && prior){
          namesArr=[cu.name];
        } else {
          namesArr = prior ? [...(prior.names||[prior.name]).filter(Boolean)] : [];
          if(!namesArr.includes(cu.name)) namesArr.push(cu.name);
        }
        if(cu.alsoKnownAs && !namesArr.includes(cu.alsoKnownAs)) namesArr.push(cu.alsoKnownAs);

        const entry={
          names:namesArr,
          status:cu.status || (prior && prior.status) || "unknown",
          note:cu.note || (prior && prior.note) || "",
          role:cu.role || (prior && prior.role) || "",
          present: cu.present!==undefined ? !!cu.present : true,
        };
        chars.push(entry);
      }
      if(chars.length>MAX_CHARS){
        const questText = curQuest ? `${curQuest.title} ${curQuest.desc}` : "";
        const isProtected = (namesArr) => namesArr.some(n=>narrativeText.includes(n)||questText.includes(n));
        let i=0;
        while(chars.length>MAX_CHARS && i<chars.length){
          if(!isProtected(chars[i].names||[chars[i].name])){ chars.splice(i,1); }
          else { i++; }
        }
      }
      S.player.characters = chars;
    }


    return parsed;
  }catch(e){return null;}
}

/* ── Journal event helpers ── */
async function collapseEventsIfNeeded(events,acts){
  if(events.length<=EVENTS_LIMIT) return {events,acts};
  const toCollapse=events.slice(0,EVENTS_COLLAPSE);
  const rest=events.slice(EVENTS_COLLAPSE);
  try{
    const raw2=await callClaude([{role:"user",content:`Condense the following journal events into a single short paragraph (3-4 sentences) summarizing this stretch of the story as a chapter/act overview:\n\n${toCollapse.map(e=>"- "+e.text).join("\n")}\n\nReturn ONLY raw JSON: {"act":"..."}`}],"Respond ONLY with raw JSON, no markdown.",400);
    const parsed2=parseJSON(raw2,null);
    return {events:rest,acts:[...acts,{text:(parsed2&&parsed2.act)?parsed2.act:toCollapse.map(e=>e.text).join(" ")}]};
  }catch(e){
    return {events:[...toCollapse,...rest],acts};
  }
}

async function tagQuestFromExtraction(text,pInfo,freshState){
  const fs=freshState||{};
  const qCur = fs.quest!==undefined?fs.quest:S.player.quest;
  const kCur = fs.keyItems!==undefined?fs.keyItems:S.player.keyItems;
  const iCur = fs.items!==undefined?fs.items:S.player.items;
  const cCur = fs.characters!==undefined?fs.characters:S.player.characters;
  const tCur = fs.tools!==undefined?fs.tools:S.player.tools;
  const qu=await extractState(text,pInfo,qCur,kCur,iCur,cCur,tCur);
  const qAction = qu && qu.questUpdate ? qu.questUpdate.action : undefined;
  if(qAction==="set"){
    const startedBookId = S.books.length ? S.books[S.books.length-1].id : null;
    if(S.player.quest) S.player.quest = {...S.player.quest, startedBookId};
  }
  if(qAction==="complete"){
    const completedTitle=(qCur&&qCur.title)||qu.questUpdate.title||"";
    const completedDesc=(qCur&&qCur.desc)||qu.questUpdate.desc||"";
    const startedBookId=(qCur&&qCur.startedBookId)!==undefined?qCur.startedBookId:null;
    S.player.completedQuests=[...(S.player.completedQuests||[]),{title:completedTitle,desc:completedDesc,startedBookId,completedBookId:null,outcome:"completed"}];
    await appendJournalEvents([`Completed the quest "${completedTitle}"${completedDesc?`: ${completedDesc}`:""}`]);
    if(S.memory.acts.length>=BOOK_SUGGEST_ACTS || S.memory.events.length>=BOOK_SUGGEST_EVENTS){
      S.bookSuggestion = true;
    }
  }
  if(qu && (qAction==="set"||qAction==="update"||qAction==="complete"||(qu.rejected&&qu.rejected.key&&qu.rejected.key.length)||(qu.rejected&&qu.rejected.general&&qu.rejected.general.length))){
    const a=[...S.msgs];
    const last={...a[a.length-1]};
    if(qAction==="set"||qAction==="update"||qAction==="complete"){
      last.questTag={
        action:qAction,
        title: qAction==="complete" ? ((qCur&&qCur.title)||qu.questUpdate.title) : qu.questUpdate.title
      };
    }
    if((qu.rejected&&qu.rejected.key&&qu.rejected.key.length)||(qu.rejected&&qu.rejected.general&&qu.rejected.general.length)){
      last.inventoryFullTag={key:(qu.rejected&&qu.rejected.key)||[],general:(qu.rejected&&qu.rejected.general)||[]};
    }
    a[a.length-1]=last;
    S.msgs=a;
  }
  return qu;
}

async function compactHistory(newHistory){
  /* Fork: no summarising. Facts are captured per turn by updateDynLore, so old turns just fall out of the window. */
  let h=newHistory.slice(-HISTORY_LIMIT);
  if(h.length && h[0].role!=="user") h=h.slice(1);
  S.history=h;
}

async function performAutosave(narratorCountAtCall){
  try{
    const engineLabel = S.engine!=="story_driven" ? ` ${labelFor(ENGINES,S.engine)}` : "";
    const namesSuffix = (S.player.names && S.player.names.length) ? ` \u2014 ${S.player.names.join(" / ")}` : "";
    const name = `Autosave \u2014 ${labelFor(MOODS,S.mood)} ${labelFor(SETTINGS,S.setting)}${engineLabel}${namesSuffix}`;
    const payload={name,msgs:S.msgs.filter(m=>m.type!=="error"),history:S.history,mood:S.mood,setting:S.setting,engine:S.engine,
      gender:S.player.gender,desc:S.player.desc.trim(),quest:S.player.quest,keyItems:S.player.keyItems,items:S.player.items,tools:S.player.tools,
      characters:S.player.characters,completedQuests:S.player.completedQuests,memory:S.memory,books:S.books,names:S.player.names,lorebook:S.lorebook,rulebook:S.rulebook,rbState:S.rbState,dynLore:S.dynLore,
      savedAt:Date.now(),isAutosave:true};
    const payloadStr=JSON.stringify(payload);
    if(byteLength(payloadStr)>SAVE_SIZE_LIMIT_BYTES){
      throw new Error("Autosave failed \u2014 this tale is too large to save (near the per-save storage limit). Manual saves will likely fail too \u2014 export your progress and free up space.");
    }
    const res=await window.storage.set(saveKey(AUTOSAVE_ID),payloadStr);
    if(!res) throw new Error("Autosave failed \u2014 storage write did not complete. You may be at your total storage limit; manual saves will likely fail too.");
    S.autosaveMeta={name,mood:S.mood,setting:S.setting,engine:S.engine,savedAt:payload.savedAt};
    S.lastSaveTurnCount=narratorCountAtCall;
    S.saveTracking={...S.saveTracking,result:"autosaved",message:null};
    render();
    setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },2200);
  }catch(err){
    S.saveTracking={...S.saveTracking,result:"error",message:err.message||"Autosave failed."};
    render();
    setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },5000);
  }
}

function maybeAutosave(){
  if(!S.autosaveEnabled || busy() || autosaveInFlight) return;
  const narratorCount = S.msgs.filter(m=>m.type==="narrator").length;
  if(narratorCount - S.lastSaveTurnCount >= AUTOSAVE_INTERVAL){
    autosaveInFlight=true;
    performAutosave(narratorCount).finally(()=>{ autosaveInFlight=false; });
  }
}

function takeDebugSnapshot(text){
  const d={rb:S.lastRbStats,lore:S.lastLoreStats,dyn:S.lastDynStats,calls:S.dbgAcc.calls,ms:S.dbgAcc.ms,chars:(text||"").length};
  S.dbgAcc={calls:0,ms:0};
  return d;
}
async function commitNarrative(text,userContent,extraFields){
  S.rbPending=null;
  extraFields = {debug:takeDebugSnapshot(text),...(extraFields||{})};
  S.msgs=[...S.msgs,{type:"narrator",text,...extraFields}];
  appendMessage(S.msgs[S.msgs.length-1]); // targeted DOM update: append, don't rebuild the log
  const newHistory = userContent===null ? [...S.history,{role:"assistant",content:text}] : [...S.history,{role:"user",content:userContent},{role:"assistant",content:text}];
  await compactHistory(newHistory);
  const [,dynRes]=await Promise.all([tagQuestFromExtraction(text,playerInfo()),updateDynLore(userContent,text)]);
  const lastMsg=S.msgs[S.msgs.length-1]; if(lastMsg && lastMsg.debug) lastMsg.debug.dynOps=dynRes;
  refreshLastMessageNode(); // tagQuestFromExtraction may have annotated the message just appended
  S.dbgAcc={calls:0,ms:0};
  updateBooksUI();
}

async function runStep(coreFn,retryKind,retryPayload,replaceIdx){
  if(replaceIdx!==undefined){
    S.msgs = S.msgs.filter((_,i)=>i!==replaceIdx);
    removeMessageNode(replaceIdx);
  }
  S.status="narrating";
  render();
  try{
    const nextStatus=await coreFn();
    S.status=nextStatus||"idle";
  }catch(err){
    S.msgs=[...S.msgs,{type:"error",text:err.message||"Error",retry:{kind:retryKind,payload:retryPayload}}];
    S.status="idle";
    appendMessage(S.msgs[S.msgs.length-1]);
  }
  render();
  persistSession();
  scrollBottom();
  maybeAutosave();
  const inputEl=document.getElementById("mainInput");
  if(inputEl) inputEl.focus();
}

async function narratorTurnCore(action){
  await runRulebookTurn(typeof action==="string"?action:"");
  const pInfo=playerInfo(typeof action==="string"?action:"");
  const raw=await callClaude([...S.history,{role:"user",content:`Player action: "${action}"\n\nConsider the player's carried items/gear, described skills/background, and the rulebook state (given in the system context) when evaluating this action. Decide ONE of:\n- "narrative": no real stakes (looking, walking, simple talk) \u2014 just continue the story.\n- "item_resolution": the action plausibly and directly resolves itself by expending ONE specific general item the player carries (e.g. using a bandage to tend a wound) \u2014 no challenge needed. Only use this if a specific carried general item is clearly suited and would reasonably be used up by this exact action. Key items and Tools of the Trade are never expended this way.\n- "challenge": meaningful stakes exist (combat, persuasion, stealth, danger, deception, magic, etc).\n\nFor "challenge", assess whether the player's gear/skills favor success, work against them, both (which cancel out to neutral), or neither \u2014 and also factor in the rulebook state (meter levels that hinder or help the player), using this same single modifier tier. Multiple favorable or unfavorable factors never stack beyond a single tier.\n\nRaw JSON only:\n{"resolution":"narrative"|"item_resolution"|"challenge","narrative":"continuation text for narrative/item_resolution, ending open with no player dialogue/actions written, or null for challenge","itemExpended":"exact carried item name for item_resolution, else null","modifier":"favorable"|"unfavorable"|"neutral","reason":"short phrase shown to the player explaining the modifier, or null if neutral"}`}],buildSystem(S.mood,S.setting,S.engine,pInfo,true));
  const parsed=parseJSON(raw,null);
  if(!parsed || typeof parsed!=="object" || !parsed.resolution){
    if(looksLikeDecline(raw)){
      throw new Error("The story engine declined to continue this scene as described. Try rephrasing your action.");
    }
    throw new Error("The story engine's response couldn't be understood (malformed reply)");
  }

  if(parsed.resolution==="item_resolution"){
    if(parsed.itemExpended){
      S.player.items = S.player.items.filter(i=>i.name!==parsed.itemExpended);
    }
    await commitNarrative(parsed.narrative||"...",action);
  } else if(parsed.resolution==="challenge"){
    const modifier = (parsed.modifier==="favorable"||parsed.modifier==="unfavorable") ? parsed.modifier : "neutral";
    const buttons = modifier==="favorable" ? shuffle(["success","fate","fate"])
                   : modifier==="unfavorable" ? shuffle(["failure","fate","fate"])
                   : shuffle(["success","failure","fate"]);
    S.challengeData={buttons,pending:action,revealed:null,modifier,reason:parsed.reason||null};
    S.history=[...S.history,{role:"user",content:action}];
    return "awaiting_choice";
  } else {
    await commitNarrative(parsed.narrative||"...",action);
  }
}

async function outcomeTurnCore(pendingV,outcome,meta){

  await commitNarrative(narrative,pendingV,{outcomeMeta:meta});
}

async function continueTurnCore(){

/* ── Books ── */
async function generateBookProposal(){
  const newBookId = newId();
  const eventsToArchive = S.memory.events;
  const actsToArchive = S.memory.acts;
  const questsToFile = (S.player.completedQuests||[]).filter(q=>q.completedBookId===null);
  const ongoingQuest = S.player.quest;

  const questSummaryLines = [
    ...questsToFile.map(q=>`- "${q.title}" (${q.outcome==="failed"?"failed":"completed"}): ${q.desc}`),
    ...(ongoingQuest ? [`- "${ongoingQuest.title}" (still ongoing): ${ongoingQuest.desc}`] : [])
  ].join("\n") || "None";

  const histText = S.history.map(h=>`${h.role==="user"?"Player":"Story"}: ${h.content}`).join("\n") || "None";
  const eventsText = eventsToArchive.map(e=>"- "+e.text).join("\n") || "None";
  const actsText = actsToArchive.map(a=>"- "+a.text).join("\n") || "None";

  const prompt=`You are closing out a chapter ("Book") of an ongoing story. Below is everything that has happened since the last Book (or since the story began, if this is the first).\n\nRecent raw scenes:\n${histText}\n\nEvents since last Book:\n${eventsText}\n\nActs since last Book:\n${actsText}\n\nQuests active in this span:\n${questSummaryLines}\n\nPlayer character's current description: "${S.player.desc.trim()||"none given"}"\n\nWrite:\n1. A short evocative chapter title (5-8 words).\n2. A comprehensive but concise "story so far" summary (5-8 sentences) covering everything that happened in this span, preserving named characters, open threads, and specific commitments \u2014 this will REPLACE all the detailed events/acts above as the ongoing memory of this period, so do not omit anything a future scene might need to stay consistent with.\n3. OPTIONAL character evolution: if events in this span plausibly changed something about the player character's outlook, reputation, relationships, or manner (NOT their core identity, name, or gender), propose a short addendum sentence reflecting that growth. If nothing has meaningfully changed, return null.\n\nReturn ONLY raw JSON: {"title":"...","summary":"...","characterEvolution":"... or null"}`;

  const raw=await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",900);
  const parsed=parseJSON(raw,null);
  if(!parsed || !parsed.title || !parsed.summary){
    if(looksLikeDecline(raw)){
      throw new Error("The story engine declined to summarize this chapter as described. Try again, or start the Book from a different point.");
    }
    throw new Error("Could not generate a Book summary \u2014 try again.");
  }
  return {newBookId,eventsToArchive,actsToArchive,questsToFile,ongoingQuest,title:parsed.title,summary:parsed.summary,characterEvolution:parsed.characterEvolution||null};
}
