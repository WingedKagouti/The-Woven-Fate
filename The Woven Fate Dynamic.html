function handleConfirmBook(){
  if(!S.bookModal)return;
  const {newBookId,eventsToArchive,actsToArchive,questsToFile,ongoingQuest,title,summary,charChoice,charText}=S.bookModal;

  const newBookQuests=[];
  const earlierBookNotes={};
  for(const q of questsToFile){
    const failed = q.outcome==="failed";
    if(q.startedBookId && q.startedBookId!==newBookId){
      newBookQuests.push({title:q.title,desc:q.desc,note:failed?"Failed here \u2014 began in an earlier chapter.":"Concluded here \u2014 began in an earlier chapter."});
      earlierBookNotes[q.startedBookId]=earlierBookNotes[q.startedBookId]||[];
      earlierBookNotes[q.startedBookId].push({title:q.title,desc:q.desc,note:failed?"Began here \u2014 failed in a later chapter.":"Began here \u2014 concluded in a later chapter."});
    } else {
      newBookQuests.push({title:q.title,desc:q.desc,note:failed?"Failed here.":"Completed here."});
    }
  }
  if(ongoingQuest){
    newBookQuests.push({title:ongoingQuest.title,desc:ongoingQuest.desc,note:"Ongoing \u2014 continues beyond this chapter."});
  }

  const newBook={id:newBookId,title,summary,quests:newBookQuests,events:eventsToArchive,acts:actsToArchive,closedAt:Date.now()};

  S.books = S.books.map(b=> earlierBookNotes[b.id] ? {...b,quests:[...b.quests,...earlierBookNotes[b.id]]} : b);
  S.books = [...S.books, newBook];

  S.memory = {events:eventsToArchive.slice(-2), acts:[]};

  const filedTitles=new Set(questsToFile.map(q=>q.title));
  S.player.completedQuests = (S.player.completedQuests||[]).map(q=> (filedTitles.has(q.title)&&q.completedBookId===null) ? {...q,completedBookId:newBookId} : q);
  S.player.quest = S.player.quest && !S.player.quest.startedBookId ? {...S.player.quest,startedBookId:newBookId} : S.player.quest;
  S.player.desc = (charChoice==="accept"||charChoice==="edit") && charText.trim() ? `${S.player.desc.trim()} ${charText.trim()}`.trim() : S.player.desc;

  S.bookModal=null;
  S.activeBookTab=S.books.length-1;
  S.msgs=[...S.msgs,{type:"bookmark",text:title}];
  S.status="idle";
  render(); // safety-net refresh (panels, save bar, input state, etc.)
  appendMessage(S.msgs[S.msgs.length-1]); // targeted: just append the bookmark divider
  persistSession();
}

function handleRegenerate(idx,retry){
  if(busy())return;
  if(retry.kind==="start"){
    S.msgs = S.msgs.filter((_,i)=>i!==idx);
    startGame();
  } else if(retry.kind==="continue"){
    S.msgs = S.msgs.filter((_,i)=>i!==idx);
    removeMessageNode(idx);
    handleContinue();
  } else if(retry.kind==="submit"){
    runStep(()=>narratorTurnCore(retry.payload.action),"submit",retry.payload,idx);
  } else if(retry.kind==="choice"){
    runStep(()=>outcomeTurnCore(retry.payload.pending,retry.payload.outcome,retry.payload.meta),"choice",retry.payload,idx);
  } else if(retry.kind==="book"){
    S.msgs = S.msgs.filter((_,i)=>i!==idx);
    removeMessageNode(idx);
    handleStartBook();
  }
}

async function startGame(){
  const m=S.mood, s=S.setting, e=S.engine, g=S.player.gender, d=S.player.desc;
  gameMounted=false; // force a full remount \u2014 this wipes the previous tale's log
  S.screen="game";
  S.msgs=[];
  S.saveTracking={activeSaveId:null,turnsAtSave:0,result:null,message:null};
  S.history=[];
  S.memory=JSON.parse(JSON.stringify(DEFAULT_MEMORY));
  S.dynLore=blankDynLore();
  S.books=[];
  S.bookSuggestion=false; S.bookModal=null;
  S.suggestions=null; S.suggOpen=false;
  S.lastSaveTurnCount=0;
  S.player.quest=null; S.player.keyItems=[]; S.player.items=[]; S.player.characters=[]; S.player.completedQuests=[]; S.player.names=[]; S.rbState=rbInitState(); S.rbPending=null; S.rbShown={}; S.lastRbStats=null;
  S.status="narrating";
  render();
  S.dbgAcc={calls:0,ms:0};
  const results = await Promise.all([deriveTools(g,d,s,e), deriveCharacterNames(d)]);
  const toolsResult=results[0], namesResult=results[1];
  S.player.tools=toolsResult; S.player.names=namesResult;
  const sObj=SETTINGS.find(x=>x.key===s); const sl=sObj?sObj.label:s;
  const eObj=ENGINES.find(x=>x.key===e); const el=eObj?eObj.label:e;
  const ml=(MOODS.find(x=>x.key===m)||{}).label||m;
  const pInfo={gender:g,desc:d.trim(),loreContext:buildLoreContext(d),rulebookContext:rulebookContextString()};
  const pBits=[];
  if(g!=="undefined") pBits.push(`a ${g} character`);
  if(d.trim()) pBits.push(`described as: ${d.trim()}`);
  pBits.push(`occupation: ${toolsResult.occupation} (carries: ${toolsResult.kit})`);
  const pClause = ` The player character is ${pBits.join(", ")}.`;
  const metaLine = `${ml} \u00b7 ${sl} \u00b7 ${el}`;
  S.msgs=[{type:"meta",text:metaLine}];
  const msgListEl=document.getElementById("msgList");
  if(msgListEl) msgListEl.innerHTML = renderMsgListHtml();

  await runStep(async()=>{
    const text=await callClaude([{role:"user",content:`Begin a new story set in a ${sl} world, with a ${el==="Story-Driven"?"plot that emerges naturally from the setting":el+" plot engine"}, and a ${ml} tone.${pClause} Vivid atmospheric opening, immediate tension, end on a moment of choice. 2\u20133 paragraphs, second person. Bold character names, italicise place names.`}],buildSystem(m,s,e,pInfo));
    S.msgs=[...S.msgs,{type:"narrator",text,debug:takeDebugSnapshot(text)}];
    appendMessage(S.msgs[S.msgs.length-1]);
    S.history=[{role:"assistant",content:text}];
    await tagQuestFromExtraction(text,pInfo,{tools:toolsResult,quest:null,keyItems:[],items:[],characters:[]});
    refreshLastMessageNode();
  },"start",{});
}

/* ── Save management ── */
async function handleSaveCurrent(asNew){
  if(busy())return;
  S.status="saving";
  render();
  const id = (!asNew && S.saveTracking.activeSaveId) ? S.saveTracking.activeSaveId : newId();
  const existing = S.saveList.find(s=>s.id===id);
  let name = existing ? existing.name : undefined;
  if(!name){
    const engineLabel = S.engine!=="story_driven" ? ` ${labelFor(ENGINES,S.engine)}` : "";
    const namesSuffix = (S.player.names && S.player.names.length) ? ` \u2014 ${S.player.names.join(" / ")}` : "";
    name = `${labelFor(MOODS,S.mood)} ${labelFor(SETTINGS,S.setting)}${engineLabel} Tale${namesSuffix}`;
  }
  let resultMsg=null;
  try{
    const payload={name,msgs:S.msgs.filter(m=>m.type!=="error"),history:S.history,mood:S.mood,setting:S.setting,engine:S.engine,
      gender:S.player.gender,desc:S.player.desc.trim(),quest:S.player.quest,keyItems:S.player.keyItems,items:S.player.items,tools:S.player.tools,
      characters:S.player.characters,completedQuests:S.player.completedQuests,memory:S.memory,books:S.books,names:S.player.names,lorebook:S.lorebook,rulebook:S.rulebook,rbState:S.rbState,dynLore:S.dynLore,
      savedAt:Date.now()};
    const payloadStr=JSON.stringify(payload);
    if(byteLength(payloadStr)>SAVE_SIZE_LIMIT_BYTES){
      throw new Error("This tale is too large to save (near the per-save storage limit). Export it now to back it up, then free space by deleting other saves.");
    }
    const res=await window.storage.set(saveKey(id),payloadStr);
    if(!res) throw new Error("Storage write did not complete \u2014 you may be at your total storage limit for this game.");
    const ids=await getSaveIndex();
    if(!ids.includes(id)){ids.push(id);await setSaveIndex(ids);}
    S.saveTracking={activeSaveId:id,turnsAtSave:S.msgs.filter(m=>m.type==="narrator").length,result:"saved",message:null};
    S.lastSaveTurnCount=S.msgs.filter(m=>m.type==="narrator").length;
    await refreshSaveList();
  }catch(err){
    resultMsg = err.message || "Unknown error";
    S.saveTracking={...S.saveTracking,result:"error",message:resultMsg};
  }
  S.status="idle";
  render();
  setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },resultMsg?5000:2200);
}

async function handleLoadSave(id){
  if(busy())return;
  S.status="loading_save";
  render();
  try{
    const r=await window.storage.get(saveKey(id));
    if(!r || !r.value){
      S.saveTracking={...S.saveTracking,result:"error",message:null};
      S.status="idle";
      render();
      return;
    }
    const d=parseStoredSave(r.value);
    S.msgs=d.msgs||[]; S.history=d.history||[]; S.mood=d.mood||null;
    S.setting=d.setting||null; S.engine=d.engine||"story_driven";
    S.player={
      gender:d.gender||"undefined",desc:d.desc||"",
      quest:d.quest||null,keyItems:d.keyItems||[],items:d.items||[],tools:d.tools||null,
      characters:(d.characters||[]).map(c=>{
        const base = c.names?c:{...c,names:[c.name].filter(Boolean)};
        const cleaned=[...new Set(base.names.filter(n=>n && !n.includes(" / ")))];
        return {...base,names: cleaned.length?cleaned:base.names};
      }),completedQuests:d.completedQuests||[],names:d.names||[],
    };
    S.memory=d.memory||JSON.parse(JSON.stringify(DEFAULT_MEMORY));
    S.lorebook=d.lorebook||null;
    { const _rb=rbRestore(d.rulebook,d.rbState); S.rulebook=_rb.rulebook; S.rbState=_rb.state; S.rbPending=null; S.rbShown={}; S.lastRbStats=null; }
    S.dynLore=d.dynLore?{...blankDynLore(),...d.dynLore}:seedDynLoreFromLegacy(d);
    S.books=d.books||[];
    S.activeBookTab=Math.max(0,(d.books||[]).length-1);
    S.saveTracking={activeSaveId:id,turnsAtSave:(d.msgs||[]).filter(m=>m.type==="narrator").length,result:"loaded",message:null};
    S.lastSaveTurnCount=(d.msgs||[]).filter(m=>m.type==="narrator").length;
    S.challengeData=null; S.input=""; S.screen="game";
    S.suggestions=null; S.suggOpen=false;
    S.bookSuggestion=false; S.bookModal=null;
    gameMounted=false; // force a full remount so the loaded log/panels are fresh
  }catch(e){
    S.saveTracking={...S.saveTracking,result:"error",message:null};
  }
  S.status="idle";
  render();
  persistSession();
  scrollBottom();
  setTimeout(()=>{ S.saveTracking={...S.saveTracking,result:null,message:null}; render(); },2200);
  setTimeout(()=>{ const el=document.getElementById("mainInput"); if(el) el.focus(); },100);
}

async function handleDeleteSave(id,ev){
  if(ev) ev.stopPropagation();
  if(busy())return;
  try{
    await window.storage.delete(saveKey(id));
    const ids=await getSaveIndex();
    await setSaveIndex(ids.filter(x=>x!==id));
    if(S.saveTracking.activeSaveId===id) S.saveTracking={...S.saveTracking,activeSaveId:null};
    if(id===AUTOSAVE_ID) S.autosaveMeta=null;
    await refreshSaveList();
  }catch(e){}
}

async function handleRenameSave(id,newNameVal){
  const trimmed=(newNameVal||"").trim();
  if(!trimmed){ S.renamingId=null; render(); return; }
  try{
    const r=await window.storage.get(saveKey(id));
    if(r && r.value){
      const d=JSON.parse(r.value);
      d.name=trimmed;
      const payloadStr=JSON.stringify(d);
      if(byteLength(payloadStr)<=SAVE_SIZE_LIMIT_BYTES){
        await window.storage.set(saveKey(id),payloadStr);
        await refreshSaveList();
      }
    }
  }catch(e){}
  S.renamingId=null;
  render();
}

async function handleExportSave(id,ev){
  if(ev) ev.stopPropagation();
  try{
    const r=await window.storage.get(saveKey(id));
    if(!r || !r.value)return;
    const d=JSON.parse(r.value);
    const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    const safeName=(d.name||"tale").replace(/[^a-z0-9_\- ]/gi,"").trim().replace(/\s+/g,"_")||"tale";
    a.href=url; a.download=`${safeName}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){}
}

function handleImportFile(ev){
  if(busy()){ ev.target.value=""; return; }
  const file=ev.target.files && ev.target.files[0];
  if(!file)return;
  try{ checkFileObject(file,SAVE_SIZE_LIMIT_BYTES); }catch(e){ S.importStatus=/large/.test(e.message)?"too_large":"error"; render(); ev.target.value=""; return; }
  S.importStatus=null;
  render();
  const reader=new FileReader();
  reader.onload=async(fev)=>{
    let d;
    try{ d=validateSave(safeParseFileJSON(fev.target.result,SAVE_SIZE_LIMIT_BYTES)); }
    catch(e){ S.importStatus=/large/.test(e.message)?"too_large":"error"; render(); ev.target.value=""; return; }
    try{
      const id=newId();
      d.savedAt=Date.now();
      const payloadStr=JSON.stringify(d);
      if(byteLength(payloadStr)>SAVE_SIZE_LIMIT_BYTES){ S.importStatus="too_large"; render(); ev.target.value=""; return; }
      const res=await window.storage.set(saveKey(id),payloadStr);
      if(!res) throw new Error("write failed");
      const ids=await getSaveIndex();
      ids.push(id);
      await setSaveIndex(ids);
      await refreshSaveList();
      S.importStatus="ok";
    }catch(e){ S.importStatus="error"; }
    render();
    ev.target.value="";
  };
  reader.readAsText(file);
}

/* ---- API target settings modal ----
   Reachable from every screen via the gear icon in the header. Also opened
   automatically by callClaude() (and by the setup screen's gate) whenever
   a request or a new game needs a target that isn't configured yet \u2014
   functions as the "initial config screen" for a fresh install, without
   permanently blocking the rest of the app. Two modes: a "list" of saved
   targets to pick/edit/delete, and a "form" for adding or editing one. */
function renderSettingsModalHtml(){
  if(!S.settingsOpen) return "";
  const forcedEmpty = S.apiTargets.length===0;
  const mode = forcedEmpty ? "form" : S.settingsMode;

  let body;
  if(mode==="form"){
    const editing = S.editingTargetId ? S.apiTargets.find(t=>t.id===S.editingTargetId) : null;
    const host = safeHostname(S.targetForm.url);
    const isLocal = isLocalOrIpHost(host);
    const providerDef = PROVIDERS[S.targetForm.provider] || null;
    const providerChosen = !!providerDef;
    const modelPlaceholder = providerDef && providerDef.defaultModel ? `e.g. ${providerDef.defaultModel}` : (providerDef ? "required for this service" : "choose a service type first");
    const providerOptions = `<option value="" ${S.targetForm.provider===""?"selected":""} disabled>\u2014 Select service type \u2014</option>`
      + PROVIDER_LIST.map(p=>`<option value="${attr(p.id)}" ${S.targetForm.provider===p.id?"selected":""}>${escapeHtml(p.label)}</option>`).join("");
    body = `
      <div style="color:var(--textD);font-size:12px;line-height:1.5">
        ${forcedEmpty
          ? `No API target is configured yet, so there's nowhere to send story requests. Add one below \u2014 Anthropic, OpenAI, Gemini, and several OpenAI-compatible services (Groq, Mistral, DeepSeek, and more) are all detected automatically from the URL; local servers like Ollama need the service type picked manually.`
          : `Calls are made directly from your browser to whatever URL you enter here. The service type is auto-detected from the URL where possible \u2014 override it any time. Leave the key blank if the target doesn't need one.`}
      </div>
      <label style="font-size:10px;color:var(--textD);letter-spacing:1px;text-transform:uppercase">Name</label>
      <input id="targetNameInput" type="text" autocomplete="off" placeholder="e.g. Anthropic (personal key)" value="${attr(S.targetForm.name)}" style="width:100%;box-sizing:border-box;font-size:13px"/>
      <label style="font-size:10px;color:var(--textD);letter-spacing:1px;text-transform:uppercase">Service URL</label>
      <input id="targetUrlInput" type="text" autocomplete="off" spellcheck="false" placeholder="${attr(API_CONFIG.defaultUrl)}" value="${attr(S.targetForm.url)}" style="width:100%;box-sizing:border-box;font-size:13px"/>
      <div style="font-size:10px;color:var(--textD);margin-top:-8px">A bare origin (e.g. <code>https://api.openai.com</code>) gets the right path appended automatically; paste a full URL (with path) to use it exactly as given.</div>
      ${isLocal ? `<div style="font-size:10px;color:var(--bookClr);margin-top:-4px">This looks like a local/IP address \u2014 it can't be auto-detected, so pick the matching service type below (e.g. Ollama or LM Studio are OpenAI-compatible).</div>` : ""}
      <label style="font-size:10px;color:var(--textD);letter-spacing:1px;text-transform:uppercase">Service Type</label>
      <select id="targetProviderInput" style="width:100%;box-sizing:border-box;font-size:13px;padding:8px 10px;background:var(--iBg);border:1px solid var(--bdrM);border-radius:4px;color:var(--text)">${providerOptions}</select>
      <label style="font-size:10px;color:var(--textD);letter-spacing:1px;text-transform:uppercase">Model <span style="text-transform:none;opacity:0.8">(optional override)</span></label>
      <input id="targetModelInput" type="text" autocomplete="off" spellcheck="false" placeholder="${attr(modelPlaceholder)}" value="${attr(S.targetForm.model)}" style="width:100%;box-sizing:border-box;font-size:13px"/>
      <label style="font-size:10px;color:var(--textD);letter-spacing:1px;text-transform:uppercase">API Key <span style="text-transform:none;opacity:0.8">(optional)</span></label>
      <div style="display:flex;gap:6px">
        <input id="targetKeyInput" type="${S.apiKeyVisible?"text":"password"}" autocomplete="off" spellcheck="false" placeholder="leave blank if not required" value="${attr(S.targetForm.key)}" style="flex:1;box-sizing:border-box;font-size:13px"/>
        <button data-act="toggleApiKeyVisibility" style="background:none;border:1px solid var(--bdrM);border-radius:4px;color:var(--textM);font-size:11px;cursor:pointer;padding:4px 9px;outline:none;flex-shrink:0">${S.apiKeyVisible?"Hide":"Show"}</button>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        ${(!forcedEmpty) ? `<button data-act="cancelTargetForm" style="padding:7px 16px;background:transparent;border:1px solid var(--bdrC);border-radius:4px;color:var(--textM);cursor:pointer;font-size:13px;outline:none">Cancel</button>` : ""}
        <button id="saveTargetFormBtn" data-act="saveTargetForm" data-editing-id="${attr(S.editingTargetId||"")}" ${providerChosen?"":"disabled"} style="padding:7px 20px;background:transparent;border:1px solid ${providerChosen?"var(--acc)":"var(--bdrM)"};border-radius:4px;color:${providerChosen?"var(--accHi)":"var(--accLo)"};cursor:${providerChosen?"pointer":"not-allowed"};font-size:13px;outline:none">${editing?"Save Changes":"Add Target"}</button>
      </div>`;
  } else {
    const rows = S.apiTargets.map(t=>{
      const active = t.id===S.activeTargetId;
      return `<div style="border:1px solid ${active?"var(--acc)":"var(--cardBdr)"};border-radius:6px;padding:10px 12px;background:${active?"var(--pABg)":"var(--bgCard)"};display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div style="min-width:0;cursor:pointer" data-act="selectTarget" data-id="${attr(t.id)}">
          <div style="color:${active?"var(--accHi)":"var(--text)"};font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${active?"\u2726 ":""}${escapeHtml(t.name)}</div>
          <div style="color:var(--textD);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escapeHtml(targetSummary(t))}</div>
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button data-act="editTarget" data-id="${attr(t.id)}" style="background:none;border:1px solid var(--bdrM);border-radius:4px;color:var(--textM);font-size:11px;cursor:pointer;padding:4px 9px;outline:none">Edit</button>
          <button data-act="deleteTarget" data-id="${attr(t.id)}" style="background:none;border:none;color:var(--delClr);font-size:15px;cursor:pointer;padding:4px 7px;outline:none;opacity:0.75">\u2715</button>
        </div>
      </div>`;
    }).join("");
    body = `
      <div style="color:var(--textD);font-size:12px;line-height:1.5">
        Calls are made directly from your browser to whichever target is selected. Add as many as you like \u2014 Anthropic, OpenAI, Gemini, other providers, or a self-hosted/local server \u2014 and switch between them any time.
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto">${rows}</div>
      <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px">
        <button data-act="closeSettings" style="padding:7px 16px;background:transparent;border:1px solid var(--bdrC);border-radius:4px;color:var(--textM);cursor:pointer;font-size:13px;outline:none">Close</button>
        <button data-act="newTargetForm" style="padding:7px 20px;background:transparent;border:1px solid var(--acc);border-radius:4px;color:var(--accHi);cursor:pointer;font-size:13px;outline:none">+ Add Target</button>
      </div>`;
  }

  return `<div class="modal-overlay">
    <div class="modal-box" style="max-width:460px">
      <div style="color:var(--acc);font-size:11px;letter-spacing:2px;text-transform:uppercase">\u2699 API Targets</div>
      ${body}
    </div>
  </div>`;
}
function updateSettingsModal(){
  const el=document.getElementById("settingsModalContainer");
  if(el) el.innerHTML = renderSettingsModalHtml();
  refreshSettingsHub();
}
function blankTargetForm(){
  const url = API_CONFIG.defaultUrl;
  return {name:"", url, provider: detectProviderId(url) || "", model:"", key:"", _lastDetectedUrl:url};
}
function openSettingsModal(){
  S.settingsOpen = true;
  S.settingsMode = S.apiTargets.length ? "list" : "form";
  if(S.settingsMode==="form"){ S.editingTargetId=null; S.targetForm=blankTargetForm(); }
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetNameInput")||document.getElementById("targetUrlInput"); if(el) el.focus(); },30);
}
function openNewTargetForm(){
  S.settingsMode="form"; S.editingTargetId=null; S.targetForm=blankTargetForm();
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetNameInput"); if(el) el.focus(); },30);
}
function openEditTargetForm(id){
  const t=S.apiTargets.find(x=>x.id===id);
  if(!t) return;
  S.settingsMode="form"; S.editingTargetId=id;
  S.targetForm={name:t.name, url:t.url, provider:t.provider||"", model:t.model||"", key:t.key, _lastDetectedUrl:t.url};
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetNameInput"); if(el) el.focus(); },30);
}
/* Re-runs hostname-based provider detection when the Service URL field is
   blurred. Only overwrites the Service Type when the URL actually changed
   since the last check (so re-focusing/blurring the same value repeatedly
   can't stomp on a choice the user already made), and never invents a
   confident guess for a localhost/IP address \u2014 that always falls back to
   requiring an explicit manual pick, per how ambiguous local endpoints are. */
function handleTargetUrlBlur(){
  const urlEl=document.getElementById("targetUrlInput");
  if(!urlEl) return;
  const url=urlEl.value;
  if(url===S.targetForm._lastDetectedUrl) return;
  S.targetForm._lastDetectedUrl = url;
  const detected = detectProviderId(url);
  if(detected){ S.targetForm.provider = detected; }
  else if(isLocalOrIpHost(safeHostname(url))){ S.targetForm.provider = ""; }
  updateSettingsModal();
  setTimeout(()=>{ const el=document.getElementById("targetUrlInput"); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } },0);
}

/* ---- Screen mount tracking ----
   `render()` is the single entry point every handler calls after a state
   change. Setup/Saves are cheap enough to always fully rebuild. The game
   screen is the one with hot, focus-sensitive state (the action textarea,
   scroll position, in-flight narration) so it is mounted once and then only
   ever patched via the targeted update*()/append*() functions below \u2014
   render() falls back to a full-but-safe refreshGameScreen() for any call
   site that hasn't been given a more specific update. */
let gameMounted = false;

function render(){
  applyThemeVars();
  const app=document.getElementById("app");
  if(S.screen==="saves"){ gameMounted=false; app.innerHTML=renderSavesScreen(); }
  else if(S.screen==="setup"){ gameMounted=false; app.innerHTML=renderSetupScreen(); }
  else {
    if(!gameMounted){ mountGameScreen(); gameMounted=true; }
    else { refreshGameScreen(); }
  }
}

/* ── Game screen: save/status bar ── */
function renderSaveBarInner(){
  const b=busy();
  const ssText = S.saveTracking.result==="saved"?"\u2726 Saved":S.saveTracking.result==="loaded"?"\u2726 Loaded":S.saveTracking.result==="autosaved"?"\u2726 Autosaved":S.saveTracking.result==="error"?(S.saveTracking.message?`\u2717 ${S.saveTracking.message}`:"\u2717 Error"):null;
  const ssColor = S.saveTracking.result==="error"?OUTCOME_META.failure.color:OUTCOME_META.success.color;

  let statusRight;
  if(S.status==="saving") statusRight="Saving\u2026";
  else if(S.status==="loading_save") statusRight="Loading\u2026";
  else if(S.status==="booking") statusRight="Writing the chapter\u2026";
  else if(S.saveTracking.result) statusRight=ssText;
  else if(S.saveTracking.activeSaveId){
    const turns=S.msgs.filter(m=>m.type==="narrator").length-S.saveTracking.turnsAtSave;
    statusRight = turns>0?`Tracking an existing save, ${turns} turn${turns===1?"":"s"} old`:"Tracking an existing save";
  } else statusRight="Unsaved tale";
  const statusColor = (S.status==="saving"||S.status==="loading_save")?"var(--think)":(S.saveTracking.result?ssColor:"var(--textD)");

  return `
    ${smBtnHtml("Save","saveCurrent",{asnew:"0"},S.msgs.length===0||b)}
    ${smBtnHtml("Save As New","saveCurrent",{asnew:"1"},S.msgs.length===0||b)}
    ${smBtnHtml(S.statusOpen?"Hide Meters":"Meters","toggleStatus",{},false)}
    ${smBtnHtml(S.panelOpen?"Hide Quest":"Quest & Items","togglePanel",{},false)}
    ${smBtnHtml(S.journalOpen?"Hide Journal":"Journal","toggleJournal",{},false)}
    ${smBtnHtml(S.booksOpen?"Hide Lore":`Lore${S.dynLore.entries.length?` (${S.dynLore.entries.length})`:""}`,"toggleBooks",{},false)}
    <span style="font-size:11px;color:${statusColor};letter-spacing:1px;flex:1;text-align:right">${escapeHtml(statusRight)}</span>
  `;
}
function updateSaveBar(){
  const el=document.getElementById("sbarContainer");
  if(el) el.innerHTML = renderSaveBarInner();
}

/* ── Game screen: narrative log (append-only, focus/scroll safe) ── */
function renderOneMessageHtml(msg,i){
  const b=busy();
  if(msg.type==="meta") return `<div data-msg-idx="${i}" style="text-align:center;color:var(--textD);font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:0.8">\u25c8 &nbsp; ${escapeHtml(msg.text)} &nbsp; \u25c8</div>`;
  if(msg.type==="bookmark") return `<div data-msg-idx="${i}" style="text-align:center;margin:4px 0">
    <div style="border-top:1px solid var(--bookClr)55;margin-bottom:10px"></div>
    <div style="color:var(--bookClr);font-size:11px;letter-spacing:2px;text-transform:uppercase">\u25c8 Book Closed: ${escapeHtml(msg.text)} \u25c8</div>
    <div style="color:var(--textD);font-size:10px;letter-spacing:1px;margin-top:4px;font-style:italic">A new chapter begins</div>
    <div style="border-top:1px solid var(--bookClr)55;margin-top:10px"></div>
  </div>`;
  if(msg.type==="error"){
    const submitHint = (msg.retry && msg.retry.kind==="submit") ? `<div style="color:var(--textD);font-size:10px;font-style:italic">Still failing after a few tries? The plain "Continue \u27f3" button below uses a simpler request and may succeed even when Regenerate doesn't.</div>` : "";
    return `<div data-msg-idx="${i}" style="border:1px solid ${OUTCOME_META.failure.color}55;border-radius:5px;padding:10px 14px;background:${OUTCOME_META.failure.color}0c;display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <span>
          <span style="color:${OUTCOME_META.failure.color};font-size:14px;font-weight:700">\u2717 The story stalled.</span>
          <span style="color:var(--textD);font-size:11px;font-style:italic"> ${escapeHtml(msg.text)}</span>
        </span>
        <button data-act="regenerate" data-idx="${i}" ${b?"disabled":""} style="padding:5px 12px;background:transparent;border:1px solid ${OUTCOME_META.failure.color};border-radius:4px;color:${OUTCOME_META.failure.color};cursor:${b?"not-allowed":"pointer"};font-size:11px;outline:none;opacity:${b?0.5:1};white-space:nowrap">Regenerate \u27f3</button>
      </div>
      ${submitHint}
    </div>`;
  }
  let out = "";
  if(msg.outcomeMeta) out += `<div style="font-size:11px;color:${msg.outcomeMeta.color};letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;opacity:0.9">${msg.outcomeMeta.symbol} &nbsp; ${escapeHtml(msg.outcomeMeta.label)} \u2014 ${escapeHtml(msg.outcomeMeta.desc)}</div>`;
  if(msg.type==="player"){
    out += `<div style="color:var(--textP);font-style:italic;font-size:14px;line-height:1.6;padding-left:12px;border-left:2px solid var(--bdrM)"><span style="color:var(--textD);margin-right:8px">\u203a</span>${escapeHtml(msg.text)}</div>`;
  } else {
    out += `<div style="color:var(--text);font-size:15px;line-height:1.75">${renderTextHtml(msg.text)}</div>`;
  }
  if(msg.questTag){
    const qcolor = msg.questTag.action==="fail" ? OUTCOME_META.failure.color : "var(--accHi)";
    const qtext = msg.questTag.action==="set" ? `\u25c8 New Quest: ${escapeHtml(msg.questTag.title)}`
      : msg.questTag.action==="update" ? `\u25c6 Quest Updated: ${escapeHtml(msg.questTag.title)}`
      : msg.questTag.action==="fail" ? `\u2717 Quest Failed: ${escapeHtml(msg.questTag.title)}`
      : `\u2726 Quest Complete: ${escapeHtml(msg.questTag.title||"")}`;
    out += `<div style="font-size:11px;color:${qcolor};letter-spacing:1px;margin-top:8px;opacity:0.9">${qtext}</div>`;
  }
  if(msg.inventoryFullTag && (msg.inventoryFullTag.key.length>0||msg.inventoryFullTag.general.length>0)){
    const full=[...msg.inventoryFullTag.key.map(n=>`${n} (key items full)`),...msg.inventoryFullTag.general.map(n=>`${n} (items full)`)].join(", ");
    out += `<div style="font-size:11px;color:${OUTCOME_META.failure.color};letter-spacing:0.5px;margin-top:8px;opacity:0.9">\u26a0 Inventory full \u2014 couldn't carry: ${escapeHtml(full)}</div>`;
  }
  if(S.debug && msg.debug) out += debugStatsHtml(msg.debug);
  return `<div data-msg-idx="${i}">${out}</div>`;
}
function renderMsgListHtml(){
  return S.msgs.map((m,i)=>renderOneMessageHtml(m,i)).join("");
}
/* Targeted DOM update: append a single new log entry instead of rebuilding
   the whole narrative log \u2014 this is what keeps scroll position, text
   selection, and (most importantly) input focus intact while a turn
   resolves, per the "Preserve Text & Focus" refactor goal. */
function appendMessage(msg){
  const list=document.getElementById("msgList");
  if(!list) return;
  const idx=S.msgs.length-1;
  list.insertAdjacentHTML("beforeend", renderOneMessageHtml(msg, idx));
  scrollBottom();
}
/* Patches the last log entry in place (used after quest/inventory/condition
   tags get attached to the narration that was just appended). */
function refreshLastMessageNode(){
  const idx=S.msgs.length-1;
  if(idx<0) return;
  const list=document.getElementById("msgList");
  if(!list) return;
  const html=renderOneMessageHtml(S.msgs[idx], idx);
  const existing=list.querySelector(`[data-msg-idx="${idx}"]`);
  if(existing) existing.outerHTML=html;
  else list.insertAdjacentHTML("beforeend", html);
}
function removeMessageNode(idx){
  const list=document.getElementById("msgList");
  if(!list) return;
  const existing=list.querySelector(`[data-msg-idx="${idx}"]`);
  if(existing) existing.remove();
}

/* ── Game screen: transient footer (thinking indicator / continue-story
   nudge / book suggestion / fate challenge) \u2014 lives below the log and is
   cheap enough to just rebuild wholesale on every relevant state change. ── */
function renderDynamicFooterInner(){
  const b=busy();
  let thinking="";
  if(S.status==="narrating") thinking=`<div style="color:var(--think);font-style:italic;font-size:13px">The fates deliberate\u2026</div>`;
  if(S.status==="booking") thinking=`<div style="color:var(--bookClr);font-style:italic;font-size:13px">Writing the chapter that just closed\u2026</div>`;

  let continueLastBtn="";
  if(!b && !S.challengeData && S.msgs.length>0 && S.msgs[S.msgs.length-1].type==="player"){
    continueLastBtn = `<div style="text-align:center">
      <button data-act="continueLastAction" style="padding:8px 20px;background:transparent;border:1px solid var(--acc);border-radius:4px;color:var(--accHi);cursor:pointer;font-size:13px;letter-spacing:0.5px;outline:none">Continue the story \u27f3</button>
      <div style="color:var(--textD);font-size:10px;font-style:italic;margin-top:6px">If this keeps failing, the plain "Continue \u27f3" button below is a simpler alternative worth trying.</div>
    </div>`;
  }

  let bookSuggestionHtml="";
  if(S.bookSuggestion && !b){
    bookSuggestionHtml = `<div style="text-align:center;border:1px solid var(--bookClr)55;border-radius:5px;padding:10px 14px;background:var(--bookClr)0c">
      <div style="color:var(--bookClr);font-size:12px;margin-bottom:8px">\u25c8 This feels like a natural place to close a chapter.</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button data-act="startBook" style="padding:6px 14px;background:transparent;border:1px solid var(--bookClr);border-radius:4px;color:var(--bookClr);cursor:pointer;font-size:12px;outline:none">Start a Book</button>
        <button data-act="dismissBookSuggestion" style="padding:6px 14px;background:transparent;border:1px solid var(--bdrM);border-radius:4px;color:var(--textM);cursor:pointer;font-size:12px;outline:none">Not now</button>
      </div>
    </div>`;
  }

  let challengeHtml="";
  if(S.challengeData){
    const cd=S.challengeData;
    let modLine="";
    if(cd.modifier && cd.modifier!=="neutral" && cd.reason){
      modLine = `<div style="text-align:center;font-size:11px;margin-bottom:10px;color:${cd.modifier==="favorable"?OUTCOME_META.success.color:OUTCOME_META.failure.color};letter-spacing:0.5px">${cd.modifier==="favorable"?"\u25c6 Favorable":"\u25c7 Unfavorable"} \u2014 ${escapeHtml(cd.reason)}</div>`;
    }
    const btns = cd.buttons.map((btnType,idx)=>{
      const isSelected = cd.revealed && cd.revealed.idx===idx;
      const isRevealed = !!cd.revealed;
      const meta=BTN_META[btnType];
      const mc = S.dark?meta.c_dark:meta.c_light;
      const dimmed = isRevealed && !isSelected;
      return `<button data-act="choiceButton" data-idx="${idx}" ${isRevealed?"disabled":""} style="flex:1;padding:16px 6px;background:${isSelected?mc+"18":"var(--fbBg)"};border:1px solid ${isSelected?mc:isRevealed?"var(--bdr)":"var(--fbBdr)"};border-radius:5px;color:${dimmed?"var(--fbDim)":isSelected?mc:"var(--fbClr)"};cursor:${isRevealed?"default":"pointer"};font-size:14px;transition:all .35s;letter-spacing:1px;outline:none">${isRevealed?meta.label:"\u269c"}</button>`;
    }).join("");
    let revealedLine="";
    if(cd.revealed){
      const om=OUTCOME_META[cd.revealed.outcome];
      revealedLine = `<div style="margin-top:8px;font-size:12px;color:${om.color};letter-spacing:1px">${om.symbol} &nbsp; ${escapeHtml(BTN_META[cd.revealed.btnType].label)}${cd.revealed.btnType==="fate"?` \u2192 ${escapeHtml(om.label)}`:""}</div>`;
    }
    let deliberating="";
    if(S.status==="narrating" && cd.revealed) deliberating=`<div style="color:var(--think);font-style:italic;font-size:13px;margin-top:10px">The world reshapes\u2026</div>`;
    challengeHtml = `<div>
      <div style="color:var(--textM);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">\u25c8 &nbsp; A moment of fate \u2014 choose your path &nbsp; \u25c8</div>
      ${modLine}
      <div style="display:flex;gap:10px">${btns}</div>
      ${revealedLine}
      ${deliberating}
    </div>`;
  }

  return `${thinking}${continueLastBtn}${bookSuggestionHtml}${challengeHtml}`;
}

  </div>`;

/* Targeted DOM update: toggle disabled/placeholder state on the existing
   input controls. Deliberately never touches the textarea's `value` \u2014
   that's the crux of the "Preserve Text & Focus" fix, since replacing the
   node (or its value) mid-turn is what used to blow away in-progress
   typing, text selection, and keyboard focus. */
function updateInputState(){
  const b=busy();
  const ta=document.getElementById("mainInput");
  if(ta){
    ta.disabled=b;
    ta.placeholder = b?"Awaiting fate\u2026":"What do you do? (Shift+Enter for a new line)";
  }
  const actBtn=document.getElementById("actBtn");
  if(actBtn){
    const disabled = b || !S.input.trim();
    actBtn.disabled=disabled;
    actBtn.style.borderColor = disabled?"var(--bdrM)":"var(--acc)";
    actBtn.style.color = disabled?"var(--accLo)":"var(--acc)";
    actBtn.style.cursor = disabled?"not-allowed":"pointer";
  }
  const suggestBtn=document.getElementById("suggestBtn");
  if(suggestBtn){
    const disabled=b||S.suggBusy;
    suggestBtn.disabled=disabled;
    suggestBtn.style.borderColor=disabled?"var(--bdrM)":"var(--bdrC)";
    suggestBtn.style.color=disabled?"var(--accLo)":"var(--textM)";
    suggestBtn.style.cursor=disabled?"not-allowed":"pointer";
  }
  const continueBtn=document.getElementById("continueBtn");
  if(continueBtn){
    continueBtn.disabled=b;
    continueBtn.style.borderColor=b?"var(--bdrM)":"var(--bdrC)";
    continueBtn.style.color=b?"var(--accLo)":"var(--textM)";
    continueBtn.style.cursor=b?"not-allowed":"pointer";
  }
}

/* Safety-net refresh used for any render() call while already mounted on
   the game screen: refreshes every region EXCEPT the message log and the
   input textarea's live value, so it can never wipe an in-progress action
   or scroll position no matter which handler triggered it. */
function refreshGameScreen(){
  updateHeaderButtons();
  updateSaveBar();
  updateStatusUI();

  updateJournalUI();

/* ============================== EVENT DELEGATION ============================== */

function resizeTextarea(el){
  el.style.height="auto";
  el.style.height=Math.min(el.scrollHeight,120)+"px";
}

document.addEventListener("DOMContentLoaded", function(){
  const app=document.getElementById("app");

  app.addEventListener("click", function(e){
    const el = e.target.closest("[data-act]");
    if(!el) return;
    const act = el.dataset.act;
    if(!act) return;
    switch(act){
      case "toggleTheme": {
        S.dark = !S.dark;
        window.storage.set("theme_pref", S.dark?"dark":"light").catch(()=>{});
        if(S.screen==="game" && gameMounted){
          // Targeted: colors are CSS variables and update automatically;
          // only the couple of theme-baked bits (button label, challenge
          // button colors) need an explicit refresh.
          applyThemeVars();
          const btn=document.getElementById("themeToggleBtn");
          if(btn) btn.textContent = S.dark?"\u2600 Light":"\u263e Dark";
          updateDynamicFooter();
        } else {
          render();
        }
        persistSession();
        break;
      }
      case "openSettings": openSettingsModal(); break;
      case "openSettingsHub": openSettingsHub(); break;
      case "openLorebook": openLorebook(); break;
      case "openRulebook": openRulebook(); break;
      case "toggleRbMode": rbToggleHudMode(); break;
      case "closeSettings": {
        if(S.apiTargets.length===0) break; // can't close out of the forced "add one" state
        setState(s=>{ s.settingsOpen=false; }, updateSettingsModal);
        break;
      }
      case "toggleApiKeyVisibility": {
        S.apiKeyVisible = !S.apiKeyVisible;
        const input=document.getElementById("targetKeyInput");
        if(input) input.type = S.apiKeyVisible ? "text" : "password";
        const btn=el;
        if(btn) btn.textContent = S.apiKeyVisible ? "Hide" : "Show";
        break;
      }
      case "newTargetForm": openNewTargetForm(); break;
      case "editTarget": openEditTargetForm(el.dataset.id); break;
      case "cancelTargetForm": {
        setState(s=>{ s.settingsMode="list"; }, updateSettingsModal);
        break;
      }
      case "saveTargetForm": {
        const nameEl=document.getElementById("targetNameInput");
        const urlEl=document.getElementById("targetUrlInput");
        const providerEl=document.getElementById("targetProviderInput");
        const modelEl=document.getElementById("targetModelInput");
        const keyEl=document.getElementById("targetKeyInput");
        const name=nameEl?nameEl.value:"";
        const url=(urlEl?urlEl.value:"").trim() || API_CONFIG.defaultUrl;
        const provider=providerEl?providerEl.value:"";
        const model=modelEl?modelEl.value:"";
        const key=keyEl?keyEl.value:"";
        if(!provider) break; // Service Type is required (button is disabled for this too, but don't trust that alone)
        const editingId = el.dataset.editingId || null;
        setState(s=>{
          const id = addOrUpdateTarget(editingId, name, url, provider, model, key);
          if(!s.activeTargetId) s.activeTargetId = id; // first target ever added becomes active automatically
          s.settingsMode="list";
          s.editingTargetId=null;
        }, ()=>{
          setStoredApiTargets(S.apiTargets);
          setStoredActiveTargetId(S.activeTargetId||"");
          render(); // target list/active id changed \u2014 refresh setup-screen pills + Begin gating too, not just the modal
        });
        break;
      }
      case "selectTarget": {
        setState(s=>{ selectTarget(el.dataset.id); }, render);
        break;
      }
      case "deleteTarget": {
        const deletedId = el.dataset.id;
        setState(s=>{ deleteTarget(deletedId); }, ()=>{
          if(S.settingsMode==="form" && S.editingTargetId===deletedId){ S.settingsMode="list"; S.editingTargetId=null; }
          render();
        });
        break;
      }
      case "goScreen": {
        const target = el.dataset.screen;
        if(target==="saves"||target==="setup"){
          if(busy()) return;
        }
        S.screen = target;
        render();
        if(target==="game") scrollBottom();
        break;
      }
      case "setMood": S.mood = el.dataset.key; render(); break;
      case "setSetting": S.setting = el.dataset.key; render(); break;
      case "setEngine": S.engine = el.dataset.key; render(); break;
      case "setGender": S.player.gender = el.dataset.key; render(); break;
      case "beginTale": if(S.mood && S.setting && activeTarget()) startGame(); break;
      case "randomize": handleRandom(); break;
      case "selectTargetSetup": setState(s=>{ selectTarget(el.dataset.id); }, render); break;
      case "toggleStatus": setState(s=>{ s.statusOpen=!s.statusOpen; }, ()=>{ updateStatusUI(); updateSaveBar(); }); break;
      case "togglePanel": setState(s=>{ s.panelOpen=!s.panelOpen; }, ()=>{ updateInventoryUI(); updateSaveBar(); }); break;
      case "toggleJournal": setState(s=>{ s.journalOpen=!s.journalOpen; }, ()=>{ updateJournalUI(); updateSaveBar(); }); break;
      case "toggleBooks": setState(s=>{ s.booksOpen=!s.booksOpen; s.activeBookTab=Math.max(0,s.books.length-1); }, ()=>{ updateBooksUI(); updateSaveBar(); }); break;
      case "saveCurrent": handleSaveCurrent(el.dataset.asnew==="1"); break;
      case "loadSave": if(!busy() && S.renamingId!==el.dataset.id) handleLoadSave(el.dataset.id); break;
      case "deleteSave": handleDeleteSave(el.dataset.id, e); break;
      case "renameStart": e.stopPropagation(); S.renamingId=el.dataset.id; S.renameText=el.dataset.name; render(); break;
      case "renameSave": {
        e.stopPropagation();
        const inputEl=document.getElementById("renameInput");
        handleRenameSave(el.dataset.id, inputEl?inputEl.value:S.renameText);
        break;
      }
      case "renameCancel": e.stopPropagation(); S.renamingId=null; render(); break;
      case "exportSave": handleExportSave(el.dataset.id, e); break;
      case "toggleAutosave": handleToggleAutosave(); break;
      case "dropItem": handleDropItem(el.dataset.kind, el.dataset.name); break;
      case "toggleMergeMode": setState(s=>{ s.mergeMode=!s.mergeMode; s.mergeSelection=[]; }, updateJournalUI); break;
      case "toggleMergeSelect": toggleMergeSelect(parseInt(el.dataset.idx,10)); break;
      case "confirmMerge": handleMergeCharacters(); break;
      case "startBook": handleStartBook(); break;
      case "switchModalTab": switchModalTab(el.dataset.tab); break;
      case "setBookCharChoice": setBookCharChoice(el.dataset.choice); break;
      case "confirmBook": handleConfirmBook(); break;
      case "cancelBookModal": handleCancelBookModal(); break;
      case "regenerate": handleRegenerate(parseInt(el.dataset.idx,10), S.msgs[parseInt(el.dataset.idx,10)].retry); break;
      case "continueLastAction": {
        const lastMsg = S.msgs[S.msgs.length-1];
        runStep(()=>narratorTurnCore(lastMsg.text),"submit",{action:lastMsg.text});
        break;
      }
      case "dismissBookSuggestion": setState(s=>{ s.bookSuggestion=false; }, updateDynamicFooter); break;
      case "choiceButton": handleChoice(parseInt(el.dataset.idx,10)); break;
      case "suggestClick": handleSuggestClick(); break;
      case "reroll": handleReroll(); break;
      case "cancelSuggestions": handleCancelSuggestions(); break;
      case "pickSuggestion": handlePickSuggestion(S.suggestions[parseInt(el.dataset.idx,10)]); break;
      case "submitAction": handleSubmit(); break;
      case "continueAction": handleContinue(); break;
      case "delDynEntry": setState(s=>{ s.dynLore.entries.splice(parseInt(el.dataset.idx,10),1); }, updateBooksUI); break;
      case "setActiveBookTab": setState(s=>{ s.activeBookTab=parseInt(el.dataset.idx,10); }, updateBooksUI); break;
    }
  });

  app.addEventListener("input", function(e){
    if(e.target.id==="mainInput"){
      S.input = e.target.value;
      resizeTextarea(e.target);
      updateInputState(); // cheap: only toggles the Act button's disabled state
    } else if(e.target.id==="playerDescInput"){
      S.player.desc = e.target.value;
    } else if(e.target.id==="renameInput"){
      S.renameText = e.target.value;
    } else if(e.target.id==="bookCharTextarea"){
      setBookCharText(e.target.value);
    } else if(e.target.id==="targetNameInput"){
      S.targetForm.name = e.target.value;
    } else if(e.target.id==="targetUrlInput"){
      S.targetForm.url = e.target.value;
    } else if(e.target.id==="targetKeyInput"){
      S.targetForm.key = e.target.value;
    } else if(e.target.id==="targetModelInput"){
      S.targetForm.model = e.target.value;
    }
  });

  app.addEventListener("keydown", function(e){
    if(e.target.id==="mainInput"){
      if(e.key==="Enter" && !e.shiftKey){
        e.preventDefault();
        handleSubmit();
      }
    } else if(e.target.id==="renameInput"){
      if(e.key==="Enter"){ handleRenameSave(S.renamingId, e.target.value); }
      if(e.key==="Escape"){ S.renamingId=null; render(); }
    }
  });

  app.addEventListener("change", function(e){
    if(e.target.id==="importFileInput"){
      handleImportFile(e);
    } else if(e.target.id==="targetProviderInput"){
      // Targeted: just update state + the model placeholder + the Save
      // button's enabled state, without rebuilding the whole form (which
      // would cost focus on whatever field the user is about to fill in).
      S.targetForm.provider = e.target.value;
      const providerDef = PROVIDERS[e.target.value];
      const modelEl=document.getElementById("targetModelInput");
      if(modelEl) modelEl.placeholder = providerDef && providerDef.defaultModel ? `e.g. ${providerDef.defaultModel}` : (providerDef ? "required for this service" : "choose a service type first");
      const saveBtn=document.getElementById("saveTargetFormBtn");
      if(saveBtn){
        const enabled = !!providerDef;
        saveBtn.disabled = !enabled;
        saveBtn.style.borderColor = enabled?"var(--acc)":"var(--bdrM)";
        saveBtn.style.color = enabled?"var(--accHi)":"var(--accLo)";
        saveBtn.style.cursor = enabled?"pointer":"not-allowed";
      }
    }
  });

  // "focusout" (unlike "blur") bubbles, so it works with event delegation.
  app.addEventListener("focusout", function(e){
    if(e.target.id==="targetUrlInput") handleTargetUrlBlur();
  });

  /* ── Startup ── */
  (async function init(){
    applyThemeVars();
    render();
    refreshSaveList();
    refreshAutosaveMeta().then(render);
    try{
      const r = await window.storage.get("theme_pref");
      if(r && r.value==="light") S.dark=false;
      else if(r && r.value==="dark") S.dark=true;
    }catch(e){}
    try{
      const r2 = await window.storage.get("autosave_pref");
      if(r2 && r2.value==="off") S.autosaveEnabled=false;
      else if(r2 && r2.value==="on") S.autosaveEnabled=true;
    }catch(e){}
    render();
  })();
});
</script>
