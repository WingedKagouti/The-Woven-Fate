<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Woven Fate – Lorebook &amp; Rulebook Editor</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
button,input,select,textarea{font-family:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],select,textarea{background:var(--iBg);border:1px solid var(--bdrM);border-radius:4px;padding:6px 9px;color:var(--text);font-size:13px;outline:none;width:100%}
select{padding:6px 6px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:34px;line-height:1.45}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;margin:0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--bdrM);border-radius:5px}
#app{display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--bdr);background:var(--bgH);flex-wrap:wrap}
.top h1{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--acc);margin:0 10px 0 0;font-weight:normal;white-space:nowrap}
.tab{background:none;border:1px solid transparent;border-bottom:2px solid transparent;color:var(--textM);padding:5px 12px;cursor:pointer;letter-spacing:1px;font-size:12px;text-transform:uppercase}
.tab.on{color:var(--accHi);border-bottom-color:var(--acc)}
.spacer{flex:1}
.btn{padding:5px 12px;border-radius:4px;font-size:12px;letter-spacing:.5px;background:transparent;border:1px solid var(--acc);color:var(--accHi);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--pABg)}
.btn.sec{border-color:var(--bdrM);color:var(--textM)}
.btn.sec:hover{border-color:var(--acc);color:var(--text)}
.btn.del{border-color:var(--bdrM);color:var(--delClr)}
.btn.sm{padding:2px 8px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fname{color:var(--textM);font-size:12px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fname b{color:var(--accHi);font-weight:normal}
.main{flex:1;display:flex;min-height:0}
.nav{width:250px;flex-shrink:0;border-right:1px solid var(--bdr);background:var(--bgS);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:3px}
.nav h4{margin:12px 6px 4px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--textD);font-weight:normal;display:flex;align-items:center;justify-content:space-between}
.ni{display:flex;align-items:center;gap:7px;padding:6px 8px;border:1px solid transparent;border-radius:5px;cursor:pointer;color:var(--text);font-size:13px;text-align:left;background:none;width:100%}
.ni:hover{background:var(--iBg)}
.ni.on{border-color:var(--acc);background:var(--pABg)}
.ni .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni .ty{font-size:10px;color:var(--textD);text-transform:uppercase;letter-spacing:1px}
.ni .bad{color:var(--delClr);font-size:11px;font-weight:bold}
.ni svg{color:var(--textM);flex:none}
.pane{flex:1;overflow-y:auto;padding:18px 24px 60px;min-width:0}
.pane-in{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--bgCard);border:1px solid var(--cardBdr);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.card>h3,.card>.ch{margin:0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--textM);font-weight:normal;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card .help{font-size:12px;color:var(--textM);line-height:1.5;margin:-4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px}
.grid .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--textM);min-width:0}
.f>span:first-child{letter-spacing:.5px}
.f .hint{font-size:11px;color:var(--textD);line-height:1.4}
.f.chk{flex-direction:row;align-items:center;gap:8px;padding-top:18px}
.f.chk span{color:var(--text);font-size:13px}
.row{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.sub{border:1px solid var(--bdrM);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:10px;background:rgba(127,127,127,.04)}
.sub>.sh{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--textM);letter-spacing:1px;text-transform:uppercase}
.sub>.sh .sp{flex:1}
.err{color:var(--delClr)}
.msg{font-size:12px;padding:8px 12px;border-radius:5px;border:1px solid var(--bdrM);line-height:1.5}
.msg.err{border-color:var(--delClr);background:rgba(201,64,64,.08)}
.msg.warn{border-color:#c87820;background:rgba(200,120,32,.08);color:var(--text)}
.msg.ok{border-color:#4a9e1a;background:rgba(74,158,26,.08);color:var(--text)}
.status{border-top:1px solid var(--bdr);background:var(--bgH);padding:6px 14px;font-size:12px;display:flex;gap:14px;align-items:center;cursor:pointer;flex-wrap:wrap}
.status .pill{padding:1px 9px;border-radius:10px;border:1px solid var(--bdrM)}
.status .pill.e{border-color:var(--delClr);color:var(--delClr)}.status .pill.w{border-color:#c87820;color:#e09a48}.status .pill.g{border-color:#4a9e1a;color:#6fbf3a}
#problems{max-height:36vh;overflow-y:auto;border-top:1px solid var(--bdr);background:var(--bgCard);padding:8px 14px;font-size:12px;display:none}
#problems.open{display:block}
#problems .it{padding:3px 0;cursor:pointer;line-height:1.45}
#problems .it:hover{color:var(--accHi)}
#problems .it.e::before{content:"✗ ";color:var(--delClr)}#problems .it.w::before{content:"! ";color:#e09a48}
.iconbtn{width:30px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--iBg);border:1px solid var(--bdrM);border-radius:4px;cursor:pointer;color:var(--text)}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swatch.on{border-color:var(--text)}
.pop{position:absolute;z-index:30;background:var(--bgCard);border:1px solid var(--bdrM);border-radius:8px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);max-width:420px}
.igrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.igrid button{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:5px;cursor:pointer;color:var(--text);padding:3px}
.igrid button:hover{border-color:var(--acc)}.igrid button.on{border-color:var(--acc);background:var(--pABg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 9px;border:1px solid var(--bdrM);border-radius:10px;font-size:12px;color:var(--textM);cursor:pointer;background:none}
.chip.on{border-color:var(--acc);color:var(--text);background:var(--pABg)}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--iBg);border:1px solid var(--bdrM);border-radius:6px;padding:10px 12px}
.ent{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid transparent;border-radius:5px;cursor:pointer;background:none;width:100%;text-align:left;color:var(--text);font-size:13px}
.ent:hover{background:var(--iBg)}.ent.on{border-color:var(--acc);background:var(--pABg)}
.pr{font-size:10px;padding:0 6px;border:1px solid var(--bdrM);border-radius:8px;color:var(--textM);flex:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--bgCard);border:1px solid var(--bdrM);border-radius:8px;padding:18px;max-width:860px;width:100%;max-height:90vh;display:flex;flex-direction:column;gap:12px}
.modal textarea{flex:1;min-height:50vh;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre}
.count{font-size:11px;color:var(--textD);font-variant-numeric:tabular-nums}.count.over{color:var(--delClr)}
@media (max-width:760px){.main{flex-direction:column}.nav{width:auto;max-height:34vh;border-right:0;border-bottom:1px solid var(--bdr)}.pane{padding:12px}}
/* Rulebook meters */
#rbHud{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px 0;flex-shrink:0}
#rbHud:empty{display:none}
.rb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:6px}
.rb-card{flex:1 1 150px;min-width:130px;max-width:260px;background:var(--bgCard);border:1px solid var(--cardBdr);border-radius:6px;padding:7px 10px;display:flex;flex-direction:column;gap:5px}
.rb-card.full{max-width:none;min-width:0}
.rb-head{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--textM)}
.rb-head svg{color:var(--rb);flex:none}
.rb-val{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:0;text-transform:none}
.rb-delta{font-size:11px;font-weight:700;letter-spacing:0}
.rb-bar{position:relative;height:9px;border-radius:5px;background:var(--iBg);border:1px solid var(--bdrM);overflow:hidden}
.rb-fill{position:absolute;left:0;top:0;bottom:0;background:var(--rb);border-radius:4px;transition:width .6s ease}
.rb-tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bdrM);opacity:.9}
.rb-pips{display:flex;gap:3px;flex-wrap:wrap}
.rb-pip{color:var(--textD);opacity:.55;display:inline-flex}
.rb-pip.on{color:var(--rb);opacity:1}
.rb-num{font-size:20px;font-variant-numeric:tabular-nums;color:var(--rb);line-height:1.2}
.rb-level{font-size:12px;color:var(--text)}
.rb-cap{font-size:11px;color:var(--textD);font-style:italic}
.rb-bands{display:flex;gap:4px;flex-wrap:wrap}
.rb-band{font-size:10px;padding:1px 7px;border:1px solid var(--bdrM);border-radius:9px;color:var(--textD)}
.rb-band.cur{border-color:var(--rb);color:var(--text)}
.rb-rl{font-size:11px;color:var(--textM)}
@media (prefers-reduced-motion:reduce){.rb-fill{transition:none}}

/* Rulebook HUD: minimal chips with a hover card */
#rbHud.min{gap:6px}
.rb-card[data-act]{cursor:pointer}
.rb-chip{position:relative;font:inherit;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--bgCard);border:1px solid var(--cardBdr);border-left:3px solid var(--rb);border-radius:12px;padding:3px 10px;cursor:pointer;line-height:1.4}
.rb-chip:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rb-chip .rb-pop{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;min-width:200px;max-width:min(270px,88vw);text-align:left;cursor:pointer}
.rb-chip.rb-right .rb-pop{left:auto;right:0}
.rb-chip:hover .rb-pop,.rb-chip:focus-visible .rb-pop{display:block}
.rb-chip .rb-pop .rb-card{max-width:none;box-shadow:0 6px 18px rgba(0,0,0,.45);background:linear-gradient(var(--bgCard),var(--bgCard)),var(--bg)} /* solid, so the story text doesn't show through */

.rb-of{font-size:11px;color:var(--textD)}
.rb-tags{display:flex;gap:4px;flex-wrap:wrap}
.rb-tag{font-size:11px;padding:1px 8px;border:1px solid var(--rb);border-radius:9px;color:var(--text)}
.rb-tags.dim .rb-tag{border-color:var(--bdrM);color:var(--textD);opacity:.7}
.rb-jl{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text)}
.rb-jl small{color:var(--textD);margin-left:6px}
.rb-sit{flex:1 1 100%;display:flex;gap:6px 14px;flex-wrap:wrap;margin-top:2px}
.rb-grid+.rb-sit{margin-top:10px}
.rb-sit-i{font-size:11px;font-style:italic;color:var(--textM);border-left:2px solid var(--acc);padding-left:7px}

span.rb-edit{cursor:pointer;border-bottom:1px dotted var(--textD)}
span.rb-edit:hover,span.rb-edit:focus-visible{border-bottom-color:var(--rb);outline:none}
button.rb-band,button.rb-tag{background:transparent;font-family:inherit;cursor:pointer}
button.rb-tag{font-size:11px}
.rb-tag.off{border-color:var(--bdrM);color:var(--textD);opacity:.7}
.rb-in{width:84px;font-size:12px;padding:2px 4px;background:var(--iBg);border:1px solid var(--bdrM);border-radius:4px;color:var(--text);font-family:inherit}
.rb-in.rb-hm{width:48px}
.rb-ii{display:inline-flex;vertical-align:-2px;margin-right:4px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>Woven Fate · Editor</h1>
    <button class="tab" data-tab="lore">Lorebook</button>
    <button class="tab" data-tab="rule">Rulebook</button>
    <span class="spacer"></span>
    <span class="fname" id="fname"></span>
    <button class="btn sec" data-a="new">New</button>
    <button class="btn sec" data-a="open">Open…</button>
    <button class="btn sec" data-a="json">JSON</button>
    <button class="btn" data-a="download">Download</button>
    <button class="btn sec" data-a="theme" id="themeBtn">Light</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
  <div class="main"><div class="nav" id="nav"></div><div class="pane" id="pane"></div></div>
  <div id="problems"></div>
  <div class="status" id="status"></div>
</div>
<div id="overlay"></div>
<script>

const D = {

  text:"#e2d5bc",     textM:"#7a6448",   textD:"#5a4a32",  textP:"#8a9bb0",

};
function escapeHtml(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function attr(s){ return escapeHtml(s); }
const BAD_KEYS=new Set(["__proto__","constructor","prototype"]);
const LORE_FILE_MAX_CHARS=2000000;
/* Strips C0/C1 controls (keeps \n and \t), zero-width/BOM and bidi-override characters; normalises line breaks. */
const CTRL_RE=/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F\u200B\u2060-\u2064\u202A-\u202E\u2066-\u2069\uFEFF\uFFF9-\uFFFB]/g;
function cleanText(s,max){
  s=String(s).replace(/\r\n?|[\u2028\u2029]/g,"\n").replace(CTRL_RE,"");
  return max&&s.length>max?s.slice(0,max):s;
}
function loreNorm(t){ return String(t).slice(-20000).toLowerCase().replace(/[\u2018\u2019]/g,"'"); }
const LORE_RE_CACHE=new Map();
function loreKeyRegex(key){
  let re=LORE_RE_CACHE.get(key); if(re) return re;
  if(LORE_RE_CACHE.size>5000) LORE_RE_CACHE.clear();
  re=loreKeyRegexBuild(key); LORE_RE_CACHE.set(key,re); return re;
}
function loreKeyRegexBuild(key){
  const parts=loreNorm(key).split("*").map(x=>x.replace(/[.+?^${}()|[\]\\]/g,"\\$&"));
  return new RegExp("(^|[^\\p{L}\\p{N}])"+parts.join("[\\p{L}\\p{N}_]*")+"(?![\\p{L}\\p{N}])","u");
}
function entryMatches(entry,text){ return entry.keys.some(k=>{ try{ return loreKeyRegex(k).test(text); }catch(e){ return false; } }); }
/* stand-ins for the game state that the shared engine code expects */

/* Apply one rule/keyword change to a value. `m` on a change reads another meter as a multiplier. */
function rbChange(cur,ch,vals){
  if(ch.rand){ const lo=Math.min(ch.rand.rmin,ch.rand.rmax), hi=Math.max(ch.rand.rmin,ch.rand.rmax); return cur+lo+Math.floor(Math.random()*(hi-lo+1)); }
  if("min" in ch||"max" in ch){ let v=cur; if(Number.isFinite(ch.max)) v=Math.min(v,ch.max); if(Number.isFinite(ch.min)) v=Math.max(v,ch.min); return v; }
  const k=("d" in ch)?"d":("set" in ch)?"set":("x" in ch)?"x":"div";
  let amt=ch[k]; if(ch.m!==undefined) amt*=(typeof vals[ch.m]==="number"?vals[ch.m]:0);
  if(k==="d") return cur+amt; if(k==="set") return amt; if(k==="x") return cur*amt;
  return amt===0?cur:cur/amt;
}
function rbReads(m){
  if(m.type==="journal") return m.reads==="user"?"the player's message":m.reads==="bot"?"the previous story passage":"both the player's message and the previous passage";
  return m.tracks==="user"?"the player's message":m.tracks==="character"?"the characters' behaviour in the previous passage":"both the player's message and the previous passage";
}
function rbResolveItem(m,a){
  if(typeof a!=="string") return null; const s=a.trim().toLowerCase(); if(!s) return null;
  return m.items.find(i=>i.id===s)||m.items.find(i=>i.label.toLowerCase()===s)||null;
}
function rbRecord(st,m,it,stats){
  const arr=st.jrn[m.id]||(st.jrn[m.id]=[]);
  arr.push({i:it.id,turn:st.turn,t:st.clock?st.clock.t:null}); if(arr.length>300) arr.splice(0,arr.length-300);
  stats.fired.push(`${m.label}: recorded "${it.label}"`);
}
function rbCanRecord(st,m,it){ const arr=st.jrn[m.id]||[]; if(arr.some(e=>e.i===it.id&&e.turn===st.turn)) return false; return it.repeat===true||!arr.some(e=>e.i===it.id); }

/* ---- The turn pipeline: [dice: before reply] -> keywords -> AI check -> decay & clock (if unchanged) -> [dice: after meters] -> triggers ----
   opts.cont: the player pressed Continue (no message to read; the last reply is what the referee judges). */
async function runRulebookTurn(action,opts){
  if(!S.rulebook||!S.rulebook.rb) return;
  if(S.rbPending) S.rbState=JSON.parse(S.rbPending.before); // a failed/retried turn must not apply twice
  S.rbPending={before:JSON.stringify(S.rbState)};
  const rb=S.rulebook.rb, st=S.rbState, prevDelta=st.delta||{};
  st.turn=(st.turn||0)+1; st.delta={};
  const ms=rb.meters, nums=ms.filter(rbIsNum), t0=Date.now(), cont=!!(opts&&opts.cont), text=cont?"":String(action||"");
  const start={}; for(const m of nums) start[m.id]=st.values[m.id];
  const fired=new Set(); const stats={turn:st.turn,asked:0,fired:[],failed:false,ms:0,cont};
  const lastNarr=[...S.history].reverse().find(x=>x.role==="assistant");
  const prev=lastNarr?String(lastNarr.content).slice(-1800):"";
  const clk=ms.find(m=>m.type==="clock")||null, dice=ms.filter(m=>m.type==="dice"), jms=ms.filter(m=>m.type==="journal"), cms=ms.filter(m=>m.type==="collection");

  // 0. a roll that has run out of replies is no longer current
  for(const m of dice){ const d=st.dice[m.id]; if(d&&Number.isFinite(m.lasts)&&st.turn-d.turn>=m.lasts){ delete st.dice[m.id]; delete st.values[m.id]; } }
  // dice: rolls when their conditions are met (no conditions = every message)
  const aiDice={};
  const diceTurn=(timing,rises)=>{
    for(const m of dice){
      if((m.timing||"before_reply")!==timing) continue;
      const rw=m.rollWhen||{}, res=[];
      if(rw.every_turns) res.push(st.turn%rw.every_turns===0);
      if((rw.keywords||[]).length) res.push(!!text&&rw.keywords.some(w=>{ try{ return rbKeyHit(w,text); }catch(e){ return false; } }));
      if((rw.ai_conditions||[]).length) res.push(!!aiDice[m.id]);
      if(rw.meter_conditions){ const mc=rw.meter_conditions, l=mc.conditions.map(c=>rbCond({m:c.meter_id,op:c.op,v:c.value},st)); res.push(rbGate(st,"dice:"+m.id,mc.match==="any"?l.some(Boolean):l.every(Boolean),mc.fire,mc.every_turns)); }
      if((rw.meter_rises||[]).length) res.push(rw.meter_rises.some(id=>(rises[id]||0)>0));
      const want=!res.length||(rw.match==="all"?res.every(Boolean):res.some(Boolean));
      if(!want) continue;
      if(Number.isFinite(rw.cooldown)&&st.rolled[m.id]!==undefined&&st.turn-st.rolled[m.id]<rw.cooldown) continue;
      const r=1+Math.floor(Math.random()*m.sides);
      st.dice[m.id]={roll:r,turn:st.turn}; st.values[m.id]=r; st.rolled[m.id]=st.turn; stats.fired.push(`${m.label}: rolled ${r}`);
    }
  };
  diceTurn("before_reply",prevDelta);

  // 1. keyword rules (player's last message only) and journal cues
  for(const m of nums) for(const kw of (m.keywords||[])){
    let hit=false; try{ hit=!!text&&kw.words.some(w=>rbKeyHit(w,text)); }catch(e){}
    if(!hit) continue;
    st.values[m.id]=rbFix(m,("set" in kw)?kw.set:st.values[m.id]+kw.delta);
    fired.add(m.id); stats.fired.push(`${m.label}: keyword "${kw.words[0]}"`);
  }
  const jText=m=>m.reads==="user"?text:m.reads==="bot"?prev:text+"\n"+prev;
  for(const m of jms) for(const it of m.items){
    if(!(it.cues||[]).length||!rbCanRecord(st,m,it)) continue;
    let hit=false; try{ hit=it.cues.some(w=>rbKeyHit(w,jText(m))); }catch(e){}
    if(hit) rbRecord(st,m,it,stats);
  }

  // 2. AI check: one batched call with a question per applicable rule
  const qs=[];
  for(const m of nums){
    const ai=m.ai; if(!ai||ai.on===false) continue;
    if(ai.mode==="extract"){ qs.push({k:"x",m}); continue; }
    for(const r of (ai.rules||[])){
      const key=m.id+":"+r.id, last=st.lastFired[key];
      if(typeof r.cooldown==="number" && last!==undefined){ if(r.cooldown<0) continue; if(st.turn-last<=r.cooldown) continue; }
      if(r.if && !rbCondsOk(r.if,st)) continue;
      qs.push({k:"r",m,r,key});
    }
  }
  for(const m of ms.filter(x=>x.type==="select")) qs.push({k:"s",m});
  if(clk&&clk.skips===true){ qs.push({k:"cd",m:clk}); if(clk.mode!=="date") qs.push({k:"cm",m:clk}); }
  for(const m of dice){
    const rw=m.rollWhen||{}; if(!(rw.ai_conditions||[]).length) continue;
    if(Number.isFinite(rw.cooldown)&&st.rolled[m.id]!==undefined&&st.turn-st.rolled[m.id]<rw.cooldown) continue;
    for(const c of rw.ai_conditions) qs.push({k:"da",m,c});
  }
  if(cms.length) qs.push({k:"c"});
  const jPend=jms.filter(m=>m.items.some(it=>rbCanRecord(st,m,it)));
  if(jPend.length) qs.push({k:"j"});
  stats.asked=qs.length;
  let skipDays=0, skipMin=0;
  if(qs.length){
    let ans=null;
    try{
      const qline=(q,i)=>{
        const n=`q${i+1}`;
        switch(q.k){
          case "r": return `${n} [${q.m.label}; judge ${rbReads(q.m)}] ${rbSub(q.r.when)}`;
          case "x": return `${n} [${q.m.label}; NUMBER; judge ${rbReads(q.m)}] ${rbSub(q.m.ai.extractHint||`The amount ${q.m.label} changes by`)}`;
          case "s": return `${n} [${q.m.label}; PICK ONE; judge ${rbReads(q.m)}] Which one is current right now? Currently: "${st.sel[q.m.id]}". ${rbSub(q.m.detectHint||"")} Answer with exactly one id: ${q.m.items.map(it=>`"${it.id}" (${it.label})`).join(", ")}`;
          case "cd": return `${n} [Story clock; NUMBER; judge both the player's message and the previous passage] How many WHOLE DAYS does the story skip forward (a week later = 7, the next day = 1)? 0 if time just flows on or the skip is under a day.`;
          case "cm": return `${n} [Story clock; NUMBER; judge both the player's message and the previous passage] How many MINUTES does the story skip forward beyond normal flow (an hour later = 60; "the next morning" = the minutes until that morning)? 0 if none or if you already counted whole days.`;
          case "da": return `${n} [${q.m.label}; judge both the player's message and the previous passage] ${rbSub(q.c.condition)}`;
          case "c": return `${n} [Inventories; NUMBER per item] How many of each item did the story give or take in the latest exchange (positive = gained, negative = spent or lost; held items: 1 = obtained, -1 = lost)? Answer an object {"<meter id>":{"<item id>":number}} listing ONLY items that changed.\n`+cms.map(m=>`  Meter "${m.id}" (${m.label}; judge ${rbReads(m)}). ${rbSub(m.detectHint||"")} Items: ${m.items.map(it=>`"${it.id}" (${it.label}; ${it.kind==="counted"?"counted, have "+rbCount(st,m,it.id):"held, "+(rbCount(st,m,it.id)?"have it":"don't have it")})`).join(", ")}`).join("\n");
          case "j": return `${n} [Journals] Which of these events clearly happened (each judged on the text named)? Answer an object {"<journal id>":["<event id>",...]} with an empty list when none.\n`+jPend.map(m=>`  Journal "${m.id}" (${m.label}; judge ${rbReads(m)}). ${rbSub(m.detectHint||"")} Events: ${m.items.filter(it=>rbCanRecord(st,m,it)).map(it=>`"${it.id}" (${rbSub(it.hint||it.label)})`).join("; ")}`).join("\n");
        }
        return "";
      };
      const lines=qs.map(qline);
      const prompt=`You are the referee of an interactive story. Decide what happened in the latest exchange.\n\nPrevious story passage:\n"""${prev||"(none yet)"}"""\n\nPlayer's latest message:\n"""${cont?"(none: the player asked the story to continue by itself)":text}"""\n\nQuestions. Each says which text to judge. Answer true only if it clearly happened, not if it is merely implied or hoped for. A NUMBER question asks for a signed amount; answer 0 if nothing happened. A PICK ONE question wants one id as a string.\n${lines.join("\n")}\n\nReturn ONLY raw JSON: {"a":{"q1":true|false|number|"id"|{...},...}} with one entry per question.`;
      const raw=await callClaude([{role:"user",content:prompt}],"Respond ONLY with raw JSON, no markdown.",Math.min(1100,100+qs.length*14+((cms.length||jPend.length)?250:0)));
      const p=parseJSON(raw,null); ans=p&&p.a&&typeof p.a==="object"?p.a:null;
    }catch(e){ ans=null; }
    if(!ans) stats.failed=true;
    else {
      const pre=Object.assign({},st.values);
      qs.forEach((q,i)=>{ // non-numeric answers
        const a=ans[`q${i+1}`];
        if(q.k==="s"){ const it=rbResolveItem(q.m,a); if(it&&st.sel[q.m.id]!==it.id){ st.sel[q.m.id]=it.id; stats.fired.push(`${q.m.label}: now "${it.label}"`); } }
        else if(q.k==="cd"){ const n=Math.trunc(Number(a)); if(Number.isFinite(n)&&n>0) skipDays=Math.min(n,3650); }
        else if(q.k==="cm"){ const n=Math.trunc(Number(a)); if(Number.isFinite(n)&&n>0) skipMin=Math.min(n,525600); }
        else if(q.k==="da"){ if(a===true) aiDice[q.m.id]=true; }
        else if(q.k==="c"&&a&&typeof a==="object"&&!Array.isArray(a)){
          for(const m of cms){
            const o=Object.prototype.hasOwnProperty.call(a,m.id)?a[m.id]:null; if(!o||typeof o!=="object") continue;
            for(const it of m.items){
              const x=Object.prototype.hasOwnProperty.call(o,it.id)?Math.trunc(Number(o[it.id])):0; if(!Number.isFinite(x)||x===0) continue;
              const cur=rbCount(st,m,it.id);
              const nv=it.kind==="counted"?Math.max(0,Math.min(it.max||9999,cur+Math.max(-9999,Math.min(9999,x)))):(x>0?1:0);
              if(nv!==cur){ st.coll[m.id][it.id]=nv; stats.fired.push(`${m.label}: ${it.label} ${nv>cur?"+":""}${nv-cur}`); }
            }
          }
        }
        else if(q.k==="j"&&a&&typeof a==="object"&&!Array.isArray(a)){
          for(const m of jPend){
            const l=Object.prototype.hasOwnProperty.call(a,m.id)?a[m.id]:null; if(!Array.isArray(l)) continue;
            for(const it of m.items) if(l.includes(it.id)&&rbCanRecord(st,m,it)) rbRecord(st,m,it,stats);
          }
        }
      });
      for(const m of nums){
        const mine=qs.map((q,i)=>({q,a:ans[`q${i+1}`]})).filter(x=>x.q.m===m&&(x.q.k==="r"||x.q.k==="x"));
        if(!mine.length) continue;
        const ai=m.ai, base=st.values[m.id]; let v=base, any=false;
        const ex=mine.find(x=>x.q.k==="x");
        if(ex){
          const amt=Number(ex.a);
          if(Number.isFinite(amt) && amt!==0 && !(amt<0 && m.type==="number" && !m.spend)){ v=base+amt; any=true; stats.fired.push(`${m.label}: ${amt>0?"+":""}${amt} (extracted)`); }
        } else {
          let fr=mine.filter(x=>x.a===true).map(x=>x.q);
          if(ai.negOverrides){ const dl=fr.map(q=>rbChange(base,q.r,pre)-base); if(dl.some(x=>x<0)&&dl.some(x=>x>0)) fr=fr.filter((q,i)=>dl[i]<=0); }
          for(const q of fr){ v=rbChange(v,q.r,pre); st.lastFired[q.key]=st.turn; stats.fired.push(`${m.label}: ${q.r.id}`); any=true; }
        }
        if(any){
          let net=v-base; if(Number.isFinite(ai.lo)) net=Math.max(net,ai.lo); if(Number.isFinite(ai.hi)) net=Math.min(net,ai.hi);
          st.values[m.id]=rbFix(m,base+net); fired.add(m.id);
        }
      }
    }
  }

  // 3. decay (only for meters nothing changed this turn; counts quiet turns since the last change), per-message steps, story clock
  for(const m of nums){
    if((m.type==="bar"||m.type==="pips") && Number.isFinite(m.decay) && m.decay_every>=1){
      if(fired.has(m.id)) st.idle[m.id]=0;
      else { st.idle[m.id]=(st.idle[m.id]||0)+1; if(st.idle[m.id]>=m.decay_every){ st.values[m.id]=rbFix(m,st.values[m.id]+m.decay); st.idle[m.id]=0; } }
    }
    if(m.type==="number" && Number.isFinite(m.perMsg) && m.perMsg!==0) st.values[m.id]=rbFix(m,st.values[m.id]+m.perMsg);
  }
  if(clk&&st.clock){
    const before=st.clock.t;
    if(clk.mode==="date"){ if(clk.stepEvery>0){ st.clock.ctr=(st.clock.ctr||0)+1; if(st.clock.ctr>=clk.stepEvery){ st.clock.t+=1440; st.clock.ctr=0; } } }
    else st.clock.t+=(Number.isFinite(clk.stepMin)?clk.stepMin:0);
    if(skipDays>0){ st.clock.t+=skipDays*1440; st.clock.ctr=0; stats.fired.push(`${clk.label}: skipped ${skipDays} day${skipDays===1?"":"s"}`); }
    if(skipMin>0){ st.clock.t+=skipMin; stats.fired.push(`${clk.label}: skipped ${skipMin} min`); }
    if(st.clock.t!==before&&!stats.fired.some(x=>x.startsWith(clk.label+":"))) stats.clock=true;
  }

  // 4. dice that roll after the meters have settled
  const risen={}; for(const m of nums){ const d=st.values[m.id]-start[m.id]; if(d) risen[m.id]=d; }
  diceTurn("after_meters",risen);

  // 5. meter triggers (last, never chained: they read a snapshot and only move their own meter)
  const snap=Object.assign({},st.values);
  for(const g of (rb.meter_triggers||[])){
    if(g.on===false) continue;
    const om=ms.find(x=>x.id===g.m); if(!om||!rbIsNum(om)) continue;
    for(const tr of g.triggers){
      const holds=rbCondsOk(tr,st), go=rbGate(st,`t:${g.m}:${tr.id}`,holds,tr.fire||"cross",tr.every_turns);
      if(!go) continue;
      st.values[g.m]=rbFix(om,rbChange(st.values[g.m],tr.do,snap)); stats.fired.push(`${om.label}: trigger ${tr.id}`);
    }
  }

  for(const m of nums){ const d=Math.round((st.values[m.id]-start[m.id])*100)/100; if(d!==0) st.delta[m.id]=d; }
  stats.ms=Date.now()-t0; stats.changes=nums.filter(m=>st.delta[m.id]).map(m=>`${m.label} ${st.delta[m.id]>0?"+":""}${st.delta[m.id]}`);
  S.lastRbStats=stats;
  persistSession(); updateStatusUI();
}

/* ---- What the narrator is told ---- */
function rbJournalNewest(m,st,n){
  const seen=new Set(), out=[], arr=st.jrn[m.id]||[];
  for(let i=arr.length-1;i>=0&&out.length<n;i--){ const it=m.items.find(x=>x.id===arr[i].i); if(it&&!seen.has(it.id)){ seen.add(it.id); out.push(it); } }
  return out;
}
function rulebookContextString(){
  if(!S.rulebook||!S.rbState) return "";
  const st=S.rbState, out=[];
  for(const m of rbMeters()){
    const bits=[]; let tag="", pri=false;
    if(rbIsNum(m)){
      const v=st.values[m.id]; if(typeof v!=="number") continue;
      const lv=rbLevel(m,v); tag=lv.label;
      if(lv.instr){ bits.push(rbSub(lv.instr)); if(lv.override===true) pri=true; }
      if(m.tellModel===true) bits.push(`Exact value — ${m.label}: ${rbValueText(m,v)}.`);
    } else if(m.type==="clock"){
      if(!st.clock) continue; const cv=rbClockView(m,st), dims=rbClockDims(m);
      const labs=[]; if(cv.tod&&cv.dt) labs.push(cv.tod.label); if(cv.dayb&&dims.includes("day")) labs.push(cv.dayb.label); tag=labs.join(", ");
      if(dims.includes("tod")&&cv.tod&&cv.tod.instr){ bits.push(rbSub(cv.tod.instr)); if(cv.tod.override===true) pri=true; }
      if(dims.includes("day")&&cv.dayb&&cv.dayb.instr){ bits.push(rbSub(cv.dayb.instr)); if(cv.dayb.override===true) pri=true; }
      if(m.tellModel===true) bits.push(`It is ${cv.long}; story day ${cv.i.day}.`);
    } else if(m.type==="dice"){
      const d=st.dice[m.id]; if(!d) continue;
      const lv=rbLevel(m,d.roll); tag=lv.label;
      if(lv.instr){ bits.push(rbSub(lv.instr)); if(lv.override===true) pri=true; }
      if(m.tellModel===true) bits.push(`Latest roll: ${d.roll} on a d${m.sides}.`);
    } else if(m.type==="select"){
      const it=m.items.find(i=>i.id===st.sel[m.id]); if(!it) continue; tag=it.label;
      if(it.instruction) bits.push(rbSub(it.instruction));
      if(m.tellModel===true) bits.push(`Current: ${it.label}.`);
    } else if(m.type==="collection"){
      const held=m.items.filter(it=>rbCount(st,m,it.id)>0);
      for(const it of held) if(it.instruction) bits.push(rbSub(it.instruction));
      if(m.tellModel===true) bits.push(`${rbSub("{{user}}")} has: ${held.length?held.map(it=>it.kind==="counted"?`${it.label} ×${rbCount(st,m,it.id)}`:it.label).join(", "):"nothing"}.`);
    } else if(m.type==="journal"){
      if(m.tellModel!==false){ const l=rbJournalNewest(m,st,10); if(l.length) bits.push(`Already happened, newest first: ${l.map(it=>rbSub(it.label)).join("; ")}.`); }
    }
    if(bits.length) out.push(`- ${m.label}${tag?` (${tag})`:""}: ${pri?"PRIORITY \u2014 ":""}${bits.join(" ")}`);
  }
  for(const r of rbActiveRules()) if(r.instr) out.push(`- Situation: ${rbSub(r.instr)}`);
  return out.join("\n");
}

function orderFor(path,root){

  if(/\.keywords\.#$/.test(sig)&&sig.startsWith("rulebook.meters")) return ORD.keyword;

  if(/\.ai\.rules\.#$/.test(sig)) return ORD.aiRule;
  if(/\.ai\.rules\.#\.if$/.test(sig)||/\.rules\.#\.if$/.test(sig)) return ORD.if;

  if(sig==="rulebook.meter_triggers.#") return ORD.tgroup;

function parseSafe(text){

  const m=mk(ORD["meter:"+type],Object.assign(base,t));

/* ---- validation ---- */
function loreProblems(doc){
  const P=[], add=(k,t,i)=>P.push({k,t,i});
  if(!isObj(doc)||!Array.isArray(doc.entries)){ add("e",'No "entries" list.'); return P; }
  if(typeof doc.name!=="string"||!doc.name.trim()) add("w","The lorebook has no name.");
  else if(doc.name.length>100) add("w","Name is longer than 100 characters; the game shortens it.");
  if(typeof doc.description==="string"&&doc.description.length>500) add("w","Description is longer than 500 characters; the game shortens it.");
  if(doc.character_budget!==undefined){ const b=doc.character_budget; if(typeof b!=="number"||!(b>0)) add("w","Character budget is not a positive number; the game uses 8000."); else if(b>100000) add("w","Character budget above 100,000 is capped by the game."); }
  if(doc.entries.length>1000) add("e","More than 1000 entries (the game refuses the file).");
  if(!doc.entries.length) add("e","The lorebook has no entries.");
  const names=new Map();
  doc.entries.forEach((e,i)=>{
    const nm=(e&&e.name)||""; const lab=`Entry ${i+1}${nm?` "${nm}"`:""}`;
    if(!isObj(e)){ add("e",`${lab} is not an object.`,i); return; }
    if(!nm.trim()) add("w",`${lab}: no name (the game calls it "Untitled").`,i); else if(nm.length>100) add("w",`${lab}: name is over 100 characters.`,i);
    const keys=Array.isArray(e.keys)?e.keys:[];
    if(!keys.length) add("e",`${lab}: no keys, so the game drops this entry.`,i);
    if(keys.length>50) add("w",`${lab}: only the first 50 keys are used.`,i);
    const good=keys.slice(0,50).filter(k=>loreKeyOk(k));
    keys.forEach((k,j)=>{ if(!loreKeyOk(k)) add("w",`${lab}: key "${String(k).slice(0,30)}" is ignored (needs a letter or digit, at most 2 "*", max 64 characters).`,i); });
    if(keys.length&&!good.length) add("e",`${lab}: none of the keys are usable, so the game drops this entry.`,i);
    if(typeof e.content!=="string"||!e.content.trim()) add("e",`${lab}: no content, so the game drops this entry.`,i);
    else if(e.content.length>10000) add("w",`${lab}: content is over 10,000 characters; the game cuts it.`,i);
    if(!Number.isInteger(e.priority)||e.priority<1||e.priority>10) add("w",`${lab}: priority should be a whole number 1–10 (the game uses 5 if missing).`,i);
    const key=nm.trim().toLowerCase(); if(key){ if(names.has(key)) add("w",`${lab}: same name as entry ${names.get(key)+1}.`,i); else names.set(key,i); }
  });
  return P;
}
function loreKeyOk(k){ return typeof k==="string"&&k.length<=64&&/[\p{L}\p{N}]/u.test(k)&&((k.match(/\*/g)||[]).length<=2); }
function ruleProblems(doc){
  const P=[];
  const se=rbValidateSchema(doc);
  for(const e of se) P.push({k:"e",t:`${e.path||"(file)"}: ${e.msg}`,path:e.path||""});
  if(se.length) return P;
  let sem; try{ sem=rbSemantic(clone(doc.rulebook)); }catch(e){ P.push({k:"e",t:"Could not check the rulebook: "+e.message}); return P; }
  for(const t of sem.errors) P.push({k:"e",t});
  for(const t of sem.warnings) P.push({k:"w",t});
  const kw=(w,where)=>{ for(const x of (w||[])) if(!loreKeyOk(String(x))) P.push({k:"w",t:`${where}: keyword "${String(x).slice(0,30)}" is ignored by the game (needs a letter or digit, at most 2 "*").`}); };
  doc.rulebook.meters.forEach(m=>{
    for(const k of (m.keywords||[])) kw(k.words,`"${m.label}"`);
    if(m.type==="journal") for(const it of m.items) kw(it.cues,`"${m.label}" event "${it.label}"`);
    if(m.type==="dice"&&m.rollWhen) kw(m.rollWhen.keywords,`"${m.label}"`);
  });
  return P;
}
/* which section a problem belongs to */
function ruleTarget(p){
  const doc=ST.rule.doc, ms=doc&&doc.rulebook&&Array.isArray(doc.rulebook.meters)?doc.rulebook.meters:[];
  if(p.path!==undefined){
    const path=p.path.replace(/\[(\d+)\]/g,".$1").split(".").filter(Boolean);
    if(path[0]==="rulebook"&&path[1]==="meters"&&/^\d+$/.test(path[2]||"")) return {k:"meter",i:+path[2]};
    if(path[0]==="rulebook"&&path[1]==="meter_triggers"&&/^\d+$/.test(path[2]||"")){ const g=getAt(doc,path.slice(0,3)); const i=ms.findIndex(m=>g&&m.id===g.m); if(i>=0) return {k:"meter",i}; }
    if(path[0]==="rulebook"&&path[1]==="combined_rules") return {k:"combined",i:0};
    return {k:"details",i:0};
  }
  const t=p.t||"";
  const q=[...t.matchAll(/"([^"]{1,64})"/g)].map(m=>m[1]);
  for(const s of q){ const i=ms.findIndex(m=>m.id===s||m.label===s); if(i>=0) return {k:"meter",i}; }
  if(/[Cc]ombined rule/.test(t)) return {k:"combined",i:0};
  return {k:"details",i:0};
}
function validate(){
  const t=ST.tab;
  try{ ST.problems[t]=t==="rule"?ruleProblems(ST[t].doc):loreProblems(ST[t].doc); }
  catch(e){ ST.problems[t]=[{k:"e",t:"Validation failed: "+e.message}]; }
}

function renderLoreTest(){
  const out=$("#ltOut"); if(!out) return; const d=ST.lore.doc, text=loreNorm(ST.lore.test||"");
  if(!text.trim()){ out.innerHTML=""; return; }
  const budget=(typeof d.character_budget==="number"&&d.character_budget>0)?Math.min(100000,Math.floor(d.character_budget)):8000;
  const hit=d.entries.map((e,i)=>({e,i})).filter(({e})=>Array.isArray(e.keys)&&typeof e.content==="string"&&e.content.trim()&&e.keys.some(k=>{ try{ return loreKeyOk(k)&&loreKeyRegex(String(k)).test(text); }catch(x){ return false; } }));
  let used=0, rows=[];
  for(let pr=1;pr<=10;pr++) for(const {e,i} of hit.filter(x=>(Math.min(10,Math.max(1,Math.round(Number(x.e.priority))||5)))===pr)){
    const len=Math.min(10000,e.content.trim().length), fits=used+len<=budget; if(fits) used+=len; rows.push({e,i,pr,len,fits});
  }
  out.innerHTML=rows.length?`<div class="msg ok">${rows.length} triggered · ${used.toLocaleString()} of ${budget.toLocaleString()} characters used${rows.some(r=>!r.fits)?` · <b>${rows.filter(r=>!r.fits).length} would be skipped</b> (didn't fit)`:""}</div>`+rows.map(r=>`<div style="padding:3px 0;font-size:13px;opacity:${r.fits?1:.5}"><span class="pr">P${r.pr}</span> <a href="#" data-a="lSel" data-i="${r.i}" style="color:var(--accHi)">${esc(r.e.name||"(no name)")}</a> <span class="count">${r.len} chars${r.fits?"":" · skipped"}</span></div>`).join(""):`<div class="msg">No entries triggered.</div>`;
}
document.addEventListener("click",e=>{

  else if(act==="lAdd"){ L.doc.entries.push(mk(ORD.lentry,{name:"New entry",keys:[],content:"",priority:5})); L.sel=L.doc.entries.length-1; touch(); render(); }
  else if(act==="lSort"){ const ents=L.doc.entries, cur=ents[L.sel]; ents.sort((x,y)=>(x.priority||5)-(y.priority||5)); L.sel=Math.max(0,ents.indexOf(cur)); touch(); render(); }
  else if(["up","down","del","dup"].includes(act)&&a.dataset.p.startsWith("entries.")){
    const path=a.dataset.p.split("."), i=+path[1], ents=L.doc.entries;
    if(act==="up"&&i>0){ [ents[i-1],ents[i]]=[ents[i],ents[i-1]]; L.sel=i-1; }
    else if(act==="down"&&i<ents.length-1){ [ents[i+1],ents[i]]=[ents[i],ents[i+1]]; L.sel=i+1; }
    else if(act==="dup"){ const c=clone(ents[i]); c.name=(c.name||"Entry")+" (copy)"; ents.splice(i+1,0,c); L.sel=i+1; }

  }
});

/* ---------- id plumbing ---------- */
function renameMeterRefs(oldId,newId){
  const rb=RB(), fix=a=>{ for(const c of (a||[])) if(c&&c.m===oldId) c.m=newId; };
  for(const m of rb.meters){
    if(m.ai&&Array.isArray(m.ai.rules)) for(const r of m.ai.rules){ if(r.m===oldId) r.m=newId; if(r.if) fix(r.if.when); }
    if(m.rollWhen){ const rw=m.rollWhen; if(Array.isArray(rw.meter_rises)) rw.meter_rises=rw.meter_rises.map(x=>x===oldId?newId:x); if(rw.meter_conditions) for(const c of (rw.meter_conditions.conditions||[])) if(c.meter_id===oldId) c.meter_id=newId; }
  }
  for(const c of (rb.combined_rules||[])) fix(c.conds);
  for(const g of (rb.meter_triggers||[])){ if(g.m===oldId) g.m=newId; for(const t of g.triggers){ fix(t.when); if(t.do&&t.do.m===oldId) t.do.m=newId; } }
}
function renameItemRefs(meter,oldId,newId){
  const rb=RB(), fix=a=>{ for(const c of (a||[])) if(c&&c.m===meter.id&&c.item===oldId) c.item=newId; };
  if(meter.def===oldId) meter.def=newId;
  for(const r of (meter.rules||[])) if(r.item===oldId) r.item=newId;
  for(const r of (meter.journal_rules||[])) if(r.item===oldId) r.item=newId;
  for(const m of rb.meters){ if(m.ai&&m.ai.rules) for(const r of m.ai.rules) if(r.if) fix(r.if.when); }
  for(const c of (rb.combined_rules||[])) fix(c.conds);
  for(const g of (rb.meter_triggers||[])) for(const t of g.triggers) fix(t.when);
}
const MID_RX=/^[a-z][a-z0-9_-]{0,63}$/, IID_RX=/^[a-z0-9_-]{1,40}$/;
SPECIAL.meterid=(el,path,val)=>{
  const m=getAt(ST.rule.doc,path.slice(0,-1)), old=m.id, nv=val.v||"";
  if(nv===old) return;
  if(!MID_RX.test(nv)||BAD_IDS.has(nv)||MS().some(x=>x!==m&&x.id===nv)){ el.value=old; toast(!MID_RX.test(nv)?"Ids start with a letter and use only a–z, 0–9, - and _.":BAD_IDS.has(nv)?"That id is reserved.":"Another meter already has that id."); return; }
  AUTO.delete(m); m.id=nv; renameMeterRefs(old,nv);
};
SPECIAL.itemid=(el,path,val)=>{
  const it=getAt(ST.rule.doc,path.slice(0,-1)), meter=getAt(ST.rule.doc,path.slice(0,-3)), old=it.id, nv=val.v||"";
  if(nv===old) return;
  if(!IID_RX.test(nv)||meter.items.some(x=>x!==it&&x.id===nv)){ el.value=old; toast(!IID_RX.test(nv)?"Item ids use only a–z, 0–9, - and _ (max 40).":"Another item already has that id."); return; }
  AUTO.delete(it); it.id=nv; renameItemRefs(meter,old,nv);
};
/* label field that also keeps a freshly created id in step */
SPECIAL.label=(el,path,val)=>{

    if(MID_RX.test(nid)&&!BAD_IDS.has(nid)&&nid!==obj.id){ const old=obj.id; obj.id=nid; renameMeterRefs(old,nid); const inp=$(`[data-p="${pp([...path.slice(0,-1),"id"])}"]`); if(inp) inp.value=nid; }

    if(IID_RX.test(nid)&&nid!==obj.id){ const old=obj.id; obj.id=nid; renameItemRefs(meter,old,nid); const inp=$(`[data-p="${pp([...path.slice(0,-1),"id"])}"]`); if(inp) inp.value=nid; }
  }
};
SPECIAL.metertype=(el,path,val)=>{

SPECIAL.chgkind=(el,path,val)=>{
  const o=getAt(ST.rule.doc,path), nk=val.v, order=orderFor(path,ST.rule.doc);

/* ---------- conditions ---------- */
function opsFor(m){
  if(!m) return [];
  if(NUMERIC.has(m.type)||m.type==="dice") return [[">=","is at least"],[">","is more than"],["<=","is at most"],["<","is less than"],["=","is exactly"]];
  if(m.type==="clock") return [["tod","time of day is"],["day>=","story day is at least"],["day<=","story day is at most"],["day=","story day is"],["weekday","weekday is one of"],["date","date is"]];
  if(m.type==="select") return [["is","is"],["is_not","is not"]];
  if(m.type==="collection") return [["has>=","has at least"],["has<=","has at most"],["holds>=","holds at least … kinds of items"],["holds<=","holds at most … kinds of items"]];
  if(m.type==="journal") return [["gte","at least … since the event"],["lte","at most … since the event"]];
  return [];
}
function condDefaults(m,op){
  const it0=m&&m.items&&m.items[0]?m.items[0].id:"";
  switch(op){
    case "tod": return {v:0};
    case "day>=": case "day<=": case "day=": return {v:1};
    case "weekday": return {days:[1]};
    case "date": return {month:1,day:1};
    case "is": case "is_not": return {item:it0};
    case "has>=": case "has<=": return {item:it0,v:1};
    case "holds>=": case "holds<=": return {v:1};
    case "gte": case "lte": return {item:it0,v:1,since:"turns"};
    default: return {v:0};
  }
}
function condBuild(mid,op,m){ return mk(ORD.cond,Object.assign({m:mid,op},condDefaults(m,op))); }
SPECIAL.condmeter=(el,path,val)=>{
  const cpath=path.slice(0,-1), o=getAt(ST.rule.doc,cpath), m=MS().find(x=>x.id===val.v), ops=opsFor(m);
  const nc=condBuild(val.v,ops[0]?ops[0][0]:">=",m); for(const k of Object.keys(o)) delete o[k]; Object.assign(o,nc);
};
SPECIAL.condop=(el,path,val)=>{
  const cpath=path.slice(0,-1), o=getAt(ST.rule.doc,cpath), m=MS().find(x=>x.id===o.m), nc=condBuild(o.m,val.v,m);
  for(const k of Object.keys(o)) delete o[k]; Object.assign(o,nc);
};

  let val="";
  const itemSel=()=>fSel(P("item"),"Item",(m&&m.items||[]).map(i=>[i.id,i.label]).concat(m&&m.items&&m.items.some(i=>i.id===c.item)?[]:[[c.item||"","(choose)"]]));
  switch(c.op){

    case "weekday": val=`<div class="f"><span>Days</span><div class="chips">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map((d,i)=>`<button type="button" class="chip${(c.days||[]).includes(i)?" on":""}" data-a="wd" data-p="${pp(P("days"))}" data-day="${i}">${d}</button>`).join("")}</div></div>`; break;

function meterAction(a,i){
  const ms=MS(), m=ms[i], rb=RB();
  if(a==="del"){
    const refs=countRefs(m.id);
    if(!window.confirm(`Delete "${m.label}"?${refs?`\n\n${refs} rule${refs===1?"":"s"} elsewhere still point at it; they will show as errors until you fix them.`:""}`)) return;
    ms.splice(i,1);
    if(rb.meter_triggers){ rb.meter_triggers=rb.meter_triggers.filter(g=>g.m!==m.id); if(!rb.meter_triggers.length) delete rb.meter_triggers; }
    ST.rule.sec=ms.length?{k:"meter",i:Math.min(i,ms.length-1)}:{k:"details",i:0};
  } else if(a==="dup"){
    if(ms.length>=15){ toast("A rulebook can have at most 15 meters."); return; }
    if(m.type==="clock"){ toast("A rulebook can have only one story clock."); return; }
    const c=clone(m), taken=new Set(ms.map(x=>x.id)); c.id=uniqueId((m.id+"-copy").slice(0,50),taken,"meter"); c.label=(m.label+" (copy)").slice(0,40);
    ms.splice(i+1,0,c); ST.rule.sec={k:"meter",i:i+1};
  } else {
    const j=i+(a==="up"?-1:1); if(j<0||j>=ms.length) return; [ms[i],ms[j]]=[ms[j],ms[i]]; ST.rule.sec={k:"meter",i:j};
  }
  touch(); render();
}
function countRefs(id){
  const txt=JSON.stringify(RB()); const own=JSON.stringify(MS().find(m=>m.id===id)); const re=new RegExp('"(m|meter_id)":"'+id.replace(/[-]/g,"\\-")+'"',"g");
  return (txt.match(re)||[]).length+((RB().meter_triggers||[]).some(g=>g.m===id)?0:0);
}

function previewSetClock(m,date,hh,mm){
  const st=S.rbState; if(!st.clock) return; const base=rbClockStart(m), info=rbClockInfo(m,st.clock.t);
  const p=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date||""); if(!p) return;
  const h=Number.isFinite(hh)?Math.max(0,Math.min(23,Math.round(hh))):info.hh, mi=Number.isFinite(mm)?Math.max(0,Math.min(59,Math.round(mm))):info.mi;
  const ms=Date.UTC(+p[1],+p[2]-1,+p[3],h,mi); if(Number.isFinite(ms)&&+p[1]>=100) st.clock.t=Math.round((ms-base)/60000);
}

ST.dark=!(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches);
loadFresh("lore"); loadFresh("rule"); ST.tab="rule";
try{
  for(const t of ["rule","lore"]){
    const raw=localStorage.getItem("woven_editor_draft_"+t); if(!raw) continue;
    const d=JSON.parse(raw); if(!d||!d.doc) continue;
    if(window.confirm("Restore your unsaved "+(t==="rule"?"rulebook":"lorebook")+" draft"+(d.name?" ("+d.name+")":"")+"?")){ ST[t].doc=d.doc; ST[t].name=d.name||""; ST[t].dirty=true; ST.tab=t; }
    else clearDraft(t);
  }
}catch(e){}
applyTheme(); validate(); render();

</script>
</body>
</html>
